<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Launcher routes alignment fixture</title>
    <link rel="stylesheet" href="../src/components/AppLauncherCard.css" />
    <style>
      :root {
        --border: #334155;
        --surface: #0f172a;
        --surface-2: #1e293b;
        --surface-3: #111827;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --primary: #0099dc;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        --bg: #020617;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        font-family: Inter, system-ui, sans-serif;
      }

      .fixture-wrap {
        width: 120px;
      }
    </style>
  </head>
  <body>
    <div class="fixture-wrap launcher-pinned-grid-item">
      <div class="launcher-app-tile expanded" id="tile">
        <a href="#" class="launcher-app-main">
          <span class="launcher-app-icon">📊</span>
          <div class="launcher-app-container-name">
            <span class="launcher-app-name">DELPI Indicadores</span>
          </div>
        </a>
        <div
          class="launcher-inline-routes-panel is-expanded launcher-inline-routes-panel--launcher"
        >
          <div class="launcher-inline-routes-panel__inner">
            <div class="launcher-inline-routes-center">
              <div class="launcher-inline-routes" id="routes">
              <a href="#" class="launcher-inline-route">
                <span>Painel Estratégico</span>
              </a>
              <a href="#" class="launcher-inline-route"><span>Departamentos</span></a>
              <a href="#" class="launcher-inline-route"><span>Indicadores</span></a>
              <a href="#" class="launcher-inline-route"><span>Tendências</span></a>
              <a href="#" class="launcher-inline-route"><span>Alertas</span></a>
              <a href="#" class="launcher-inline-route">
                <span>Modo Apresentação</span>
              </a>
              <a href="#" class="launcher-inline-route"><span>Configurações</span></a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

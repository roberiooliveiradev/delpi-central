permissions:
  contents: read

jobs:
  disposable-postgres:
    name: Real PostgreSQL transactions, ephemeral only
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atlas_ci_disposable
          POSTGRES_USER: atlas_ci
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas_ci -d atlas_ci_disposable"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ATLAS_DISPOSABLE_PG: "true"
      ATLAS_ISOLATED_PG_DSN: "host=127.0.0.1 port=5432 dbname=atlas_ci_disposable user=atlas_ci password=ci-disposable-only connect_timeout=5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact backend test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r it-portal-api/requirements.txt
          python -m pip install --disable-pip-version-check ./shared
      - name: Verify SQL, OCI bindings and concurrent writes on disposable PostgreSQL
        run: |
          PYTHONPATH=it-portal-api PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider \
            it-portal-api/tests/integration/test_atlas_postgres_journal.py \
            it-portal-api/tests/unit/test_atlas_deploy_oci_seal.py \
            it-portal-api/tests/unit/test_atlas_deploy_oci_attestation.py \
            it-portal-api/tests/unit/test_atlas_deploy_oci_registry.py \
            it-portal-api/tests/unit/test_atlas_deploy_oci_release_evidence.py \
            it-portal-api/tests/unit/test_atlas_deploy_readiness_review.py \
            it-portal-api/tests/unit/test_atlas_deploy_full_readiness.py \
            it-portal-api/tests/unit/test_atlas_deploy_hml_admission.py \
            it-portal-api/tests/unit/test_atlas_deploy_hml_s2s_recovery.py

  disposable-docker:
    name: Real Docker read-only inspection, ephemeral only
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ATLAS_DISPOSABLE_DOCKER: "true"
      ATLAS_REAL_HML_CHAIN_CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated Python test tools
        run: python -m pip install --disable-pip-version-check pytest 'httpx>=0.27,<1'
      - name: Start ephemeral, labeled pilot on CI host only
        run: |
          docker run -d --rm --name atlas-ci-pilot-hml \
            --label com.docker.compose.project=atlas-ci-hml \
            --label com.docker.compose.service=atlas-ci-pilot \
            --health-cmd 'test -f /etc/os-release' \
            --health-interval 1s --health-retries 10 \
            alpine:3.20 sleep 120
          for i in $(seq 1 30); do
            state=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' atlas-ci-pilot-hml)
            if [ "$state" = healthy ]; then exit 0; fi
            sleep 1
          done
          echo 'Ephemeral CI Docker pilot failed health readiness'
          exit 1
      - name: Start separate ephemeral HML-target fixture on CI host only
        run: |
          test "$(id -u)" != "0"
          docker run -d --rm --name delpi-hml-public-hub \
            --label com.docker.compose.project=delpi-hml \
            --label com.docker.compose.service=public-hub \
            --health-cmd 'test -f /etc/os-release' \
            --health-interval 1s --health-retries 10 \
            alpine:3.20 sleep 600
          for i in $(seq 1 30); do
            state=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' delpi-hml-public-hub)
            if [ "$state" = healthy ]; then exit 0; fi
            sleep 1
          done
          echo 'Ephemeral HML-target Docker fixture failed health readiness'
          exit 1
      - name: Verify real Docker Engine GET and fail-closed receipt
        run: |
          PYTHONPATH=linux-ops-mcp:it-portal-api PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider \
            linux-ops-mcp/tests/test_deploy_host_runtime_v2.py \
            linux-ops-mcp/tests/test_deploy_host_oci_preflight.py \
            linux-ops-mcp/tests/test_deploy_git_checkout_readonly.py \
            linux-ops-mcp/tests/test_deploy_host_checkout_evidence_bundle.py \
            linux-ops-mcp/tests/test_atlas_cross_context_host_contract.py \
            linux-ops-mcp/tests/test_atlas_hml_local_probe.py \
            linux-ops-mcp/tests/test_atlas_hml_git_head_peek.py \
            linux-ops-mcp/tests/test_atlas_hml_unix_proxy.py \
            linux-ops-mcp/tests/test_atlas_hml_boundary_chain.py \
            linux-ops-mcp/tests/test_atlas_hml_collector_isolation.py \
            linux-ops-mcp/tests/test_atlas_hml_host_review_bundle.py \
            linux-ops-mcp/tests/test_atlas_hml_snapshot_candidate.py \
            linux-ops-mcp/tests/test_atlas_hml_real_engine_chain_ci.py \
            linux-ops-mcp/tests/test_atlas_docker_engine_ci.py
      - name: Remove only the ephemeral pilot
        if: always()
        run: |
          docker rm -f delpi-hml-public-hub >/dev/null 2>&1 || true
          docker rm -f atlas-ci-pilot-hml >/dev/null 2>&1 || true

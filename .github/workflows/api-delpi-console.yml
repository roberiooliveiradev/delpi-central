name: api-delpi console

on:
  push:
    paths:
      - "api-delpi/**"
      - "plugins/api-delpi-console/**"
      - "scripts/homologacao/check-api-delpi-console.sh"
      - ".github/workflows/api-delpi-console.yml"
  pull_request:
    paths:
      - "api-delpi/**"
      - "plugins/api-delpi-console/**"
      - "scripts/homologacao/check-api-delpi-console.sh"
      - ".github/workflows/api-delpi-console.yml"

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-delpi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api-delpi/requirements.txt

      - name: Instalar dependências
        run: |
          pip install -e ../shared[fastapi]
          pip install -r requirements.txt

      - name: Testes Fases 2–5 (observabilidade, contrato e alertas)
        run: |
          PYTHONPATH=. pytest \
            tests/test_sql_health_aggregator.py \
            tests/test_sql_query_telemetry_service.py \
            tests/test_sql_telemetry_composer.py \
            tests/test_redis_sql_telemetry_store.py \
            tests/test_query_cache_stats_service.py \
            tests/test_query_cache_composer.py \
            tests/test_caller_request_stats_service.py \
            tests/test_system_observability_routes.py \
            tests/test_openapi_diff_service.py \
            tests/test_envelope_contract_service.py \
            tests/test_smoke_definitions_service.py \
            tests/test_console_alerts_service.py \
            tests/test_console_portal_notification_service.py \
            tests/test_system_console_alerts_routes.py \
            -q

  console-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/api-delpi-console
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins/api-delpi-console/package-lock.json

      - name: Build MFE
        run: |
          npm ci
          npm run build

name: Line Balance Studio · GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'plugins/delpi-line-balance-studio/**'
      - 'plugins/plugin-ui/**'
      - 'portal/src/theme-tokens.css'
      - '.github/workflows/line-balance-studio-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: line-balance-studio-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/delpi-line-balance-studio
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/delpi-line-balance-studio/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:preview
      - run: npx playwright install --with-deps chromium
      - run: npm run test:preview
      - uses: actions/upload-pages-artifact@v3
        with:
          path: plugins/delpi-line-balance-studio/preview-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish Studio demo
        id: deploy
        uses: actions/deploy-pages@v4

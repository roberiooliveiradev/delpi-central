name: Cursor Rules Governance

on:
  pull_request:
    paths:
      - ".cursor/rules/**"
      - ".cursor/plans/**"
      - "scripts/audit_cursor_rules.py"
      - "scripts/audit_chat_ai_canonical_docs.py"
      - "minha-delpi-ai-api/docs/README.md"
      - "minha-delpi-ai-api/docs/architecture/**"
      - "minha-delpi-ai-api/docs/api/04-actions-openapi.md"
      - "minha-delpi-ai-api/docs/development/guia-desenvolvimento.md"
      - "minha-delpi-ai-api/docs/testing/**"
      - "minha-delpi-ai-api/docs/flows/**"
      - "minha-delpi-ai-api/docs/roadmap/**"
      - "minha-delpi-ai-api/docs/changelog/**"
      - "docs/12-roadmap-e-evolucao/**"
      - ".github/workflows/cursor-rules-governance.yml"
  push:
    branches:
      - main
    paths:
      - ".cursor/rules/**"
      - ".cursor/plans/**"
      - "scripts/audit_cursor_rules.py"
      - "scripts/audit_chat_ai_canonical_docs.py"
      - "minha-delpi-ai-api/docs/README.md"
      - "minha-delpi-ai-api/docs/architecture/**"
      - "minha-delpi-ai-api/docs/api/04-actions-openapi.md"
      - "minha-delpi-ai-api/docs/development/guia-desenvolvimento.md"
      - "minha-delpi-ai-api/docs/testing/**"
      - "minha-delpi-ai-api/docs/flows/**"
      - "minha-delpi-ai-api/docs/roadmap/**"
      - "minha-delpi-ai-api/docs/changelog/**"
      - "docs/12-roadmap-e-evolucao/**"
      - ".github/workflows/cursor-rules-governance.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Cursor rules
        run: python scripts/audit_cursor_rules.py

      - name: Audit canonical Chat AI guidance
        run: python scripts/audit_chat_ai_canonical_docs.py

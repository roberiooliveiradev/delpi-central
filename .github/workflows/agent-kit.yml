name: Agent kit (delpi-verifier)

on:
  pull_request:
    paths:
      - "agent-kit/**"
      - ".github/workflows/agent-kit.yml"
  push:
    branches:
      - main
    paths:
      - "agent-kit/**"
      - ".github/workflows/agent-kit.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test agent kit (hooks, build, install, eval integrity)
        working-directory: agent-kit
        run: |
          git config --global user.email "ci@delpi"
          git config --global user.name "ci"
          python -m unittest discover -s tests -v

      - name: Render agents (smoke)
        run: python agent-kit/scripts/build.py --out /tmp/dak-dist --cursor-model ci-model --devin-model ci-model

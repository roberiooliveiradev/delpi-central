name: minha-delpi-ai-api presentation

on:
  push:
    paths:
      - "minha-delpi-ai-api/**"
      - "plugins/minha-delpi-chat/**"
      - "api-delpi/app/content/openapi_baseline.json"
      - ".github/workflows/minha-delpi-ai-api-presentation.yml"
  pull_request:
    paths:
      - "minha-delpi-ai-api/**"
      - "plugins/minha-delpi-chat/**"
      - "api-delpi/app/content/openapi_baseline.json"
      - ".github/workflows/minha-delpi-ai-api-presentation.yml"

jobs:
  mfe-presentation-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/minha-delpi-chat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins/minha-delpi-chat/package-lock.json

      - name: Instalar dependências MFE
        run: npm ci

      - name: Build MFE (tsc + vite)
        run: npm run build

      - name: Testes P6 render-only (vitest)
        run: |
          npm run test -- --run \
            src/ui/components/presentation/segmentBuilders/renderPlanSegmentBuilder.test.ts \
            src/ui/components/presentation/segmentBuilders/visualSegmentCollector.test.ts \
            src/ui/components/presentationRenderHints.test.ts \
            src/ui/components/presentationStructureDedup.test.ts \
            src/ui/components/message/assistantContentSegments.test.ts \
            src/ui/components/presentationStackPlan.humanized.test.ts

  presentation-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minha-delpi-ai-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: minha-delpi-ai-api/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gate perfis OpenAPI × presentation_profiles
        run: PYTHONPATH=. python scripts/audit_presentation_coverage.py --check-profiles

      - name: Gate role em tabelas tier A (tierAPipelineCases)
        run: PYTHONPATH=. python scripts/audit_presentation_coverage.py --check-table-roles

      - name: Alerta visualBuilders vs viewOrder
        run: PYTHONPATH=. python scripts/audit_presentation_coverage.py --check-visual-builders

      - name: Gate chips pós-resposta tier A
        run: PYTHONPATH=. python scripts/audit_presentation_coverage.py --check-interactivity-chips

      - name: Gate Playbook 12 consolidado (R12)
        run: PYTHONPATH=. python scripts/audit_presentation_coverage.py --check-playbook12

      - name: Gate Playbook 13 respostas humanizadas (P5)
        run: PYTHONPATH=. python scripts/audit_presentation_coverage.py --check-humanized-answer

      - name: Gate Playbook 13 P6 renderPlan tier A
        run: PYTHONPATH=. python scripts/audit_presentation_coverage.py --check-render-plan

      - name: Gate Playbook 13 P6 MFE render-only
        run: PYTHONPATH=. python scripts/audit_mfe_presentation_logic.py

      - name: Testes contrato render P6 e cobertura por entidade
        run: |
          PYTHONPATH=. pytest \
            tests/unit/domain/services/test_presentation_render_contract.py \
            tests/unit/domain/services/test_chat_presentation_coverage_service.py \
            tests/unit/domain/services/test_chat_presentation_entity_contract.py \
            tests/unit/domain/services/test_chat_presentation_profile_service.py \
            tests/unit/domain/services/test_chat_presentation_recommendation_service.py \
            tests/unit/domain/services/test_chat_presentation_format_vocabulary_service.py \
            tests/unit/domain/services/test_chat_pagination_consolidation_service.py \
            tests/unit/application/use_cases/test_presentation_session_format_respected.py \
            tests/unit/application/use_cases/test_playbook_presentation_pipeline_regression.py \
            tests/unit/domain/services/test_chat_presentation_table_role_service.py \
            tests/unit/domain/services/test_tier_a_presentation_interactivity.py \
            tests/unit/domain/services/test_chat_presentation_profile_auto_chart.py \
            tests/unit/domain/services/test_playbook12_regression_suite.py \
            tests/unit/domain/services/test_presentation_refactor_baseline.py \
            tests/unit/domain/services/test_chat_humanized_response_quality_service.py \
            tests/unit/fixtures/test_humanized_data_response_gate.py \
            tests/unit/fixtures/test_presentation_render_plan_gate.py \
            tests/unit/application/test_presentation_mfe_parity.py \
            -q

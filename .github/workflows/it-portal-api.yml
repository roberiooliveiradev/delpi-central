name: Portal de TI - API

on:
  pull_request:
    paths:
      - "it-portal-api/**"
      - "shared/delpi_auth/**"
      - ".github/workflows/it-portal-api.yml"
  push:
    branches:
      - main
    paths:
      - "it-portal-api/**"
      - "shared/delpi_auth/**"
      - ".github/workflows/it-portal-api.yml"

permissions:
  contents: read

jobs:
  test-it-portal-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r it-portal-api/requirements.txt
          python -m pip install -e './shared[dev]'
      - name: Check Windows SCM PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            'it-portal-api/collectors/windows_host/Collect-ItPortalWindowsInventory.ps1'
            'it-portal-api/collectors/windows_host/Send-ItPortalWindowsObservation.ps1'
            'it-portal-api/collectors/windows_host/Invoke-ItPortalWindowsScheduledObservation.ps1'
            'it-portal-api/collectors/windows_host/Install-ItPortalWindowsScheduledCollection.ps1'
            'it-portal-api/collectors/windows_host/Collect-ItPortalWindowsServices.ps1'
            'it-portal-api/collectors/windows_host/Send-ItPortalWindowsServices.ps1'
            'it-portal-api/collectors/windows_host/Invoke-ItPortalWindowsScheduledServices.ps1'
            'it-portal-api/collectors/windows_host/Install-ItPortalWindowsScheduledServices.ps1'
            'it-portal-api/collectors/windows_workstation/Collect-ItPortalWorkstationSnapshot.ps1'
            'it-portal-api/collectors/windows_workstation/Send-ItPortalWorkstationSnapshot.ps1'
            'it-portal-api/collectors/windows_workstation/Invoke-ItPortalWorkstationScheduledSnapshot.ps1'
            'it-portal-api/collectors/windows_workstation/Install-ItPortalWorkstationAgent.ps1'
            'it-portal-api/collectors/windows_workstation/Enable-ItPortalWorkstationAgent.ps1'
            'it-portal-api/collectors/windows_workstation/Uninstall-ItPortalWorkstationAgent.ps1'
            'it-portal-api/collectors/windows_workstation/Test-ItPortalWorkstationAgentPlan.ps1'
            'it-portal-api/collectors/windows_host/Invoke-ItPortalWindowsServiceControlAgent.ps1'
            'it-portal-api/collectors/windows_host/Install-ItPortalWindowsServiceControlAgent.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Error ("Script invalido: {0} ({1} erros)" -f $file, $errors.Count)
              exit 1
            }
          }
      - name: G2-S3 PowerShell plan mode is non-mutating
        shell: pwsh
        run: |
          & 'it-portal-api/collectors/windows_workstation/Test-ItPortalWorkstationAgentPlan.ps1'
      - name: G0-SEC Delpi Remote offline gate (must remain BLOCKED)
        working-directory: it-portal-api
        run: python -m it_portal_app.domain.remote_security_readiness --repo-root ..
      - name: G0-SEC-S1 MeshCentral offline candidate admission (must remain BLOCKED)
        working-directory: it-portal-api
        run: python -m it_portal_app.domain.remote_engine_lab_intake --repo-root ..
      - name: G0-SEC-S2 draft policy and recovery review (must remain BLOCKED)
        working-directory: it-portal-api
        run: python -m it_portal_app.domain.remote_policy_review --repo-root ..
      - name: Unit and HTTP tests
        working-directory: it-portal-api
        run: python -m pytest -q
      - name: Real Postgres SCM / control integration
        working-directory: it-portal-api
        env:
          IT_PORTAL_TEST_DSN: postgresql://postgres:test-password@localhost:5432/postgres
        run: python -m pytest -q tests/test_postgres_host_services.py

      - name: Real PostgreSQL migrations and G1/G2 inventory integration
        working-directory: it-portal-api
        env:
          IT_PORTAL_TEST_DSN: postgresql://postgres:test-password@localhost:5432/postgres
        run: python -m pytest -q tests/test_postgres_integration.py

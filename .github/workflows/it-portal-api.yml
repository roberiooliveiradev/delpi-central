name: Portal de TI - API

on:
  pull_request:
    paths:
      - "it-portal-api/**"
      - "shared/delpi_auth/**"
      - ".github/workflows/it-portal-api.yml"

permissions:
  contents: read

jobs:
  test-it-portal-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r it-portal-api/requirements.txt
          python -m pip install -e './shared[dev]'
      - name: Unit and HTTP tests
        working-directory: it-portal-api
        run: python -m pytest -q
      - name: Real Postgres V006 integration
        working-directory: it-portal-api
        env:
          IT_PORTAL_TEST_DSN: postgresql://postgres:test-password@localhost:5432/postgres
        run: python -m pytest -q tests/test_postgres_host_services.py

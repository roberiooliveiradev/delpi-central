name: Linux Ops MCP Readonly Tests

on:
  pull_request:
    paths:
      - "linux-ops-mcp/**"
      - "shared/delpi_auth/**"
      - "shared/delpi_mcp/**"
      - "shared/pyproject.toml"
      - ".github/workflows/linux-ops-mcp-readonly.yml"
      - "it-portal-api/it_portal_app/infrastructure/persistence/atlas_deploy_host_receipt_bridge.py"
  push:
    branches: [main]
    paths:
      - "linux-ops-mcp/**"
      - "shared/delpi_auth/**"
      - "shared/delpi_mcp/**"
      - "shared/pyproject.toml"
      - ".github/workflows/linux-ops-mcp-readonly.yml"
      - "it-portal-api/it_portal_app/infrastructure/persistence/atlas_deploy_host_receipt_bridge.py"

permissions:
  contents: read

jobs:
  read-only-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install adapter + shared packages
        run: |
          python -m pip install --disable-pip-version-check -r linux-ops-mcp/requirements.txt
          python -m pip install --disable-pip-version-check ./shared pytest
      - name: Compile app (no import side effects)
        run: python -m compileall -q linux-ops-mcp/linux_ops_mcp
      - name: Unit tests and auth negatives
        run: PYTHONPATH=linux-ops-mcp:it-portal-api python -m pytest -q linux-ops-mcp/tests
      - name: ATLAS HML local preflight smoke (always BLOCKED)
        run: |
          set -o pipefail
          PYTHONPATH=linux-ops-mcp python -B -m linux_ops_mcp.atlas_hml_local_probe | python -c 'import json,sys; x=json.load(sys.stdin); assert x["status"] == "blocked" and x["prepare_eligible"] is False and x["can_execute"] is False; print("HML local preflight remains blocked")'
      - name: ATLAS HML collector isolation CLI smoke (always BLOCKED)
        run: |
          set -o pipefail
          PYTHONPATH=linux-ops-mcp python -B -m linux_ops_mcp.atlas_hml_collector_isolation | python -c 'import json,sys; r=json.load(sys.stdin); assert r["status"] == "blocked" and r["prepare_eligible"] is False and r["can_execute"] is False; print("HML collector isolation remains blocked")'
      - name: ATLAS HML pre-activation bundle smoke (always BLOCKED)
        run: |
          set -o pipefail
          PYTHONPATH=linux-ops-mcp python -B -m linux_ops_mcp.atlas_hml_host_review_bundle | python -c 'import json,sys; r=json.load(sys.stdin); assert r["status"] == "blocked" and r["prepare_eligible"] is False and r["can_execute"] is False; print("HML preactivation dossier remains BLOCKED")'
      - name: ATLAS HML supervisor blueprint remains review-only (BLOCKED)
        run: |
          PYTHONPATH=linux-ops-mcp python -c 'from linux_ops_mcp.atlas_hml_supervisor_blueprint_review import load_repository_blueprint_sources,review_blueprint_sources; v=review_blueprint_sources(load_repository_blueprint_sources()); assert v.status == "blocked" and v.prepare_eligible is False and v.can_execute is False and v.architecture_approved is False; print("ATLAS HML supervisor review stays BLOCKED")'
      - name: Check MCP SDK import and explicit tool inventory
        run: |
          PYTHONPATH=linux-ops-mcp python - <<'PY'
          from linux_ops_mcp.server import create_mcp_server
          tools = create_mcp_server()._tool_manager.list_tools()
          names = sorted(tool.name for tool in tools)
          expected = sorted([
              "get_host_health", "list_managed_services",
              "get_service_health", "get_deployment_revision",
          ])
          assert names == expected, (names, expected)
          print("tool inventory: 4 read-only tools")
          PY
      - name: Build constrained image, without starting containers
        run: docker build --pull -f linux-ops-mcp/Dockerfile -t delpi/linux-ops-mcp:ci .

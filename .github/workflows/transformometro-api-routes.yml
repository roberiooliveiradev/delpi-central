name: transformometro-api routes

on:
  push:
    paths:
      - "transformometro-api/**"
      - "shared/delpi_auth/**"
      - ".github/workflows/transformometro-api-routes.yml"
  pull_request:
    paths:
      - "transformometro-api/**"
      - "shared/delpi_auth/**"
      - ".github/workflows/transformometro-api-routes.yml"

jobs:
  route-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transformometro-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: transformometro-api/requirements.txt

      - name: Instalar dependências
        run: |
          pip install -e ../shared
          pip install -r requirements.txt
          pip install httpx

      - name: Baseline OpenAPI sincronizado
        run: PYTHONPATH=.:../shared python scripts/sync_openapi_baseline.py --check

      - name: Smokes Nível A (todas as rotas HTTP)
        run: PYTHONPATH=.:../shared python -m pytest tests/test_route_phase*.py -q

      - name: Inventário — cobertura completa
        run: |
          PYTHONPATH=.:../shared python scripts/audit_route_test_coverage.py --check
          PYTHONPATH=.:../shared python scripts/audit_route_test_coverage.py --check-complete

name: Linux Ops MCP Keycloak Contract

on:
  pull_request:
    paths:
      - "infra/scripts/keycloak_linux_ops_client.py"
      - "infra/scripts/tests/test_keycloak_linux_ops_client.py"
      - ".github/workflows/linux-ops-mcp-keycloak.yml"
  push:
    branches: [main]
    paths:
      - "infra/scripts/keycloak_linux_ops_client.py"
      - "infra/scripts/tests/test_keycloak_linux_ops_client.py"
      - ".github/workflows/linux-ops-mcp-keycloak.yml"

permissions:
  contents: read

jobs:
  keycloak-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile and run mock Keycloak tests
        run: |
          python -m py_compile infra/scripts/keycloak_linux_ops_client.py
          python -m pytest -q infra/scripts/tests/test_keycloak_linux_ops_client.py

name: Materiais de Terceiros CI

on:
  pull_request:
    paths:
      - "api-delpi/app/**/third_party_materials/**"
      - "api-delpi/app/interface/http/routes/supplies/third_party_materials_router.py"
      - "api-delpi/app/interface/http/route_contract_registry.py"
      - "api-delpi/tests/test_third_party_materials*.py"
      - "plugins/materiais-terceiros/**"
      - ".github/workflows/materiais-terceiros-ci.yml"
  push:
    branches: [main]
    paths:
      - "api-delpi/app/**/third_party_materials/**"
      - "api-delpi/app/interface/http/routes/supplies/third_party_materials_router.py"
      - "api-delpi/app/interface/http/route_contract_registry.py"
      - "api-delpi/tests/test_third_party_materials*.py"
      - "plugins/materiais-terceiros/**"
      - ".github/workflows/materiais-terceiros-ci.yml"

jobs:
  frontend:
    name: MFE lint, tests, types and bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/materiais-terceiros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins/materiais-terceiros/package-lock.json
      - run: npm ci
      - run: npm run ci

  backend:
    name: API supplier report regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-delpi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api-delpi/requirements.txt
      - run: |
          pip install -e ../shared[fastapi]
          pip install -r requirements.txt
      - run: |
          PYTHONPATH=. pytest \
            tests/test_third_party_materials_routes.py \
            tests/test_third_party_materials_sql.py \
            tests/test_third_party_materials_use_cases.py \
            tests/test_third_party_materials_pending_suppliers.py \
            -q

name: Architecture Enforcement

on:
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.css"
      - "**/*.sql"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.json"
      - "**/*.toml"
      - "**/*.sh"
      - "**/.env*"
      - ".cursor/rules/architecture-ci-enforcement.mdc"
      - "scripts/ci/audit_architecture_phase3.py"
      - "scripts/ci/test_audit_architecture_phase3.py"
      - "scripts/ci/architecture_phase3_exceptions.json"
      - "scripts/ci/audit_platform_guardrails.py"
      - "scripts/ci/test_audit_platform_guardrails.py"
      - "scripts/ci/audit_openapi_contracts.py"
      - "scripts/ci/test_audit_openapi_contracts.py"
      - "scripts/ci/audit_fastapi_authz.py"
      - "scripts/ci/test_audit_fastapi_authz.py"
      - "shared/delpi_auth/**"
      - "shared/pyproject.toml"
      - ".github/workflows/architecture-enforcement.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.py"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.css"
      - "**/*.sql"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.json"
      - "**/*.toml"
      - "**/*.sh"
      - "**/.env*"
      - ".cursor/rules/architecture-ci-enforcement.mdc"
      - "scripts/ci/audit_architecture_phase3.py"
      - "scripts/ci/test_audit_architecture_phase3.py"
      - "scripts/ci/architecture_phase3_exceptions.json"
      - "scripts/ci/audit_platform_guardrails.py"
      - "scripts/ci/test_audit_platform_guardrails.py"
      - "scripts/ci/audit_openapi_contracts.py"
      - "scripts/ci/test_audit_openapi_contracts.py"
      - "scripts/ci/audit_fastapi_authz.py"
      - "scripts/ci/test_audit_fastapi_authz.py"
      - "shared/delpi_auth/**"
      - "shared/pyproject.toml"
      - ".github/workflows/architecture-enforcement.yml"

permissions:
  contents: read

jobs:
  architecture-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenAPI audit dependency
        run: python -m pip install -q 'PyYAML>=6,<7'

      - name: Test Phase 3 architecture gate
        run: python -m unittest scripts/ci/test_audit_architecture_phase3.py -v

      - name: Test transversal platform guardrails
        run: python -m unittest scripts/ci/test_audit_platform_guardrails.py -v

      - name: Test OpenAPI contract guardrails
        run: python -m unittest scripts/ci/test_audit_openapi_contracts.py -v

      - name: Test FastAPI AuthZ guardrails
        run: python -m unittest scripts/ci/test_audit_fastapi_authz.py -v

      - name: Install shared auth test dependencies
        run: python -m pip install -q -e './shared[dev]'

      - name: Test shared JWT fail-closed validation
        run: pytest shared/delpi_auth/tests/test_jwt_validator.py -q

      - name: Resolve comparison base
        id: base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD^)"
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          echo "Comparing $BASE..HEAD"

      - name: Enforce Phase 3 architecture gates
        run: python scripts/ci/audit_architecture_phase3.py --check --base "${{ steps.base.outputs.sha }}"

      - name: Enforce transversal platform guardrails
        run: python scripts/ci/audit_platform_guardrails.py --check --base "${{ steps.base.outputs.sha }}"

      - name: Enforce OpenAPI contract guardrails
        run: python scripts/ci/audit_openapi_contracts.py --check --base "${{ steps.base.outputs.sha }}"

      - name: Enforce FastAPI AuthZ guardrails
        run: python scripts/ci/audit_fastapi_authz.py --check --base "${{ steps.base.outputs.sha }}"

version: "3.9"

services:
  postgres-core:
    image: postgres:15
    container_name: delpi-postgres-core
    environment:
      POSTGRES_DB: delpi_core
      POSTGRES_USER: delpi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delpi123}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres_core_data:/var/lib/postgresql/data
    networks:
      - delpi-network
    restart: unless-stopped

  keycloak-db:
    image: postgres:15
    container_name: delpi-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak123}
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    networks:
      - delpi-network
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: delpi-keycloak
    command: start --hostname-strict=false --proxy=edge --http-enabled=true
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak123}

      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}

      KC_PROXY: edge
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"

      KC_HOSTNAME_URL: "http://192.168.1.237:8091/auth"
      KC_HOSTNAME_ADMIN_URL: "http://192.168.1.237:8091/auth"

    depends_on:
      - keycloak-db
    networks:
      - delpi-network
    restart: unless-stopped

  core-api:
    build:
      context: ../core-api
    container_name: delpi-core-api
    env_file:
      - ../core-api/.env.semi-prod
    depends_on:
      - postgres-core
    networks:
      - delpi-network
    restart: unless-stopped
    command: >
      sh -c "gunicorn -w 2 -k gthread -t 120 -b 0.0.0.0:8000 'app.create_app:create_app()'"

  portal:
    build:
      context: ../portal
    container_name: delpi-portal
    depends_on:
      - core-api
    networks:
      - delpi-network
    restart: unless-stopped

  gateway:
    build:
      context: ../gateway
    container_name: delpi-gateway
    ports:
      - "8091:80"   
    depends_on:
      - portal
      - core-api
      - keycloak
    networks:
      - delpi-network
    restart: unless-stopped

networks:
  delpi-network:
    driver: bridge

volumes:
  postgres_core_data:
  keycloak_data:
# Compose dev — perfis:
#   (padrão)  postgres, keycloak, core-api, portal, gateway, postgres-plugins, api-delpi
#   chat      ollama, minha-delpi-ai-api, minha-delpi-chat, searxng, languagetool
#   plugins   microfrontends e APIs de plugin (dashboards, MFEs, etc.)
#
# Exemplos:
#   docker compose -f infra/docker-compose.dev.yml up -d
#   docker compose -f infra/docker-compose.dev.yml --profile plugins up -d controle-retrabalhos
#   docker compose -f infra/docker-compose.dev.yml --profile chat --profile plugins up -d

x-plugin-profile: &plugin-profile
  profiles:
    - plugins

services:

  postgres-core:
    image: postgres:15
    container_name: delpi-postgres-core
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_CORE_DB}
      POSTGRES_USER: ${POSTGRES_CORE_USER}
      POSTGRES_PASSWORD: ${POSTGRES_CORE_PASSWORD}
      TZ: ${TZ}

    ports:
      - "5432:5432"

    volumes:
      - postgres_core_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - delpi-network


  keycloak-db:
    image: postgres:15
    container_name: delpi-keycloak-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_KC_DB}
      POSTGRES_USER: ${POSTGRES_KC_USER}
      POSTGRES_PASSWORD: ${POSTGRES_KC_PASSWORD}
      TZ: ${TZ}

    volumes:
      - keycloak_data:/var/lib/postgresql/data

    networks:
      - delpi-network


  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    platform: linux/amd64
    container_name: delpi-keycloak
    command: ["start-dev"]

    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${POSTGRES_KC_DB}
      KC_DB_USERNAME: ${POSTGRES_KC_USER}
      KC_DB_PASSWORD: ${POSTGRES_KC_PASSWORD}

      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_HTTP_ENABLED: ${KC_HTTP_ENABLED}
      KC_HTTP_PORT: ${KC_HTTP_PORT}
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH}

      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT}
      KC_HOSTNAME_STRICT_HTTPS: ${KC_HOSTNAME_STRICT_HTTPS}

      KC_PROXY: ${KC_PROXY}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS}

      TZ: ${TZ}

    depends_on:
      - keycloak-db

    networks:
      delpi-network:
        aliases:
          - keycloak

    volumes:
      - ./keycloak/themes:/opt/keycloak/themes:ro


  core-api:
    build:
      context: ..
      dockerfile: core-api/Dockerfile.dev

    container_name: delpi-core-api
    restart: unless-stopped

    environment:
      FLASK_APP: app.create_app:create_app
      FLASK_ENV: development
      TZ: ${TZ}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      SECRET_KEY: ${SECRET_KEY}

      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}

      INITIAL_SUPERADMIN_EMAIL: ${INITIAL_SUPERADMIN_EMAIL}
      INITIAL_SUPERADMIN_NAME: ${INITIAL_SUPERADMIN_NAME}

      CORE_API_INTEGRATIONS_SERVICE_TOKEN: ${CORE_API_INTEGRATIONS_SERVICE_TOKEN:-}

      NOTIFICATIONS_DISPATCH_SCHEDULER_ENABLED: ${NOTIFICATIONS_DISPATCH_SCHEDULER_ENABLED:-true}
      NOTIFICATIONS_DISPATCH_POLL_SECONDS: ${NOTIFICATIONS_DISPATCH_POLL_SECONDS:-60}
      NOTIFICATIONS_DISPATCH_BATCH_LIMIT: ${NOTIFICATIONS_DISPATCH_BATCH_LIMIT:-20}

      USER_PRESENCE_ENABLED: ${USER_PRESENCE_ENABLED:-true}
      USER_PRESENCE_TTL_SECONDS: ${USER_PRESENCE_TTL_SECONDS:-90}
      USER_PRESENCE_STORE: ${USER_PRESENCE_STORE:-memory}
      APP_USAGE_ENABLED: ${APP_USAGE_ENABLED:-true}
      APP_USAGE_TTL_SECONDS: ${APP_USAGE_TTL_SECONDS:-90}
      APP_USAGE_STORE: ${APP_USAGE_STORE:-memory}
      APP_USAGE_HISTORY_DAYS: ${APP_USAGE_HISTORY_DAYS:-30}
      REDIS_URL: ${REDIS_URL:-}

      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_ADMIN_REALM}
      KEYCLOAK_ADMIN_URL: ${KEYCLOAK_ADMIN_URL}

    volumes:
      - ../core-api:/app
      - ../shared:/shared

    depends_on:
      - postgres-core
      - keycloak

    networks:
      - delpi-network

  ollama:
    image: ollama/ollama:latest
    profiles:
      - chat
    container_name: delpi-ollama
    restart: unless-stopped

    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    networks:
      - delpi-network

  searxng:
    image: searxng/searxng:latest
    profiles:
      - chat
    container_name: delpi-searxng
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8088/}
      # Evita rate limit local; JSON ainda exige search.formats em settings (ver searxng-apply-dev-settings.sh).
      SEARXNG_LIMITER: "false"
    ports:
      - "8088:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    networks:
      - delpi-network

  languagetool:
    image: erikvl87/languagetool:latest
    container_name: delpi-languagetool
    restart: unless-stopped
    profiles:
      - chat
    ports:
      - "8010:8010"
    environment:
      Java_Xms: 512m
      Java_Xmx: 2g
    networks:
      - delpi-network
    deploy:
      resources:
        limits:
          memory: 2500M

  minha-delpi-ai-api:
    build:
      context: ../minha-delpi-ai-api
      dockerfile: Dockerfile.dev
      args:
        # Extras de visão sempre na imagem dev (EasyOCR + Docling + modelos prefetch).
        INSTALL_VISION_EXTRAS: "true"
    profiles:
      - chat
      - vision

    container_name: delpi-minha-delpi-ai-api
    restart: unless-stopped

    environment:
      FLASK_APP: app.main:app
      FLASK_ENV: development
      TZ: ${TZ}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${PLUGINS_DB_USER}:${PLUGINS_DB_PASSWORD}@postgres-plugins:5432/${PLUGINS_DB_NAME}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
      JWT_ALGORITHMS: ${JWT_ALGORITHMS:-RS256}
      CORE_API_BASE_URL: http://core-api:8000
      CORE_API_TIMEOUT_SECONDS: 5
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-320}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-1024}
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-0}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}

      CHAT_LLM_LATENCY_PROFILE: ${CHAT_LLM_LATENCY_PROFILE:-operational_cpu}
      CHAT_RESPONSE_MODES_ENABLED: ${CHAT_RESPONSE_MODES_ENABLED:-true}
      CHAT_RESPONSE_MODE_FAST_MODEL: ${CHAT_RESPONSE_MODE_FAST_MODEL:-qwen2.5:1.5b}
      CHAT_RESPONSE_MODE_FAST_MAX_TOKENS: ${CHAT_RESPONSE_MODE_FAST_MAX_TOKENS:-96}
      CHAT_RESPONSE_MODE_FAST_NUM_CTX: ${CHAT_RESPONSE_MODE_FAST_NUM_CTX:-512}
      CHAT_RESPONSE_MODE_NORMAL_MODEL: ${CHAT_RESPONSE_MODE_NORMAL_MODEL:-qwen2.5:1.5b}
      CHAT_RESPONSE_MODE_NORMAL_MAX_TOKENS: ${CHAT_RESPONSE_MODE_NORMAL_MAX_TOKENS:-256}
      CHAT_RESPONSE_MODE_NORMAL_NUM_CTX: ${CHAT_RESPONSE_MODE_NORMAL_NUM_CTX:-1536}
      CHAT_RESPONSE_MODE_NORMAL_TEMPERATURE: ${CHAT_RESPONSE_MODE_NORMAL_TEMPERATURE:-0.1}
      CHAT_RESPONSE_MODE_THINKER_MODEL: ${CHAT_RESPONSE_MODE_THINKER_MODEL:-qwen2.5:3b}
      CHAT_RESPONSE_MODE_THINKER_MAX_TOKENS: ${CHAT_RESPONSE_MODE_THINKER_MAX_TOKENS:-512}
      CHAT_RESPONSE_MODE_THINKER_NUM_CTX: ${CHAT_RESPONSE_MODE_THINKER_NUM_CTX:-2048}
      CHAT_RESPONSE_MODE_THINKER_TEMPERATURE: ${CHAT_RESPONSE_MODE_THINKER_TEMPERATURE:-0.15}

      CHAT_SESSION_TITLE_LLM_ENABLED: ${CHAT_SESSION_TITLE_LLM_ENABLED:-true}
      CHAT_HISTORY_MAX_MESSAGES: ${CHAT_HISTORY_MAX_MESSAGES:-12}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-120}
      MAX_CONTEXT_CHUNKS: ${MAX_CONTEXT_CHUNKS:-6}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-9000}
      RAG_CONTEXT_MIN_SCORE: ${RAG_CONTEXT_MIN_SCORE:-0.35}
      RAG_IDENTITY_QUESTION_MIN_SCORE: ${RAG_IDENTITY_QUESTION_MIN_SCORE:-0.22}

      CHAT_FAST_PATH_ENABLED: ${CHAT_FAST_PATH_ENABLED:-true}
      CHAT_FAST_PATH_MAX_CHARS: ${CHAT_FAST_PATH_MAX_CHARS:-48}
      CHAT_TOOL_ROUTER_ENABLED: ${CHAT_TOOL_ROUTER_ENABLED:-true}
      CHAT_RAG_HYBRID_ENABLED: ${CHAT_RAG_HYBRID_ENABLED:-true}
      CHAT_RAG_PREFER_KEYWORD_SEARCH: ${CHAT_RAG_PREFER_KEYWORD_SEARCH:-true}
      CHAT_RAG_RERANK_ENABLED: ${CHAT_RAG_RERANK_ENABLED:-true}
      CHAT_RAG_FTS_ENABLED: ${CHAT_RAG_FTS_ENABLED:-true}
      CHAT_ATTACHMENT_IMAGE_OCR_ENABLED: ${CHAT_ATTACHMENT_IMAGE_OCR_ENABLED:-true}
      CHAT_ATTACHMENT_IMAGE_OCR_MAX_CHARS: ${CHAT_ATTACHMENT_IMAGE_OCR_MAX_CHARS:-4000}
      CHAT_ATTACHMENT_STORAGE_PATH: ${CHAT_ATTACHMENT_STORAGE_PATH:-/data/delpi/chat-attachments}
      CHAT_SOURCE_STORAGE_PATH: ${CHAT_SOURCE_STORAGE_PATH:-/data/delpi/chat-sources}
      CHAT_DOCUMENT_VISION_ENABLED: ${CHAT_DOCUMENT_VISION_ENABLED:-true}
      CHAT_DOCUMENT_VISION_BACKEND: ${CHAT_DOCUMENT_VISION_BACKEND:-auto}
      CHAT_DOCUMENT_VISION_AUTO_WITH_DRAWING: ${CHAT_DOCUMENT_VISION_AUTO_WITH_DRAWING:-true}
      CHAT_DOCUMENT_VISION_MAX_PAGES: ${CHAT_DOCUMENT_VISION_MAX_PAGES:-10}
      CHAT_DOCUMENT_VISION_DPI: ${CHAT_DOCUMENT_VISION_DPI:-200}
      CHAT_DOCUMENT_VISION_MIN_LEGIBLE_CHARS: ${CHAT_DOCUMENT_VISION_MIN_LEGIBLE_CHARS:-40}
      CHAT_DOCUMENT_VISION_TIMEOUT_SECONDS: ${CHAT_DOCUMENT_VISION_TIMEOUT_SECONDS:-120}
      CHAT_DOCUMENT_VISION_MAX_CHARS: ${CHAT_DOCUMENT_VISION_MAX_CHARS:-8000}
      CHAT_DOCUMENT_VISION_STAMP_CROP_ENABLED: ${CHAT_DOCUMENT_VISION_STAMP_CROP_ENABLED:-true}
      CHAT_DOCUMENT_VISION_TESSERACT_LANG: ${CHAT_DOCUMENT_VISION_TESSERACT_LANG:-por+eng}
      CHAT_VISION_EXTRAS_WARN: ${CHAT_VISION_EXTRAS_WARN:-true}
      CHAT_EASYOCR_MODEL_DIR: ${CHAT_EASYOCR_MODEL_DIR:-/opt/delpi-vision/easyocr}
      CHAT_DOCUMENT_VISION_OLLAMA_MODEL: ${CHAT_DOCUMENT_VISION_OLLAMA_MODEL:-qwen2.5vl:7b}
      CHAT_DOCUMENT_VISION_OLLAMA_BASE_URL: ${CHAT_DOCUMENT_VISION_OLLAMA_BASE_URL:-}
      CHAT_DOCUMENT_VISION_PADDLE_USE_GPU: ${CHAT_DOCUMENT_VISION_PADDLE_USE_GPU:-false}
      CHAT_DOCUMENT_VISION_AUTO_VLM_FALLBACK: ${CHAT_DOCUMENT_VISION_AUTO_VLM_FALLBACK:-true}
      CHAT_HISTORY_SUMMARY_ENABLED: ${CHAT_HISTORY_SUMMARY_ENABLED:-true}
      EXTERNAL_ACTION_SEMANTIC_RANK_ENABLED: ${EXTERNAL_ACTION_SEMANTIC_RANK_ENABLED:-true}
      EXTERNAL_ACTION_SEMANTIC_MIN_SCORE: ${EXTERNAL_ACTION_SEMANTIC_MIN_SCORE:-0.42}
      # Ferramentas do pipeline (default ligadas — desligue na env só o que não usar)
      CHAT_DEFAULT_SQL_AUTHORING_SKILL: ${CHAT_DEFAULT_SQL_AUTHORING_SKILL:-true}
      CHAT_DEFAULT_COMPANY_KNOWLEDGE_SKILL: ${CHAT_DEFAULT_COMPANY_KNOWLEDGE_SKILL:-true}
      CHAT_DEFAULT_SQL_DIALECT: ${CHAT_DEFAULT_SQL_DIALECT:-sqlserver}
      CHAT_AGENTIC_LOOP_ENABLED: ${CHAT_AGENTIC_LOOP_ENABLED:-true}
      CHAT_AGENTIC_LOOP_MAX_STEPS: ${CHAT_AGENTIC_LOOP_MAX_STEPS:-2}
      CHAT_AGENTIC_CATALOG_MAX_ACTIONS: ${CHAT_AGENTIC_CATALOG_MAX_ACTIONS:-12}
      CHAT_NATIVE_TOOL_CALLING_ENABLED: ${CHAT_NATIVE_TOOL_CALLING_ENABLED:-true}
      CHAT_MULTI_ACTION_ENABLED: ${CHAT_MULTI_ACTION_ENABLED:-true}
      CHAT_PAGINATION_AUTO_FETCH_ENABLED: ${CHAT_PAGINATION_AUTO_FETCH_ENABLED:-true}
      CHAT_ASSISTANT_IDENTITY_DIRECT_ENABLED: ${CHAT_ASSISTANT_IDENTITY_DIRECT_ENABLED:-true}
      CHAT_OPERATIONAL_FAST_PATH_ENABLED: ${CHAT_OPERATIONAL_FAST_PATH_ENABLED:-true}
      CHAT_EXTERNAL_ACTION_DIRECT_RESPONSE_ENABLED: ${CHAT_EXTERNAL_ACTION_DIRECT_RESPONSE_ENABLED:-true}
      CHAT_PREFER_API_EXTERNA_PROVIDER: ${CHAT_PREFER_API_EXTERNA_PROVIDER:-true}
      CHAT_WEB_SEARCH_ENABLED: ${CHAT_WEB_SEARCH_ENABLED:-true}
      CHAT_WEB_SEARCH_MAX_RESULTS: ${CHAT_WEB_SEARCH_MAX_RESULTS:-5}
      CHAT_WEB_SEARCH_TIMEOUT_SECONDS: ${CHAT_WEB_SEARCH_TIMEOUT_SECONDS:-8}
      CHAT_WEB_SEARCH_PROVIDER: ${CHAT_WEB_SEARCH_PROVIDER:-auto}
      CHAT_WEB_SEARCH_RETRY_EN: ${CHAT_WEB_SEARCH_RETRY_EN:-true}
      CHAT_WEB_SEARCH_DIRECT_RESPONSE_ENABLED: ${CHAT_WEB_SEARCH_DIRECT_RESPONSE_ENABLED:-true}
      CHAT_WEB_SEARCH_SYNTHESIS_ENABLED: ${CHAT_WEB_SEARCH_SYNTHESIS_ENABLED:-true}
      CHAT_WEB_SEARCH_SYNTHESIS_MIN_RESULTS: ${CHAT_WEB_SEARCH_SYNTHESIS_MIN_RESULTS:-2}
      CHAT_WEB_SEARCH_TAVILY_API_KEY: ${CHAT_WEB_SEARCH_TAVILY_API_KEY:-}
      CHAT_WEB_SEARCH_SERPER_API_KEY: ${CHAT_WEB_SEARCH_SERPER_API_KEY:-}
      CHAT_WEB_SEARCH_BING_API_KEY: ${CHAT_WEB_SEARCH_BING_API_KEY:-}
      CHAT_WEB_SEARCH_SEARXNG_BASE_URL: ${CHAT_WEB_SEARCH_SEARXNG_BASE_URL:-http://searxng:8080}
      CHAT_WEB_SEARCH_SEARXNG_LANGUAGE: ${CHAT_WEB_SEARCH_SEARXNG_LANGUAGE:-pt-BR}
      CHAT_WEB_SEARCH_SEARXNG_CATEGORIES: ${CHAT_WEB_SEARCH_SEARXNG_CATEGORIES:-general}

      # R16 — discovery de rótulos de coluna (dev: off — catálogo JSON + humanize)
      CHAT_PRESENTATION_COLUMN_LABEL_DISCOVERY_ENABLED: ${CHAT_PRESENTATION_COLUMN_LABEL_DISCOVERY_ENABLED:-true}
      CHAT_PRESENTATION_COLUMN_LABEL_WEB_SEARCH_ENABLED: ${CHAT_PRESENTATION_COLUMN_LABEL_WEB_SEARCH_ENABLED:-true}
      CHAT_PRESENTATION_COLUMN_LABEL_MAX_KEYS: ${CHAT_PRESENTATION_COLUMN_LABEL_MAX_KEYS:-8}
      CHAT_PRESENTATION_COLUMN_LABEL_WEB_MAX_QUERIES: ${CHAT_PRESENTATION_COLUMN_LABEL_WEB_MAX_QUERIES:-2}

      # Corretor de digitação (Playbook 14)
      CHAT_TYPING_CORRECTION_ENABLED: ${CHAT_TYPING_CORRECTION_ENABLED:-true}
      CHAT_TYPING_CORRECTION_FUZZY_ENABLED: ${CHAT_TYPING_CORRECTION_FUZZY_ENABLED:-true}

      # Preflight LanguageTool na skill de correção textual
      CHAT_TEXT_CORRECTION_SPELL_CHECK_ENABLED: ${CHAT_TEXT_CORRECTION_SPELL_CHECK_ENABLED:-true}
      CHAT_LANGUAGETOOL_BASE_URL: ${CHAT_LANGUAGETOOL_BASE_URL:-http://languagetool:8010}
      CHAT_LANGUAGETOOL_TIMEOUT_SECONDS: ${CHAT_LANGUAGETOOL_TIMEOUT_SECONDS:-4}
      CHAT_LANGUAGETOOL_LANGUAGE: ${CHAT_LANGUAGETOOL_LANGUAGE:-pt-BR}

      # Aprendizagem contínua (playbook) — ligado por padrão; defina false na env para desligar
      CHAT_LEARNING_ENABLED: ${CHAT_LEARNING_ENABLED:-true}
      CHAT_LEARNING_APPLY_VOCABULARY: ${CHAT_LEARNING_APPLY_VOCABULARY:-true}
      CHAT_LEARNING_CAPTURE_FROM_FEEDBACK: ${CHAT_LEARNING_CAPTURE_FROM_FEEDBACK:-true}
      CHAT_LEARNING_CAPTURE_FROM_TURN: ${CHAT_LEARNING_CAPTURE_FROM_TURN:-true}
      CHAT_LEARNING_AUTO_APPROVE_ENABLED: ${CHAT_LEARNING_AUTO_APPROVE_ENABLED:-true}
      CHAT_LEARNING_AUTO_APPROVE_MIN_CONFIDENCE: ${CHAT_LEARNING_AUTO_APPROVE_MIN_CONFIDENCE:-0.95}
      CHAT_LEARNING_VOCABULARY_MAX_RULES: ${CHAT_LEARNING_VOCABULARY_MAX_RULES:-500}
      CHAT_USER_MEMORY_ENABLED: ${CHAT_USER_MEMORY_ENABLED:-true}
      CHAT_USER_MEMORY_CAPTURE: ${CHAT_USER_MEMORY_CAPTURE:-true}
      CHAT_USER_MEMORY_APPLY: ${CHAT_USER_MEMORY_APPLY:-true}
      CHAT_USER_MEMORY_MAX_ITEMS: ${CHAT_USER_MEMORY_MAX_ITEMS:-20}
      CHAT_USER_MEMORY_RAG_INDEX: ${CHAT_USER_MEMORY_RAG_INDEX:-true}
      CHAT_LEARNING_GLOSSARY_RETRIEVAL: ${CHAT_LEARNING_GLOSSARY_RETRIEVAL:-true}
      CHAT_LEARNING_GLOSSARY_CAPTURE: ${CHAT_LEARNING_GLOSSARY_CAPTURE:-true}
      CHAT_LEARNING_TERM_CONFIRMATION_ENABLED: ${CHAT_LEARNING_TERM_CONFIRMATION_ENABLED:-true}
      CHAT_LEARNING_GLOSSARY_WEB_MEANING: ${CHAT_LEARNING_GLOSSARY_WEB_MEANING:-true}
      CHAT_LEARNING_GLOSSARY_MAX_TERMS: ${CHAT_LEARNING_GLOSSARY_MAX_TERMS:-300}
      CHAT_LEARNING_GLOSSARY_RAG_INDEX: ${CHAT_LEARNING_GLOSSARY_RAG_INDEX:-true}
      CHAT_LEARNING_EVALUATION_ENABLED: ${CHAT_LEARNING_EVALUATION_ENABLED:-true}
      CHAT_LEARNING_EVALUATION_BLOCK_PROMOTION: ${CHAT_LEARNING_EVALUATION_BLOCK_PROMOTION:-true}
      CHAT_LEARNING_EVALUATION_CAPTURE_FROM_FEEDBACK: ${CHAT_LEARNING_EVALUATION_CAPTURE_FROM_FEEDBACK:-true}
      CHAT_LEARNING_FINE_TUNING_ENABLED: ${CHAT_LEARNING_FINE_TUNING_ENABLED:-true}
      CHAT_LEARNING_FINE_TUNING_CAPTURE_POSITIVE_FEEDBACK: ${CHAT_LEARNING_FINE_TUNING_CAPTURE_POSITIVE_FEEDBACK:-true}
      CHAT_LEARNING_FINE_TUNING_BASE_MODEL: ${CHAT_LEARNING_FINE_TUNING_BASE_MODEL:-${OLLAMA_MODEL:-qwen2.5:1.5b}}
      CHAT_LEARNING_FINE_TUNING_OLLAMA_CREATE_ENABLED: ${CHAT_LEARNING_FINE_TUNING_OLLAMA_CREATE_ENABLED:-true}

      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_WINDOW_SECONDS: 60
      RATE_LIMIT_CHAT_MESSAGES_PER_WINDOW: 20
      RATE_LIMIT_TOOL_CALLS_PER_WINDOW: 30
      RATE_LIMIT_KNOWLEDGE_WRITES_PER_WINDOW: 10
      RATE_LIMIT_ADMIN_ACTIONS_PER_WINDOW: 20

      KNOWLEDGE_TITLE_MAX_CHARS: 200
      KNOWLEDGE_SOURCE_REF_MAX_CHARS: 500
      KNOWLEDGE_DOCUMENT_MAX_CHARS: 2000000
      KNOWLEDGE_CHUNK_SIZE: 1400
      KNOWLEDGE_CHUNK_OVERLAP: 200

      DELPI_API_URL: ${DELPI_API_URL:-http://delpi-api-delpi:8000}
      DELPI_API_TIMEOUT: ${DELPI_API_TIMEOUT:-60}
      API_DELPI_INTERNAL_SERVICE_TOKEN: ${API_DELPI_INTERNAL_SERVICE_TOKEN}

    volumes:
      - ../minha-delpi-ai-api:/app
      - ../shared/delpi_auth:/app/delpi_auth
      # Evita .venv do host sobrescrever wheels do container (ld.so / psycopg).
      - /app/.venv
      - ${DELPI_DATA_HOST_DIR:-${HOME}/.delpi}/chat-attachments:/data/delpi/chat-attachments
      - ${DELPI_DATA_HOST_DIR:-${HOME}/.delpi}/chat-sources:/data/delpi/chat-sources

    depends_on:
      core-api:
        condition: service_started
      postgres-plugins:
        condition: service_healthy
      ollama:
        condition: service_started
      searxng:
        condition: service_started
    networks:
      - delpi-network

  portal:
    build:
      context: ../portal
      dockerfile: Dockerfile.dev

    container_name: delpi-portal
    restart: unless-stopped

    environment:
      TZ: ${TZ}

      VITE_KC_URL: ${VITE_KC_URL}
      VITE_KC_REALM: ${VITE_KC_REALM}
      VITE_KC_CLIENT_ID: ${VITE_KC_CLIENT_ID}
      VITE_KC_REDIRECT_URI: ${VITE_KC_REDIRECT_URI}


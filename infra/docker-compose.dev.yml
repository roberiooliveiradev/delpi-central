services:

  postgres-core:
    image: postgres:15
    container_name: delpi-postgres-core
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_CORE_DB}
      POSTGRES_USER: ${POSTGRES_CORE_USER}
      POSTGRES_PASSWORD: ${POSTGRES_CORE_PASSWORD}
      TZ: ${TZ}

    ports:
      - "5432:5432"

    volumes:
      - postgres_core_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - delpi-network


  keycloak-db:
    image: postgres:15
    container_name: delpi-keycloak-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_KC_DB}
      POSTGRES_USER: ${POSTGRES_KC_USER}
      POSTGRES_PASSWORD: ${POSTGRES_KC_PASSWORD}
      TZ: ${TZ}

    volumes:
      - keycloak_data:/var/lib/postgresql/data

    networks:
      - delpi-network


  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    platform: linux/amd64
    container_name: delpi-keycloak
    command: ["start-dev"]

    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${POSTGRES_KC_DB}
      KC_DB_USERNAME: ${POSTGRES_KC_USER}
      KC_DB_PASSWORD: ${POSTGRES_KC_PASSWORD}

      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_HTTP_ENABLED: ${KC_HTTP_ENABLED}
      KC_HTTP_PORT: ${KC_HTTP_PORT}
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH}

      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT}
      KC_HOSTNAME_STRICT_HTTPS: ${KC_HOSTNAME_STRICT_HTTPS}

      KC_PROXY: ${KC_PROXY}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS}

      TZ: ${TZ}

    depends_on:
      - keycloak-db

    networks:
      delpi-network:
        aliases:
          - keycloak

    volumes:
      - ./keycloak/themes:/opt/keycloak/themes:ro


  core-api:
    build:
      context: ..
      dockerfile: core-api/Dockerfile.dev

    container_name: delpi-core-api
    restart: unless-stopped

    environment:
      FLASK_APP: app.create_app:create_app
      FLASK_ENV: development
      TZ: ${TZ}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      SECRET_KEY: ${SECRET_KEY}

      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}

      INITIAL_SUPERADMIN_EMAIL: ${INITIAL_SUPERADMIN_EMAIL}
      INITIAL_SUPERADMIN_NAME: ${INITIAL_SUPERADMIN_NAME}

      CORE_API_INTEGRATIONS_SERVICE_TOKEN: ${CORE_API_INTEGRATIONS_SERVICE_TOKEN:-}

      NOTIFICATIONS_DISPATCH_SCHEDULER_ENABLED: ${NOTIFICATIONS_DISPATCH_SCHEDULER_ENABLED:-true}
      NOTIFICATIONS_DISPATCH_POLL_SECONDS: ${NOTIFICATIONS_DISPATCH_POLL_SECONDS:-60}
      NOTIFICATIONS_DISPATCH_BATCH_LIMIT: ${NOTIFICATIONS_DISPATCH_BATCH_LIMIT:-20}

      USER_PRESENCE_ENABLED: ${USER_PRESENCE_ENABLED:-true}
      USER_PRESENCE_TTL_SECONDS: ${USER_PRESENCE_TTL_SECONDS:-90}
      USER_PRESENCE_STORE: ${USER_PRESENCE_STORE:-memory}
      APP_USAGE_ENABLED: ${APP_USAGE_ENABLED:-true}
      APP_USAGE_TTL_SECONDS: ${APP_USAGE_TTL_SECONDS:-90}
      APP_USAGE_STORE: ${APP_USAGE_STORE:-memory}
      APP_USAGE_HISTORY_DAYS: ${APP_USAGE_HISTORY_DAYS:-30}
      REDIS_URL: ${REDIS_URL:-}

      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_ADMIN_REALM}
      KEYCLOAK_ADMIN_URL: ${KEYCLOAK_ADMIN_URL}

    volumes:
      - ../core-api:/app
      - ../shared:/shared

    depends_on:
      - postgres-core
      - keycloak

    networks:
      - delpi-network

  ollama:
    image: ollama/ollama:latest
    profiles:
      - chat
    container_name: delpi-ollama
    restart: unless-stopped

    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    networks:
      - delpi-network

  searxng:
    image: searxng/searxng:latest
    profiles:
      - chat
    container_name: delpi-searxng
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8088/}
      # Evita rate limit local; JSON ainda exige search.formats em settings (ver searxng-apply-dev-settings.sh).
      SEARXNG_LIMITER: "false"
    ports:
      - "8088:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    networks:
      - delpi-network

  minha-delpi-ai-api:
    build:
      context: ../minha-delpi-ai-api
      dockerfile: Dockerfile.dev
    profiles:
      - chat
      - vision

    container_name: delpi-minha-delpi-ai-api
    restart: unless-stopped

    environment:
      FLASK_APP: app.main:app
      FLASK_ENV: development
      TZ: ${TZ}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${PLUGINS_DB_USER}:${PLUGINS_DB_PASSWORD}@postgres-plugins:5432/${PLUGINS_DB_NAME}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
      JWT_ALGORITHMS: ${JWT_ALGORITHMS:-RS256}
      CORE_API_BASE_URL: http://core-api:8000
      CORE_API_TIMEOUT_SECONDS: 5
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-768}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-2048}
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-0}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}

      CHAT_RESPONSE_MODES_ENABLED: ${CHAT_RESPONSE_MODES_ENABLED:-true}
      CHAT_RESPONSE_MODE_FAST_MODEL: ${CHAT_RESPONSE_MODE_FAST_MODEL:-qwen2.5:1.5b}
      CHAT_RESPONSE_MODE_FAST_MAX_TOKENS: ${CHAT_RESPONSE_MODE_FAST_MAX_TOKENS:-384}
      CHAT_RESPONSE_MODE_FAST_NUM_CTX: ${CHAT_RESPONSE_MODE_FAST_NUM_CTX:-1536}
      CHAT_RESPONSE_MODE_THINKER_MODEL: ${CHAT_RESPONSE_MODE_THINKER_MODEL:-}
      CHAT_RESPONSE_MODE_THINKER_MAX_TOKENS: ${CHAT_RESPONSE_MODE_THINKER_MAX_TOKENS:-1536}
      CHAT_RESPONSE_MODE_THINKER_NUM_CTX: ${CHAT_RESPONSE_MODE_THINKER_NUM_CTX:-4096}
      CHAT_LLM_LATENCY_PROFILE: ${CHAT_LLM_LATENCY_PROFILE:-}

      CHAT_SESSION_TITLE_LLM_ENABLED: ${CHAT_SESSION_TITLE_LLM_ENABLED:-true}
      CHAT_HISTORY_MAX_MESSAGES: ${CHAT_HISTORY_MAX_MESSAGES:-12}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-120}
      MAX_CONTEXT_CHUNKS: ${MAX_CONTEXT_CHUNKS:-6}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-9000}
      RAG_CONTEXT_MIN_SCORE: ${RAG_CONTEXT_MIN_SCORE:-0.35}
      RAG_IDENTITY_QUESTION_MIN_SCORE: ${RAG_IDENTITY_QUESTION_MIN_SCORE:-0.22}

      CHAT_FAST_PATH_ENABLED: ${CHAT_FAST_PATH_ENABLED:-true}
      CHAT_FAST_PATH_MAX_CHARS: ${CHAT_FAST_PATH_MAX_CHARS:-48}
      CHAT_TOOL_ROUTER_ENABLED: ${CHAT_TOOL_ROUTER_ENABLED:-true}
      CHAT_RAG_HYBRID_ENABLED: ${CHAT_RAG_HYBRID_ENABLED:-true}
      CHAT_RAG_PREFER_KEYWORD_SEARCH: ${CHAT_RAG_PREFER_KEYWORD_SEARCH:-true}
      CHAT_RAG_RERANK_ENABLED: ${CHAT_RAG_RERANK_ENABLED:-true}
      CHAT_RAG_FTS_ENABLED: ${CHAT_RAG_FTS_ENABLED:-true}
      CHAT_ATTACHMENT_IMAGE_OCR_ENABLED: ${CHAT_ATTACHMENT_IMAGE_OCR_ENABLED:-true}
      CHAT_ATTACHMENT_IMAGE_OCR_MAX_CHARS: ${CHAT_ATTACHMENT_IMAGE_OCR_MAX_CHARS:-4000}
      CHAT_DOCUMENT_VISION_ENABLED: ${CHAT_DOCUMENT_VISION_ENABLED:-true}
      CHAT_DOCUMENT_VISION_BACKEND: ${CHAT_DOCUMENT_VISION_BACKEND:-auto}
      CHAT_DOCUMENT_VISION_AUTO_WITH_DRAWING: ${CHAT_DOCUMENT_VISION_AUTO_WITH_DRAWING:-true}
      CHAT_DOCUMENT_VISION_MAX_PAGES: ${CHAT_DOCUMENT_VISION_MAX_PAGES:-10}
      CHAT_DOCUMENT_VISION_DPI: ${CHAT_DOCUMENT_VISION_DPI:-200}
      CHAT_DOCUMENT_VISION_MIN_LEGIBLE_CHARS: ${CHAT_DOCUMENT_VISION_MIN_LEGIBLE_CHARS:-40}
      CHAT_DOCUMENT_VISION_TIMEOUT_SECONDS: ${CHAT_DOCUMENT_VISION_TIMEOUT_SECONDS:-120}
      CHAT_DOCUMENT_VISION_MAX_CHARS: ${CHAT_DOCUMENT_VISION_MAX_CHARS:-8000}
      CHAT_DOCUMENT_VISION_STAMP_CROP_ENABLED: ${CHAT_DOCUMENT_VISION_STAMP_CROP_ENABLED:-true}
      CHAT_DOCUMENT_VISION_TESSERACT_LANG: ${CHAT_DOCUMENT_VISION_TESSERACT_LANG:-por+eng}
      CHAT_DOCUMENT_VISION_OLLAMA_MODEL: ${CHAT_DOCUMENT_VISION_OLLAMA_MODEL:-qwen2.5vl:7b}
      CHAT_DOCUMENT_VISION_OLLAMA_BASE_URL: ${CHAT_DOCUMENT_VISION_OLLAMA_BASE_URL:-}
      CHAT_DOCUMENT_VISION_PADDLE_USE_GPU: ${CHAT_DOCUMENT_VISION_PADDLE_USE_GPU:-false}
      CHAT_DOCUMENT_VISION_AUTO_VLM_FALLBACK: ${CHAT_DOCUMENT_VISION_AUTO_VLM_FALLBACK:-true}
      CHAT_HISTORY_SUMMARY_ENABLED: ${CHAT_HISTORY_SUMMARY_ENABLED:-true}
      EXTERNAL_ACTION_SEMANTIC_RANK_ENABLED: ${EXTERNAL_ACTION_SEMANTIC_RANK_ENABLED:-true}
      EXTERNAL_ACTION_SEMANTIC_MIN_SCORE: ${EXTERNAL_ACTION_SEMANTIC_MIN_SCORE:-0.42}
      CHAT_AGENTIC_LOOP_ENABLED: ${CHAT_AGENTIC_LOOP_ENABLED:-true}
      CHAT_AGENTIC_LOOP_MAX_STEPS: ${CHAT_AGENTIC_LOOP_MAX_STEPS:-2}
      CHAT_NATIVE_TOOL_CALLING_ENABLED: ${CHAT_NATIVE_TOOL_CALLING_ENABLED:-false}
      CHAT_MULTI_ACTION_ENABLED: ${CHAT_MULTI_ACTION_ENABLED:-true}
      CHAT_ASSISTANT_IDENTITY_DIRECT_ENABLED: ${CHAT_ASSISTANT_IDENTITY_DIRECT_ENABLED:-true}
      CHAT_OPERATIONAL_FAST_PATH_ENABLED: ${CHAT_OPERATIONAL_FAST_PATH_ENABLED:-true}
      CHAT_EXTERNAL_ACTION_DIRECT_RESPONSE_ENABLED: ${CHAT_EXTERNAL_ACTION_DIRECT_RESPONSE_ENABLED:-true}
      CHAT_PREFER_API_EXTERNA_PROVIDER: ${CHAT_PREFER_API_EXTERNA_PROVIDER:-true}
      CHAT_PLATFORM_DEFAULT_AGENT_ENABLED: ${CHAT_PLATFORM_DEFAULT_AGENT_ENABLED:-true}
      CHAT_PLATFORM_DEFAULT_AGENT_NAME: ${CHAT_PLATFORM_DEFAULT_AGENT_NAME:-Agente Minha DELPI}
      CHAT_WEB_SEARCH_ENABLED: ${CHAT_WEB_SEARCH_ENABLED:-true}
      CHAT_WEB_SEARCH_MAX_RESULTS: ${CHAT_WEB_SEARCH_MAX_RESULTS:-5}
      CHAT_WEB_SEARCH_TIMEOUT_SECONDS: ${CHAT_WEB_SEARCH_TIMEOUT_SECONDS:-8}
      CHAT_WEB_SEARCH_PROVIDER: ${CHAT_WEB_SEARCH_PROVIDER:-auto}
      CHAT_WEB_SEARCH_RETRY_EN: ${CHAT_WEB_SEARCH_RETRY_EN:-true}
      CHAT_WEB_SEARCH_DIRECT_RESPONSE_ENABLED: ${CHAT_WEB_SEARCH_DIRECT_RESPONSE_ENABLED:-true}
      CHAT_WEB_SEARCH_SYNTHESIS_ENABLED: ${CHAT_WEB_SEARCH_SYNTHESIS_ENABLED:-true}
      CHAT_WEB_SEARCH_SYNTHESIS_MIN_RESULTS: ${CHAT_WEB_SEARCH_SYNTHESIS_MIN_RESULTS:-2}
      CHAT_WEB_SEARCH_TAVILY_API_KEY: ${CHAT_WEB_SEARCH_TAVILY_API_KEY:-}
      CHAT_WEB_SEARCH_SERPER_API_KEY: ${CHAT_WEB_SEARCH_SERPER_API_KEY:-}
      CHAT_WEB_SEARCH_BING_API_KEY: ${CHAT_WEB_SEARCH_BING_API_KEY:-}
      CHAT_WEB_SEARCH_SEARXNG_BASE_URL: ${CHAT_WEB_SEARCH_SEARXNG_BASE_URL:-http://searxng:8080}
      CHAT_WEB_SEARCH_SEARXNG_LANGUAGE: ${CHAT_WEB_SEARCH_SEARXNG_LANGUAGE:-pt-BR}
      CHAT_WEB_SEARCH_SEARXNG_CATEGORIES: ${CHAT_WEB_SEARCH_SEARXNG_CATEGORIES:-general}

      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_WINDOW_SECONDS: 60
      RATE_LIMIT_CHAT_MESSAGES_PER_WINDOW: 20
      RATE_LIMIT_TOOL_CALLS_PER_WINDOW: 30
      RATE_LIMIT_KNOWLEDGE_WRITES_PER_WINDOW: 10
      RATE_LIMIT_ADMIN_ACTIONS_PER_WINDOW: 20

      KNOWLEDGE_TITLE_MAX_CHARS: 200
      KNOWLEDGE_SOURCE_REF_MAX_CHARS: 500
      KNOWLEDGE_DOCUMENT_MAX_CHARS: 2000000
      KNOWLEDGE_CHUNK_SIZE: 1400
      KNOWLEDGE_CHUNK_OVERLAP: 200

    volumes:
      - ../minha-delpi-ai-api:/app
      - ../shared/delpi_auth:/app/delpi_auth

    depends_on:
      core-api:
        condition: service_started
      postgres-plugins:
        condition: service_healthy
      ollama:
        condition: service_started
      searxng:
        condition: service_started
    networks:
      - delpi-network

  portal:
    build:
      context: ../portal
      dockerfile: Dockerfile.dev

    container_name: delpi-portal
    restart: unless-stopped

    environment:
      TZ: ${TZ}

      VITE_KC_URL: ${VITE_KC_URL}
      VITE_KC_REALM: ${VITE_KC_REALM}
      VITE_KC_CLIENT_ID: ${VITE_KC_CLIENT_ID}
      VITE_KC_REDIRECT_URI: ${VITE_KC_REDIRECT_URI}

    volumes:
      - ../portal:/app
      - /app/node_modules

    depends_on:
      - core-api

    networks:
      - delpi-network


  dashboard-delpi:
    build:
      context: ../plugins/dashboard-delpi
      dockerfile: Dockerfile

    container_name: delpi-dashboard-delpi
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    volumes:
      - ../plugins/dashboard-delpi:/app
      - /app/node_modules

    networks:
      - delpi-network

  strategic-indicators:
    build:
      context: ../plugins/strategic-indicators
      dockerfile: Dockerfile

    container_name: delpi-strategic-indicators
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    volumes:
      - ../plugins/strategic-indicators:/app
      - /app/node_modules

    networks:
      - delpi-network

  transformometro:
    build:
      context: ../plugins/transformometro
      dockerfile: Dockerfile

    container_name: delpi-transformometro
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    volumes:
      - ../plugins/transformometro:/app
      - /app/node_modules

    networks:
      - delpi-network

  minha-delpi-chat:
    build:
      context: ../plugins/minha-delpi-chat
      dockerfile: Dockerfile
    profiles:
      - chat

    container_name: delpi-minha-delpi-chat
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    # Sem volume em /app ou dist: o container é nginx com build da imagem (igual prod e demais MFEs).
    # Após alterar o plugin: docker compose -f infra/docker-compose.dev.yml --profile chat build minha-delpi-chat
    # e recrie o serviço (up -d --force-recreate minha-delpi-chat). Iteração rápida: npm run dev no plugin.

    networks:
      - delpi-network
  dashboard-lmps:
    build:
      context: ../plugins/dashboard-lmps
      dockerfile: Dockerfile

    container_name: delpi-dashboard-lmps
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    volumes:
      - ../plugins/dashboard-lmps:/app
      - /app/node_modules

    networks:
      - delpi-network

  dashboard-quality:
    build:
      context: ../plugins/dashboard-quality
      dockerfile: Dockerfile

    container_name: delpi-dashboard-quality
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    volumes:
      - ../plugins/dashboard-quality:/app
      - /app/node_modules

    networks:
      - delpi-network

  dashboard-commercial:
    build:
      context: ../plugins/dashboard-commercial
      dockerfile: Dockerfile

    container_name: delpi-dashboard-commercial
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    volumes:
      - ../plugins/dashboard-commercial:/app
      - /app/node_modules

    networks:
      - delpi-network

  dashboard-production:
    build:
      context: ../plugins/dashboard-production
      dockerfile: Dockerfile

    container_name: delpi-dashboard-production
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    volumes:
      - ../plugins/dashboard-production:/app
      - /app/node_modules

    networks:
      - delpi-network

  eficiencia-fabril:
    build:
      context: ../plugins/eficiencia-fabril
      dockerfile: Dockerfile
      target: production

    container_name: delpi-eficiencia-fabril
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    networks:
      - delpi-network

  auditoria-5s:
    build:
      context: ../plugins/auditoria-5s
      dockerfile: Dockerfile
      target: production

    container_name: delpi-auditoria-5s
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    networks:
      - delpi-network

  central-agendamento:
    build:
      context: ../plugins/central-agendamento
      dockerfile: Dockerfile
      target: production

    container_name: delpi-central-agendamento
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    networks:
      - delpi-network

  dashboard-supplies:
    build:
      context: ../plugins/dashboard-supplies
      dockerfile: Dockerfile

    container_name: delpi-dashboard-supplies
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    volumes:
      - ../plugins/dashboard-supplies:/app
      - /app/node_modules

    networks:
      - delpi-network

  dashboard-financial:
    build:
      context: ../plugins/dashboard-financial
      dockerfile: Dockerfile

    container_name: delpi-dashboard-financial
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    volumes:
      - ../plugins/dashboard-financial:/app
      - /app/node_modules

    networks:
      - delpi-network

  dashboard-engineering:
    build:
      context: ../plugins/dashboard-engineering
      dockerfile: Dockerfile

    container_name: delpi-dashboard-engineering
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    volumes:
      - ../plugins/dashboard-engineering:/app
      - /app/node_modules

    networks:
      - delpi-network

  dashboard-hr:
    build:
      context: ../plugins/dashboard-hr
      dockerfile: Dockerfile

    container_name: delpi-dashboard-hr
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    volumes:
      - ../plugins/dashboard-hr:/app
      - /app/node_modules

    networks:
      - delpi-network

  api-delpi:
    build:
      context: ..
      dockerfile: api-delpi/Dockerfile

    container_name: delpi-api-delpi
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "app.asgi:application",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--root-path",
        "/apps/api-delpi",
      ]
    
    env_file:
      - .env

    environment:
      DB_HOST: ${TOTVS_DB_HOST}
      DB_PORT: ${TOTVS_DB_PORT}
      DB_USER: ${TOTVS_DB_USER}
      DB_PASSWORD: ${TOTVS_DB_PASSWORD}
      DB_DATABASE: ${TOTVS_DB_DATABASE}

      PORT: ${API_DELPI_PORT}
      ENV: ${API_DELPI_ENV}
      JWT_SECRET: ${API_DELPI_JWT_SECRET}

      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}

      JWT_ALGORITHMS: ${JWT_ALGORITHMS}
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}

      PLUGINS_DB_HOST: ${PLUGINS_DB_HOST}
      PLUGINS_DB_PORT: ${PLUGINS_DB_PORT}
      PLUGINS_DB_NAME: ${PLUGINS_DB_NAME}
      PLUGINS_DB_USER: ${PLUGINS_DB_USER}
      PLUGINS_DB_PASSWORD: ${PLUGINS_DB_PASSWORD}
      PLUGINS_DB_CONNECT_TIMEOUT: ${PLUGINS_DB_CONNECT_TIMEOUT}
      PLUGINS_DB_SSLMODE: ${PLUGINS_DB_SSLMODE}

      PORTAL_RH_DB_HOST: ${PORTAL_RH_DB_HOST}
      PORTAL_RH_DB_PORT: ${PORTAL_RH_DB_PORT}
      PORTAL_RH_DB_NAME: ${PORTAL_RH_DB_NAME}
      PORTAL_RH_DB_USER: ${PORTAL_RH_DB_USER}
      PORTAL_RH_DB_PASSWORD: ${PORTAL_RH_DB_PASSWORD}
      PORTAL_RH_DB_CONNECT_TIMEOUT: ${PORTAL_RH_DB_CONNECT_TIMEOUT}
      PORTAL_RH_DB_SSLMODE: ${PORTAL_RH_DB_SSLMODE}

      STRATEGIC_INDICATORS_API_BASE_URL: http://strategic-indicators-api:8000
      API_DELPI_INTERNAL_SERVICE_TOKEN: ${API_DELPI_INTERNAL_SERVICE_TOKEN}

      CORE_API_BASE_URL: ${CORE_API_BASE_URL:-http://core-api:8000}
      CORE_API_INTEGRATIONS_SERVICE_TOKEN: ${CORE_API_INTEGRATIONS_SERVICE_TOKEN:-}
      APP_USAGE_APP_ID: api-delpi
      APP_USAGE_TRACKING_ENABLED: ${APP_USAGE_TRACKING_ENABLED:-true}

    volumes:
      - ../api-delpi:/app
      - ../shared:/shared

    depends_on:
      - keycloak
      - postgres-plugins
      - strategic-indicators-api
      - core-api

    networks:
      - delpi-network

  strategic-indicators-api:
    build:
      context: ..
      dockerfile: strategic-indicators-api/Dockerfile

    container_name: delpi-strategic-indicators-api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: ${TOTVS_DB_HOST}
      DB_PORT: ${TOTVS_DB_PORT}
      DB_USER: ${TOTVS_DB_USER}
      DB_PASSWORD: ${TOTVS_DB_PASSWORD}
      DB_DATABASE: ${TOTVS_DB_DATABASE}

      PORT: "8000"
      SI_API_ROOT_PATH: /apps/strategic-indicators-api
      SI_SNAPSHOT_CACHE_TTL_SECONDS: ${SI_SNAPSHOT_CACHE_TTL_SECONDS:-300}
      SI_WARMUP_ON_STARTUP: ${SI_WARMUP_ON_STARTUP:-false}
      SI_WARMUP_TRENDS_MONTHS: ${SI_WARMUP_TRENDS_MONTHS:-6}
      TOTVS_POOL_ENABLED: ${TOTVS_POOL_ENABLED:-true}
      TOTVS_POOL_MAX_SIZE: ${TOTVS_POOL_MAX_SIZE:-8}
      SI_PERIOD_SCORES_ENABLED: ${SI_PERIOD_SCORES_ENABLED:-true}
      SI_PERIOD_SCORES_REFRESH_ENABLED: ${SI_PERIOD_SCORES_REFRESH_ENABLED:-true}
      SI_PERIOD_SCORES_REFRESH_INTERVAL_SECONDS: ${SI_PERIOD_SCORES_REFRESH_INTERVAL_SECONDS:-300}
      SI_PERIOD_SCORES_REFRESH_TRENDS_MONTHS: ${SI_PERIOD_SCORES_REFRESH_TRENDS_MONTHS:-3}
      SI_PERIOD_SCORES_REFRESH_PER_DEPARTMENT: ${SI_PERIOD_SCORES_REFRESH_PER_DEPARTMENT:-false}
      SI_PERIOD_SCORES_REFRESH_INCLUDE_PREVIOUS: ${SI_PERIOD_SCORES_REFRESH_INCLUDE_PREVIOUS:-true}
      SI_PERIOD_SCORES_REFRESH_BRANCHES: ${SI_PERIOD_SCORES_REFRESH_BRANCHES:-}
      SI_RUN_MIGRATIONS_ON_STARTUP: ${SI_RUN_MIGRATIONS_ON_STARTUP:-true}

      ENV: ${API_DELPI_ENV}
      JWT_SECRET: ${API_DELPI_JWT_SECRET}

      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}

      JWT_ALGORITHMS: ${JWT_ALGORITHMS}
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}

      PLUGINS_DB_HOST: ${PLUGINS_DB_HOST}
      PLUGINS_DB_PORT: ${PLUGINS_DB_PORT}
      PLUGINS_DB_NAME: ${PLUGINS_DB_NAME}
      PLUGINS_DB_USER: ${PLUGINS_DB_USER}
      PLUGINS_DB_PASSWORD: ${PLUGINS_DB_PASSWORD}
      PLUGINS_DB_CONNECT_TIMEOUT: ${PLUGINS_DB_CONNECT_TIMEOUT}
      PLUGINS_DB_SSLMODE: ${PLUGINS_DB_SSLMODE}

      PORTAL_RH_DB_HOST: ${PORTAL_RH_DB_HOST}
      PORTAL_RH_DB_PORT: ${PORTAL_RH_DB_PORT}
      PORTAL_RH_DB_NAME: ${PORTAL_RH_DB_NAME}
      PORTAL_RH_DB_USER: ${PORTAL_RH_DB_USER}
      PORTAL_RH_DB_PASSWORD: ${PORTAL_RH_DB_PASSWORD}
      PORTAL_RH_DB_CONNECT_TIMEOUT: ${PORTAL_RH_DB_CONNECT_TIMEOUT}
      PORTAL_RH_DB_SSLMODE: ${PORTAL_RH_DB_SSLMODE}

    volumes:
      - ../strategic-indicators-api:/app
      - ../shared:/shared

    depends_on:
      - keycloak
      - postgres-plugins

    networks:
      - delpi-network

  transformometro-api:
    build:
      context: ..
      dockerfile: transformometro-api/Dockerfile

    container_name: delpi-transformometro-api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      PORT: "8000"
      TM_API_ROOT_PATH: /apps/transformometro-api
      TM_RUN_MIGRATIONS_ON_STARTUP: ${TM_RUN_MIGRATIONS_ON_STARTUP:-true}

      JWT_SECRET: ${API_DELPI_JWT_SECRET}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      JWT_ALGORITHMS: ${JWT_ALGORITHMS}
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}

      PLUGINS_DB_HOST: ${PLUGINS_DB_HOST}
      PLUGINS_DB_PORT: ${PLUGINS_DB_PORT}
      PLUGINS_DB_NAME: ${PLUGINS_DB_NAME}
      PLUGINS_DB_USER: ${PLUGINS_DB_USER}
      PLUGINS_DB_PASSWORD: ${PLUGINS_DB_PASSWORD}
      PLUGINS_DB_CONNECT_TIMEOUT: ${PLUGINS_DB_CONNECT_TIMEOUT}
      PLUGINS_DB_SSLMODE: ${PLUGINS_DB_SSLMODE}

    volumes:
      - ../transformometro-api:/app
      - ../shared:/shared

    depends_on:
      - keycloak
      - postgres-plugins

    networks:
      - delpi-network

  postgres-plugins:
    image: pgvector/pgvector:pg15
    platform: linux/amd64
    container_name: delpi-postgres-plugins
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${PLUGINS_DB_NAME}
      POSTGRES_USER: ${PLUGINS_DB_USER}
      POSTGRES_PASSWORD: ${PLUGINS_DB_PASSWORD}
      TZ: ${TZ}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

    ports:
      - "5433:5432"

    volumes:
      - postgres_plugins_data:/var/lib/postgresql/data
      - ./docker/postgres/plugins-init.sql:/docker-entrypoint-initdb.d/plugins-init.sql

    networks:
      - delpi-network

  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile.dev

    container_name: delpi-gateway
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ../gateway/nginx.dev.conf:/etc/nginx/nginx.conf

    # Nginx resolve plugins sob demanda (delpi-{id}). Evita rebuild de todos os MFEs ao subir o gateway.
    depends_on:
      - portal
      - core-api
      - keycloak
      - api-delpi

    networks:
      - delpi-network


networks:
  delpi-network:
    driver: bridge


volumes:
  postgres_core_data:
  keycloak_data:
  postgres_plugins_data:
  ollama_data:
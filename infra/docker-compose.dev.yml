services:

  postgres-core:
    image: postgres:15
    container_name: delpi-postgres-core
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_CORE_DB}
      POSTGRES_USER: ${POSTGRES_CORE_USER}
      POSTGRES_PASSWORD: ${POSTGRES_CORE_PASSWORD}
      TZ: ${TZ}

    ports:
      - "5432:5432"

    volumes:
      - postgres_core_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - delpi-network


  keycloak-db:
    image: postgres:15
    container_name: delpi-keycloak-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_KC_DB}
      POSTGRES_USER: ${POSTGRES_KC_USER}
      POSTGRES_PASSWORD: ${POSTGRES_KC_PASSWORD}
      TZ: ${TZ}

    volumes:
      - keycloak_data:/var/lib/postgresql/data

    networks:
      - delpi-network


  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: delpi-keycloak
    command: ["start-dev"]

    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${POSTGRES_KC_DB}
      KC_DB_USERNAME: ${POSTGRES_KC_USER}
      KC_DB_PASSWORD: ${POSTGRES_KC_PASSWORD}

      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_HTTP_ENABLED: ${KC_HTTP_ENABLED}
      KC_HTTP_PORT: ${KC_HTTP_PORT}
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH}

      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT}
      KC_HOSTNAME_STRICT_HTTPS: ${KC_HOSTNAME_STRICT_HTTPS}

      KC_PROXY: ${KC_PROXY}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS}

      TZ: ${TZ}

    depends_on:
      - keycloak-db

    networks:
      delpi-network:
        aliases:
          - keycloak

    volumes:
      - ./keycloak/themes:/opt/keycloak/themes:ro


  core-api:
    build:
      context: ..
      dockerfile: core-api/Dockerfile.dev

    container_name: delpi-core-api
    restart: unless-stopped

    environment:
      FLASK_APP: app.create_app:create_app
      FLASK_ENV: development
      TZ: ${TZ}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      SECRET_KEY: ${SECRET_KEY}

      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}

      INITIAL_SUPERADMIN_EMAIL: ${INITIAL_SUPERADMIN_EMAIL}
      INITIAL_SUPERADMIN_NAME: ${INITIAL_SUPERADMIN_NAME}

      CORE_API_INTEGRATIONS_SERVICE_TOKEN: ${CORE_API_INTEGRATIONS_SERVICE_TOKEN:-}

      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_ADMIN_REALM}
      KEYCLOAK_ADMIN_URL: ${KEYCLOAK_ADMIN_URL}

    volumes:
      - ../core-api:/app

    depends_on:
      - postgres-core
      - keycloak

    networks:
      - delpi-network

  ollama:
    image: ollama/ollama:latest
    container_name: delpi-ollama
    restart: unless-stopped

    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    networks:
      - delpi-network

  minha-delpi-ai-api:
    build:
      context: ../minha-delpi-ai-api
      dockerfile: Dockerfile.dev

    container_name: delpi-minha-delpi-ai-api
    restart: unless-stopped

    environment:
      FLASK_APP: app.main:app
      FLASK_ENV: development
      TZ: ${TZ}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${PLUGINS_DB_USER}:${PLUGINS_DB_PASSWORD}@postgres-plugins:5432/${PLUGINS_DB_NAME}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
      JWT_ALGORITHMS: ${JWT_ALGORITHMS:-RS256}
      CORE_API_BASE_URL: http://core-api:8000
      CORE_API_TIMEOUT_SECONDS: 5
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-768}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-0}
      CHAT_SESSION_TITLE_LLM_ENABLED: ${CHAT_SESSION_TITLE_LLM_ENABLED:-true}
      CHAT_HISTORY_MAX_MESSAGES: ${CHAT_HISTORY_MAX_MESSAGES:-12}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-120}
      MAX_CONTEXT_CHUNKS: ${MAX_CONTEXT_CHUNKS:-6}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-9000}

      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_WINDOW_SECONDS: 60
      RATE_LIMIT_CHAT_MESSAGES_PER_WINDOW: 20
      RATE_LIMIT_TOOL_CALLS_PER_WINDOW: 30
      RATE_LIMIT_KNOWLEDGE_WRITES_PER_WINDOW: 10
      RATE_LIMIT_ADMIN_ACTIONS_PER_WINDOW: 20

      KNOWLEDGE_TITLE_MAX_CHARS: 200
      KNOWLEDGE_SOURCE_REF_MAX_CHARS: 500
      KNOWLEDGE_DOCUMENT_MAX_CHARS: 50000
      KNOWLEDGE_CHUNK_SIZE: 1400
      KNOWLEDGE_CHUNK_OVERLAP: 200

    volumes:
      - ../minha-delpi-ai-api:/app

    depends_on:
      - core-api
      - postgres-plugins
      - ollama
      
    networks:
      - delpi-network

  portal:
    build:
      context: ../portal
      dockerfile: Dockerfile.dev

    container_name: delpi-portal
    restart: unless-stopped

    environment:
      TZ: ${TZ}

      VITE_KC_URL: ${VITE_KC_URL}
      VITE_KC_REALM: ${VITE_KC_REALM}
      VITE_KC_CLIENT_ID: ${VITE_KC_CLIENT_ID}
      VITE_KC_REDIRECT_URI: ${VITE_KC_REDIRECT_URI}

    volumes:
      - ../portal:/app
      - /app/node_modules

    depends_on:
      - core-api

    networks:
      - delpi-network


  dashboard-delpi:
    build:
      context: ../plugins/dashboard-delpi
      dockerfile: Dockerfile

    container_name: delpi-dashboard-delpi
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    volumes:
      - ../plugins/dashboard-delpi:/app
      - /app/node_modules

    networks:
      - delpi-network

  strategic-indicators:
    build:
      context: ../plugins/strategic-indicators
      dockerfile: Dockerfile

    container_name: delpi-strategic-indicators
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    volumes:
      - ../plugins/strategic-indicators:/app
      - /app/node_modules

    networks:
      - delpi-network
  minha-delpi-chat:
    build:
      context: ../plugins/minha-delpi-chat
      dockerfile: Dockerfile

    container_name: delpi-minha-delpi-chat
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    volumes:
      - ../plugins/minha-delpi-chat:/app
      - /app/node_modules

    networks:
      - delpi-network
  dashboard-lmps:
    build:
      context: ../plugins/dashboard-lmps
      dockerfile: Dockerfile

    container_name: delpi-dashboard-lmps
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    volumes:
      - ../plugins/dashboard-lmps:/app
      - /app/node_modules

    networks:
      - delpi-network

  dashboard-quality:
    build:
      context: ../plugins/dashboard-quality
      dockerfile: Dockerfile

    container_name: delpi-dashboard-quality
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    volumes:
      - ../plugins/dashboard-quality:/app
      - /app/node_modules

    networks:
      - delpi-network

  api-delpi:
    build:
      context: ..
      dockerfile: api-delpi/Dockerfile

    container_name: delpi-api-delpi
    restart: unless-stopped
    
    env_file:
      - .env

    environment:
      DB_HOST: ${TOTVS_DB_HOST}
      DB_PORT: ${TOTVS_DB_PORT}
      DB_USER: ${TOTVS_DB_USER}
      DB_PASSWORD: ${TOTVS_DB_PASSWORD}
      DB_DATABASE: ${TOTVS_DB_DATABASE}

      PORT: ${API_DELPI_PORT}
      ENV: ${API_DELPI_ENV}
      JWT_SECRET: ${API_DELPI_JWT_SECRET}

      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}

      JWT_ALGORITHMS: ${JWT_ALGORITHMS}
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}

      PLUGINS_DB_HOST: ${PLUGINS_DB_HOST}
      PLUGINS_DB_PORT: ${PLUGINS_DB_PORT}
      PLUGINS_DB_NAME: ${PLUGINS_DB_NAME}
      PLUGINS_DB_USER: ${PLUGINS_DB_USER}
      PLUGINS_DB_PASSWORD: ${PLUGINS_DB_PASSWORD}
      PLUGINS_DB_CONNECT_TIMEOUT: ${PLUGINS_DB_CONNECT_TIMEOUT}
      PLUGINS_DB_SSLMODE: ${PLUGINS_DB_SSLMODE}

      PORTAL_RH_DB_HOST: ${PORTAL_RH_DB_HOST}
      PORTAL_RH_DB_PORT: ${PORTAL_RH_DB_PORT}
      PORTAL_RH_DB_NAME: ${PORTAL_RH_DB_NAME}
      PORTAL_RH_DB_USER: ${PORTAL_RH_DB_USER}
      PORTAL_RH_DB_PASSWORD: ${PORTAL_RH_DB_PASSWORD}
      PORTAL_RH_DB_CONNECT_TIMEOUT: ${PORTAL_RH_DB_CONNECT_TIMEOUT}
      PORTAL_RH_DB_SSLMODE: ${PORTAL_RH_DB_SSLMODE}
      
    volumes:
      - ../api-delpi:/app

    depends_on:
      - keycloak
      - postgres-plugins

    networks:
      - delpi-network

  strategic-indicators-api:
    build:
      context: ..
      dockerfile: strategic-indicators-api/Dockerfile

    container_name: delpi-strategic-indicators-api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: ${TOTVS_DB_HOST}
      DB_PORT: ${TOTVS_DB_PORT}
      DB_USER: ${TOTVS_DB_USER}
      DB_PASSWORD: ${TOTVS_DB_PASSWORD}
      DB_DATABASE: ${TOTVS_DB_DATABASE}

      PORT: "8000"
      SI_API_ROOT_PATH: /apps/strategic-indicators-api
      SI_SNAPSHOT_CACHE_TTL_SECONDS: ${SI_SNAPSHOT_CACHE_TTL_SECONDS:-600}
      SI_WARMUP_ON_STARTUP: ${SI_WARMUP_ON_STARTUP:-true}
      SI_WARMUP_TRENDS_MONTHS: ${SI_WARMUP_TRENDS_MONTHS:-6}
      TOTVS_POOL_ENABLED: ${TOTVS_POOL_ENABLED:-true}
      TOTVS_POOL_MAX_SIZE: ${TOTVS_POOL_MAX_SIZE:-8}
      SI_PERIOD_SCORES_ENABLED: ${SI_PERIOD_SCORES_ENABLED:-true}
      SI_RUN_MIGRATIONS_ON_STARTUP: ${SI_RUN_MIGRATIONS_ON_STARTUP:-true}

      ENV: ${API_DELPI_ENV}
      JWT_SECRET: ${API_DELPI_JWT_SECRET}

      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}

      JWT_ALGORITHMS: ${JWT_ALGORITHMS}
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}

      PLUGINS_DB_HOST: ${PLUGINS_DB_HOST}
      PLUGINS_DB_PORT: ${PLUGINS_DB_PORT}
      PLUGINS_DB_NAME: ${PLUGINS_DB_NAME}
      PLUGINS_DB_USER: ${PLUGINS_DB_USER}
      PLUGINS_DB_PASSWORD: ${PLUGINS_DB_PASSWORD}
      PLUGINS_DB_CONNECT_TIMEOUT: ${PLUGINS_DB_CONNECT_TIMEOUT}
      PLUGINS_DB_SSLMODE: ${PLUGINS_DB_SSLMODE}

      PORTAL_RH_DB_HOST: ${PORTAL_RH_DB_HOST}
      PORTAL_RH_DB_PORT: ${PORTAL_RH_DB_PORT}
      PORTAL_RH_DB_NAME: ${PORTAL_RH_DB_NAME}
      PORTAL_RH_DB_USER: ${PORTAL_RH_DB_USER}
      PORTAL_RH_DB_PASSWORD: ${PORTAL_RH_DB_PASSWORD}
      PORTAL_RH_DB_CONNECT_TIMEOUT: ${PORTAL_RH_DB_CONNECT_TIMEOUT}
      PORTAL_RH_DB_SSLMODE: ${PORTAL_RH_DB_SSLMODE}

    volumes:
      - ../strategic-indicators-api:/app

    depends_on:
      - keycloak
      - postgres-plugins

    networks:
      - delpi-network

  postgres-plugins:
    image: pgvector/pgvector:pg15
    container_name: delpi-postgres-plugins
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${PLUGINS_DB_NAME}
      POSTGRES_USER: ${PLUGINS_DB_USER}
      POSTGRES_PASSWORD: ${PLUGINS_DB_PASSWORD}
      TZ: ${TZ}

    ports:
      - "5433:5432"

    volumes:
      - postgres_plugins_data:/var/lib/postgresql/data
      - ./docker/postgres/plugins-init.sql:/docker-entrypoint-initdb.d/plugins-init.sql

    networks:
      - delpi-network

  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile.dev

    container_name: delpi-gateway
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ../gateway/nginx.dev.conf:/etc/nginx/nginx.conf

    depends_on:
      - portal
      - core-api
      - keycloak
      - strategic-indicators
      - api-delpi
      - strategic-indicators-api
      - dashboard-lmps
      - dashboard-quality
      - minha-delpi-ai-api
      - minha-delpi-chat

    networks:
      - delpi-network


networks:
  delpi-network:
    driver: bridge


volumes:
  postgres_core_data:
  keycloak_data:
  postgres_plugins_data:
  ollama_data:
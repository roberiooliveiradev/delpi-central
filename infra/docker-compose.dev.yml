      PORT: "8000"
      TV_DASHBOARD_API_ROOT_PATH: /apps/tv-dashboard-api
      TV_DASHBOARD_RUN_MIGRATIONS_ON_STARTUP: ${TV_DASHBOARD_RUN_MIGRATIONS_ON_STARTUP:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      JWT_SECRET: ${API_DELPI_JWT_SECRET}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      JWT_ALGORITHMS: ${JWT_ALGORITHMS}
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}
      DELPI_API_URL: ${DELPI_API_URL:-http://delpi-api-delpi:8000}
      DELPI_API_CALLER_APP: tv-dashboard-api
      STRATEGIC_INDICATORS_API_BASE_URL: ${STRATEGIC_INDICATORS_API_BASE_URL:-http://strategic-indicators-api:8000}
      PLUGINS_DB_HOST: ${PLUGINS_DB_HOST}
      PLUGINS_DB_PORT: ${PLUGINS_DB_PORT}
      PLUGINS_DB_NAME: ${PLUGINS_DB_NAME}
      PLUGINS_DB_USER: ${PLUGINS_DB_USER}
      PLUGINS_DB_PASSWORD: ${PLUGINS_DB_PASSWORD}
      TV_DASHBOARD_MEDIA_UPLOAD_DIR: ${TV_DASHBOARD_MEDIA_UPLOAD_DIR:-/app/data/tv-dashboard/media}

    volumes:
      - ../tv-dashboard-api:/app
      - ../shared:/shared
      - ${DELPI_DATA_HOST_DIR:-${HOME}/.delpi}/tv-dashboard/media:/app/data/tv-dashboard/media

    depends_on:
      - keycloak
      - postgres-plugins
      - api-delpi
      - strategic-indicators-api

    networks:
      - delpi-network

  postgres-plugins:
    image: pgvector/pgvector:pg15
    platform: linux/amd64
    container_name: delpi-postgres-plugins
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${PLUGINS_DB_NAME}
      POSTGRES_USER: ${PLUGINS_DB_USER}
      POSTGRES_PASSWORD: ${PLUGINS_DB_PASSWORD}
      TZ: ${TZ}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

    ports:
      - "5433:5432"

    volumes:
      - postgres_plugins_data:/var/lib/postgresql/data
      - ./docker/postgres/plugins-init.sql:/docker-entrypoint-initdb.d/plugins-init.sql

    networks:
      - delpi-network

  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile.dev

    container_name: delpi-gateway
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ../gateway/nginx.dev.conf:/etc/nginx/nginx.conf

    # Nginx resolve plugins sob demanda (delpi-{id}). Evita rebuild de todos os MFEs ao subir o gateway.
    depends_on:
      - portal
      - core-api
      - keycloak
      - api-delpi

    networks:
      - delpi-network


networks:
  delpi-network:
    driver: bridge


volumes:
  postgres_core_data:
  keycloak_data:
  postgres_plugins_data:
  ollama_data:
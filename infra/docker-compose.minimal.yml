# Override dev — stack mínimo: reforça desligamento de extras pesados.
# O dev padrão já sobe essencial + TV Dashboard; demais plugins ficam em profile `plugins`.
# Ollama/SearXNG/LanguageTool: só com --profile optional-heavy (ou --heavy no script sequencial).
#
# Uso:
#   ./infra/scripts/up-minimal-dev.sh
#   ./infra/scripts/up-minimal-dev.sh --restore

services:
  searxng:
    profiles: !override
      - optional-heavy

  languagetool:
    profiles: !override
      - optional-heavy

  ollama:
    profiles: !override
      - optional-heavy
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: "1"
    deploy:
      resources:
        limits:
          memory: 4500M

  strategic-indicators-api:
    profiles:
      - optional-heavy

  transformometro-api:
    profiles:
      - optional-heavy

  maintenance-api:
    profiles:
      - optional-heavy

  minha-delpi-ai-api:
    depends_on: !override
      core-api:
        condition: service_started
      postgres-plugins:
        condition: service_healthy
    environment:
      CHAT_WEB_SEARCH_ENABLED: "false"
      CHAT_LEARNING_GLOSSARY_WEB_MEANING: "false"
      CHAT_PRESENTATION_COLUMN_LABEL_WEB_SEARCH_ENABLED: "false"
      CHAT_TYPING_CORRECTION_ENABLED: "false"
      CHAT_TEXT_CORRECTION_SPELL_CHECK_ENABLED: "false"
      OLLAMA_MODEL: qwen2.5:1.5b
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-1536}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1024}
      # Caps abaixo = Ollama CPU only. Com LLM_PROVIDER=openai_compatible o código
      # ignora CHAT_RESPONSE_MODE_*_MAX_TOKENS e usa generationLimitsCloud (JSON).
      # Override cloud (opcional): CHAT_RESPONSE_MODE_CLOUD_NORMAL_MAX_TOKENS=2048
      CHAT_RESPONSE_MODE_FAST_MAX_TOKENS: ${CHAT_RESPONSE_MODE_FAST_MAX_TOKENS:-256}
      CHAT_RESPONSE_MODE_FAST_NUM_CTX: ${CHAT_RESPONSE_MODE_FAST_NUM_CTX:-1024}
      CHAT_RESPONSE_MODE_NORMAL_MAX_TOKENS: ${CHAT_RESPONSE_MODE_NORMAL_MAX_TOKENS:-448}
      CHAT_RESPONSE_MODE_NORMAL_NUM_CTX: ${CHAT_RESPONSE_MODE_NORMAL_NUM_CTX:-1280}
      CHAT_RESPONSE_MODE_THINKER_MODEL: ${CHAT_RESPONSE_MODE_THINKER_MODEL:-qwen2.5:1.5b}
      CHAT_RESPONSE_MODE_THINKER_MAX_TOKENS: ${CHAT_RESPONSE_MODE_THINKER_MAX_TOKENS:-768}
      CHAT_RESPONSE_MODE_THINKER_NUM_CTX: ${CHAT_RESPONSE_MODE_THINKER_NUM_CTX:-2048}
      CHAT_RESPONSE_MODE_CLOUD_NORMAL_MAX_TOKENS: ${CHAT_RESPONSE_MODE_CLOUD_NORMAL_MAX_TOKENS:-}
      CHAT_RESPONSE_MODE_CLOUD_THINKER_MAX_TOKENS: ${CHAT_RESPONSE_MODE_CLOUD_THINKER_MAX_TOKENS:-}
      CHAT_HISTORY_MAX_MESSAGES: "8"
      MAX_CONTEXT_CHUNKS: "4"
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-12000}
      CHAT_AGENTIC_LOOP_MAX_STEPS: "1"
    deploy:
      resources:
        limits:
          memory: 3500M

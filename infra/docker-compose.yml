services:

  postgres-core:
    image: postgres:15
    container_name: delpi-postgres-core
    environment:
      POSTGRES_DB: delpi_core
      POSTGRES_USER: delpi
      POSTGRES_PASSWORD: delpi123
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres_core_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  keycloak-db:
    image: postgres:15
    container_name: delpi-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    volumes:
      - keycloak_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: delpi-keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db

  core-api:
    build: ../core-api
    container_name: delpi-core-api
    volumes:
      - ../core-api:/app
    ports:
      - "8000:8000"
    env_file:
      - ../core-api/.env
    environment:
      - FLASK_APP=app.main
    depends_on:
      - postgres-core
  

  portal:
    build: ../portal
    container_name: delpi-portal
    ports:
      - "5173:5173"
    depends_on:
      - core-api

  gateway:
    build: ../gateway
    container_name: delpi-gateway
    ports:
      - "80:80"
    depends_on:
      - portal
      - core-api
      - keycloak

volumes:
  postgres_core_data:
  keycloak_data:

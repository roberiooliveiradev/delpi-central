      API_DELPI_INTERNAL_SERVICE_TOKEN: ${API_DELPI_INTERNAL_SERVICE_TOKEN:-}

      CORE_API_BASE_URL: ${CORE_API_BASE_URL:-http://core-api:8000}
      CORE_API_INTEGRATIONS_SERVICE_TOKEN: ${CORE_API_INTEGRATIONS_SERVICE_TOKEN:-}
      APP_USAGE_APP_ID: api-delpi
      APP_USAGE_TRACKING_ENABLED: ${APP_USAGE_TRACKING_ENABLED:-true}
      QUERY_CACHE_BACKEND: ${QUERY_CACHE_BACKEND:-memory}
      QUERY_CACHE_TTL_SECONDS: ${QUERY_CACHE_TTL_SECONDS:-300}
      REDIS_URL: ${REDIS_URL:-}
      SQL_TELEMETRY_BACKEND: ${SQL_TELEMETRY_BACKEND:-memory}
      SQL_TELEMETRY_MAX_ENTRIES: ${SQL_TELEMETRY_MAX_ENTRIES:-800}
      CONSOLE_ALERT_WEBHOOK_URL: ${CONSOLE_ALERT_WEBHOOK_URL:-}
      CONSOLE_ALERT_WEBHOOK_ENABLED: ${CONSOLE_ALERT_WEBHOOK_ENABLED:-true}
      CONSOLE_ALERT_PORTAL_ENABLED: ${CONSOLE_ALERT_PORTAL_ENABLED:-true}
      CONSOLE_ALERT_P95_THRESHOLD_MS: ${CONSOLE_ALERT_P95_THRESHOLD_MS:-3000}
      CONSOLE_ALERT_SLOW_SQL_THRESHOLD_MS: ${CONSOLE_ALERT_SLOW_SQL_THRESHOLD_MS:-2500}

      PORTAL_RH_DB_HOST: ${PORTAL_RH_DB_HOST}
      PORTAL_RH_DB_PORT: ${PORTAL_RH_DB_PORT}
      PORTAL_RH_DB_NAME: ${PORTAL_RH_DB_NAME}
      PORTAL_RH_DB_USER: ${PORTAL_RH_DB_USER}
      PORTAL_RH_DB_PASSWORD: ${PORTAL_RH_DB_PASSWORD}
      PORTAL_RH_DB_CONNECT_TIMEOUT: ${PORTAL_RH_DB_CONNECT_TIMEOUT}
      PORTAL_RH_DB_SSLMODE: ${PORTAL_RH_DB_SSLMODE}

      SUPPLIES_IDD_SHEET_ID: ${SUPPLIES_IDD_SHEET_ID:-}
      SUPPLIES_NEGOTIATION_SAVINGS_SHEET_GID: ${SUPPLIES_NEGOTIATION_SAVINGS_SHEET_GID:-}

      RUN_PLUGINS_MIGRATIONS_ON_STARTUP: ${RUN_PLUGINS_MIGRATIONS_ON_STARTUP:-true}
      PAC_EVIDENCE_UPLOAD_DIR: ${PAC_EVIDENCE_UPLOAD_DIR:-/app/data/pac-evidences}
      KAIZEN_EVIDENCE_UPLOAD_DIR: ${KAIZEN_EVIDENCE_UPLOAD_DIR:-/app/data/kaizen-evidences}
      AUDIT_5S_NC_UPLOAD_DIR: ${AUDIT_5S_NC_UPLOAD_DIR:-/app/data/audit-5s-nc}
      AUDIT_5S_RESPONSE_UPLOAD_DIR: ${AUDIT_5S_RESPONSE_UPLOAD_DIR:-/app/data/audit-5s-responses}
      QUALITY_LABELS_QR_DIR: ${QUALITY_LABELS_QR_DIR:-/app/data/quality-labels/qr}
      QUALITY_LABELS_SIGNATURE_DIR: ${QUALITY_LABELS_SIGNATURE_DIR:-/app/data/quality-labels/signatures}
      QUALITY_LABELS_CERTIFICATE_DIR: ${QUALITY_LABELS_CERTIFICATE_DIR:-/app/data/quality-labels/certificates}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 40s

    depends_on:
      - keycloak
      - postgres-plugins
      - transformometro-api

    volumes:
      # Evidências PAC e anexos Auditoria 5S — persistir fora do container (sobrevive a deploy)
      - ${DELPI_DATA_HOST_DIR:-/var/lib/delpi}/pac-evidences:/app/data/pac-evidences
      - ${DELPI_DATA_HOST_DIR:-/var/lib/delpi}/kaizen-evidences:/app/data/kaizen-evidences
      - ${DELPI_DATA_HOST_DIR:-/var/lib/delpi}/audit-5s-nc:/app/data/audit-5s-nc
      - ${DELPI_DATA_HOST_DIR:-/var/lib/delpi}/audit-5s-responses:/app/data/audit-5s-responses
      - ${DELPI_DATA_HOST_DIR:-/var/lib/delpi}/quality-labels/qr:/app/data/quality-labels/qr
      - ${DELPI_DATA_HOST_DIR:-/var/lib/delpi}/quality-labels/signatures:/app/data/quality-labels/signatures
      - ${DELPI_DATA_HOST_DIR:-/var/lib/delpi}/quality-labels/certificates:/app/data/quality-labels/certificates
      # Logs de aplicação persistentes (sobrevivem a deploy/recreate)
      - ${DELPI_DATA_HOST_DIR:-/var/lib/delpi}/api-delpi-logs:/app/logs

    networks:
      - delpi-network


services:

  postgres-core:
    image: postgres:15
    container_name: delpi-postgres-core
    environment:
      POSTGRES_DB: delpi_core
      POSTGRES_USER: delpi
      POSTGRES_PASSWORD: delpi123
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres_core_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - delpi-network

  postgres-core-test:
    image: postgres:15
    container_name: delpi-postgres-core-test
    environment:
      POSTGRES_DB: delpi_core_test
      POSTGRES_USER: delpi
      POSTGRES_PASSWORD: delpi123
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres_core_test_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - delpi-network

  keycloak-db:
    image: postgres:15
    container_name: delpi-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    networks:
      - delpi-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: delpi-keycloak
    command: start-dev --hostname-strict=false
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_PROXY: edge
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true

      # URL pública parametrizada
      KC_HOSTNAME_URL: "${PUBLIC_BASE_URL}/auth"
      KC_HOSTNAME_ADMIN_URL: "${PUBLIC_BASE_URL}:8080"

    ports:
      - "8080:8080"
    networks:
      - delpi-network

  core-api:
    build: ../core-api
    container_name: delpi-core-api
    volumes:
      - ../core-api:/app
    ports:
      - "8000:8000"
    env_file:
      - ../core-api/.env
    environment:
      FLASK_APP: app.create_app:create_app
      FLASK_ENV: development
    depends_on:
      - postgres-core
      - keycloak
    networks:
      - delpi-network

  portal:
    build: ../portal
    container_name: delpi-portal
    command: npm run dev -- --host
    volumes:
      - ../portal:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - core-api
    networks:
      - delpi-network

  api-delpi:
    build: ../api-delpi
    container_name: delpi-api-delpi
    environment:
      # JWKS interno via rede Docker
      KEYCLOAK_JWKS_URL: "http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs"

      # Issuer público (baseado no domínio configurado)
      KEYCLOAK_ISSUER: "${PUBLIC_BASE_URL}/auth/realms/${KEYCLOAK_REALM}"

      KEYCLOAK_AUDIENCE: "delpi-central"
    depends_on:
      - keycloak
    networks:
      - delpi-network

  gateway:
    build: ../gateway
    container_name: delpi-gateway
    ports:
      - "80:80"
    depends_on:
      - portal
      - core-api
      - keycloak
      - api-delpi
    networks:
      - delpi-network

networks:
  delpi-network:
    driver: bridge

volumes:
  postgres_core_data:
  postgres_core_test_data:
  keycloak_data:
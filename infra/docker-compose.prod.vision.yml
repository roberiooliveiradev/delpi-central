# Override produção — instala Docling/Paddle (requirements-vision.txt) na imagem da API.
#
# Uso:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.vision.yml \
#     build minha-delpi-ai-api
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.vision.yml \
#     up -d --force-recreate minha-delpi-ai-api
#
# Requer CHAT_DOCUMENT_VISION_BACKEND=docling (ou paddleocr) no .env quando aplicável.

services:
  minha-delpi-ai-api:
    build:
      context: ..
      dockerfile: minha-delpi-ai-api/Dockerfile.prod
      args:
        INSTALL_VISION_EXTRAS: "true"

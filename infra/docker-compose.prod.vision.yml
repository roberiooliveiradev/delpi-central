# Override legado produção — desde jun/2026 docker-compose.yml já fixa INSTALL_VISION_EXTRAS=true.
# Mantido para fluxos explícitos e compatibilidade com scripts antigos.
#
# Uso (equivalente ao compose base):
#   docker compose -f infra/docker-compose.yml build minha-delpi-ai-api

services:
  minha-delpi-ai-api:
    build:
      context: ..
      dockerfile: minha-delpi-ai-api/Dockerfile.prod
      args:
        INSTALL_VISION_EXTRAS: "true"

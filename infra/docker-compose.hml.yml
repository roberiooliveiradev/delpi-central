      - ${DELPI_HML_DATA_HOST_DIR:-./hml-data}/lancamento-notas-fiscais-danfe:/app/data/lancamento-notas-fiscais-danfe
    environment:
      PORT: "8000"
      CONTROLLERSHIP_FINANCE_API_ROOT_PATH: /apps/controllership-finance-api
      MCP_RESOURCE_URL: ${PUBLIC_BASE_URL}/apps/controllership-finance-api/mcp
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      DELPI_AUTH_CORE_API_URL: http://core-api:8000
      DELPI_API_URL: http://api-delpi:8000
      DELPI_API_TIMEOUT: ${DELPI_API_TIMEOUT:-30}
      DELPI_API_CALLER_APP: controllership-finance-api
      JWT_SECRET: ${API_DELPI_JWT_SECRET}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      JWT_ALGORITHMS: ${JWT_ALGORITHMS}
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}
      CORE_API_BASE_URL: http://core-api:8000
      CORE_API_INTEGRATIONS_SERVICE_TOKEN: ${CORE_API_INTEGRATIONS_SERVICE_TOKEN:-${API_DELPI_INTERNAL_SERVICE_TOKEN:-}}
      CORE_API_EFFECTIVE_ACCESS_SERVICE_TOKEN: ${CORE_API_EFFECTIVE_ACCESS_SERVICE_TOKEN:-}
      CORE_API_TIMEOUT: ${CORE_API_TIMEOUT:-10}
      S2S_TOKEN_URL: ${CF_S2S_TOKEN_URL:-${S2S_TOKEN_URL:-}}
      S2S_CLIENT_ID: ${CF_S2S_CLIENT_ID:-controllership-finance-api}
      S2S_CLIENT_SECRET: ${CF_S2S_CLIENT_SECRET:-}
      S2S_SCOPE: ${CF_S2S_SCOPE:-}
      S2S_TIMEOUT_SECONDS: ${CF_S2S_TIMEOUT_SECONDS:-10}
      CF_DOCUMENT_UPLOAD_DIR: ${CF_DOCUMENT_UPLOAD_DIR:-/app/data/cf-closing-documents}
      PLUGINS_DB_HOST: postgres-plugins
      PLUGINS_DB_PORT: "5432"
      PLUGINS_DB_NAME: ${PLUGINS_DB_NAME:-plugins_hub}
      PLUGINS_DB_USER: ${PLUGINS_DB_USER}
      PLUGINS_DB_PASSWORD: ${PLUGINS_DB_PASSWORD}
      PLUGINS_DB_CONNECT_TIMEOUT: ${PLUGINS_DB_CONNECT_TIMEOUT:-5}
      PLUGINS_DB_SSLMODE: ${PLUGINS_DB_SSLMODE:-prefer}
      CONTROLLERSHIP_FINANCE_RUN_MIGRATIONS_ON_STARTUP: ${CONTROLLERSHIP_FINANCE_RUN_MIGRATIONS_ON_STARTUP:-true}
      # Protheus — mesmos NOMES de PROD/DEV; valores vêm de .env.hml (não hardcode).
      TOTVS_DB_HOST: ${TOTVS_DB_HOST}
      TOTVS_DB_PORT: ${TOTVS_DB_PORT:-1433}
      TOTVS_DB_USER: ${TOTVS_DB_USER}
      TOTVS_DB_PASSWORD: ${TOTVS_DB_PASSWORD}
      TOTVS_DB_DATABASE: ${TOTVS_DB_DATABASE}
      DB_HOST: ${TOTVS_DB_HOST}
      DB_PORT: ${TOTVS_DB_PORT:-1433}
      DB_USER: ${TOTVS_DB_USER}
      DB_PASSWORD: ${TOTVS_DB_PASSWORD}
      DB_DATABASE: ${TOTVS_DB_DATABASE}
      TOTVS_CONNECT_TIMEOUT: ${TOTVS_CONNECT_TIMEOUT:-10}
      TOTVS_QUERY_TIMEOUT: ${TOTVS_QUERY_TIMEOUT:-120}
      TOTVS_POOL_ENABLED: ${TOTVS_POOL_ENABLED:-true}
      TOTVS_POOL_MAX_SIZE: ${TOTVS_POOL_MAX_SIZE:-10}
      TOTVS_POOL_ACQUIRE_TIMEOUT: ${TOTVS_POOL_ACQUIRE_TIMEOUT:-60}
      TOTVS_POOL_MAX_WAITERS: ${TOTVS_POOL_MAX_WAITERS:-30}
      FINANCIAL_API_BASE_URL: ${FINANCIAL_API_BASE_URL:-http://financial-api:8000}
      FINANCIAL_API_TIMEOUT_SECONDS: ${FINANCIAL_API_TIMEOUT_SECONDS:-30}
      ENTRY_AUDIT_ENABLED: ${ENTRY_AUDIT_ENABLED:-true}
      API_DELPI_INTERNAL_SERVICE_TOKEN: ${API_DELPI_INTERNAL_SERVICE_TOKEN:-}
      # LNF hosted — dark no boot; ensaio liga via .env.hml / override.
      LNF_HOSTED_ENABLED: ${LNF_HOSTED_ENABLED:-true}
      LNF_REALTIME_ENABLED: ${LNF_REALTIME_ENABLED:-false}
      LNF_MIGRATIONS_MODE: ${LNF_MIGRATIONS_MODE:-apply}
      LNF_NOTIFICATIONS_ENABLED: ${LNF_NOTIFICATIONS_ENABLED:-false}
      LNF_DANFE_UPLOAD_DIR: ${LNF_DANFE_UPLOAD_DIR:-/app/data/lancamento-notas-fiscais-danfe}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: 1g
    cpus: 1.0
    labels:
      delpi.environment: homologation
      delpi.project: delpi-hml

  commercial-api:
    extends:
      file: docker-compose.yml
      service: commercial-api
    profiles: [commercial-api, baseline, platform]
    image: delpi-hml/commercial-api:local
    container_name: delpi-hml-commercial-api
    ports: !override []
    env_file: !override
      - path: env.hml.example
        required: true
      - path: .env.hml
        required: false
    depends_on: !override {}
    networks: !override
      - delpi-hml
    volumes: !override
      - ${DELPI_HML_DATA_HOST_DIR:-./hml-data}/commercial-avatars:/app/data/commercial-avatars
      - ${DELPI_HML_DATA_HOST_DIR:-./hml-data}/commercial-attachments:/app/data/commercial-attachments
      - ${DELPI_HML_DATA_HOST_DIR:-./hml-data}/commercial-user-avatars:/app/data/commercial-user-avatars
    environment:
      APP_ENV: homologation
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      DELPI_AUTH_CORE_API_URL: http://core-api:8000
      DELPI_API_URL: http://api-delpi:8000
      CORE_API_BASE_URL: http://core-api:8000
      COMMERCIAL_RUN_MIGRATIONS_ON_STARTUP: "true"
      COMMERCIAL_SATISFACTION_SURVEY_ENABLED: ${COMMERCIAL_SATISFACTION_SURVEY_ENABLED:-true}
      COMMERCIAL_SATISFACTION_TOKEN_KEY: ${COMMERCIAL_SATISFACTION_TOKEN_KEY:-}
      COMMERCIAL_INTEGRATION_JOBS_SCHEDULER_ENABLED: "false"
      MCP_RESOURCE_URL: ${PUBLIC_BASE_URL}/apps/commercial-api/mcp
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: 1g
    cpus: 1.0
    labels:
      delpi.environment: homologation
      delpi.project: delpi-hml

  commercial:
    extends:
      file: docker-compose.yml
      service: commercial
    profiles: [commercial, baseline, platform]
    image: delpi-hml/commercial:local
    container_name: delpi-hml-commercial
    ports: !override []
    depends_on: !override {}
    networks: !override
      - delpi-hml
    volumes: !override []
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null -T 3 http://127.0.0.1/assets/remoteEntry.js || wget -q -O /dev/null -T 3 http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m
    cpus: 0.5
    labels:
      delpi.environment: homologation
      delpi.project: delpi-hml

  public-hub:
    extends:
      file: docker-compose.yml
      service: public-hub
    profiles: [public-hub, baseline, platform]
    image: delpi-hml/public-hub:local
    container_name: delpi-hml-public-hub
    ports: !override []
    depends_on: !override {}
    networks: !override
      - delpi-hml
    volumes: !override []
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null -T 3 http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m
    cpus: 0.5
    labels:
      delpi.environment: homologation
      delpi.project: delpi-hml

  gateway:
    extends:
      file: docker-compose.yml
      service: gateway
    # Profile `gateway`: sobe só o nginx HML (Keycloak já ativo).
    # Sem depends_on de portal/core-api/api-delpi — nginx resolve DNS sob demanda.
    profiles: [gateway, baseline, platform, production-control]
    image: delpi-hml/gateway:local
    container_name: delpi-hml-gateway
    build:
      context: ../gateway
      dockerfile: Dockerfile.hml
    # Bind no IP LAN da VM (parametrizado). Não usar 0.0.0.0 sem necessidade.
    # :18080 → HTTP legado (health/rollback); :18443 → HTTPS canônico (login PKCE).
    ports: !override
      - "${DELPI_HML_BIND_ADDR}:18080:80"
      - "${DELPI_HML_BIND_ADDR}:${DELPI_HML_TLS_PORT:-18443}:443"
    depends_on: !override {}
    networks: !override
      - delpi-hml
    volumes: !override
      - ./hml-certs/hml-gateway.crt:/etc/nginx/hml-certs/hml-gateway.crt:ro
      - ./hml-certs/hml-gateway.key:/etc/nginx/hml-certs/hml-gateway.key:ro
    environment:
      # REUSE healthcheck.sh: HTTP interno :80 (não exige CA no container).
      GATEWAY_HEALTHCHECK_HOST: ${DELPI_HML_PUBLIC_HOST:-${DELPI_HML_BIND_ADDR}}
      GATEWAY_HEALTHCHECK_PATHS: /auth/realms/master
    healthcheck:
      test: ["CMD", "/usr/local/bin/gateway-healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    mem_limit: 256m
    cpus: 0.5
    labels:
      delpi.environment: homologation
      delpi.project: delpi-hml

networks:
  delpi-hml:
    name: delpi-hml-network
    driver: bridge

volumes:
  delpi-hml-postgres-core:
    name: delpi-hml-postgres-core
  delpi-hml-keycloak:
    name: delpi-hml-keycloak
  delpi-hml-postgres-plugins:
    name: delpi-hml-postgres-plugins

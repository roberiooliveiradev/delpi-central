# Homologação Minha DELPI — projeto Docker `delpi-hml`.
#
# EXISTING_EQUIVALENT:
#   docker-compose.yml          produção (não alterar daqui)
#   docker-compose.dev.yml      desenvolvimento local
#   (overrides antigos minimal/cpu/vision/kc-fix/qa foram absorvidos nos 3 canônicos)
#   up-prod-sequential.sh / up-dev-sequential.sh  subida sequencial por fase
#   compose-filter-services.sh  filtro de serviços já usado pelos scripts
#
# REUSE_DECISION:
#   Estender somente o cenário-base a partir de docker-compose.yml.
#   Não copiar o Compose de produção. `extends` reaproveita build, imagem
#   upstream e ambiente; cada serviço troca, com !override, o que a mesclagem
#   do Compose concatenaria (portas, volumes, redes, depends_on, env_file).
#   COMPOSE_PROJECT_NAME sozinho não isola container_name, bind absoluto,
#   porta 80 nem a rede/volume com nome explícito.
#
# Este arquivo não publica 80/443, não anexa `delpi-network` e não monta
# /var/lib/delpi nem /mnt/fileserver. `docker compose up` sem --profile
# não sobe serviço nenhum: todo serviço exige profile.
#
# Profile `databases`: somente postgres-core, keycloak-db e postgres-plugins.
# Sem depends_on entre eles — `up --profile databases --no-deps` não puxa
# Keycloak, APIs, Portal nem gateway.
#
# Checkout previsto no servidor: /home/operador/projetos-teste/delpi-central
# Operação: infra/scripts/hml-compose.sh

name: delpi-hml

services:
  postgres-core:
    extends:
      file: docker-compose.yml
      service: postgres-core
    profiles: [databases, baseline, platform, production-control]
    image: postgres:15
    container_name: delpi-hml-postgres-core
    ports: !override []
    networks: !override
      - delpi-hml
    volumes: !override
      - delpi-hml-postgres-core:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 1g
    cpus: 1.0
    labels:
      delpi.environment: homologation
      delpi.project: delpi-hml

  keycloak-db:
    extends:
      file: docker-compose.yml
      service: keycloak-db
    profiles: [databases, keycloak, baseline, platform, production-control]
    image: postgres:15
    container_name: delpi-hml-keycloak-db
    ports: !override []
    networks: !override
      - delpi-hml
    volumes: !override
      - delpi-hml-keycloak:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 768m
    cpus: 0.5
    labels:
      delpi.environment: homologation
      delpi.project: delpi-hml

  postgres-plugins:
    extends:
      file: docker-compose.yml
      service: postgres-plugins
    profiles: [databases, baseline, platform, production-control]
    image: pgvector/pgvector:pg15
    container_name: delpi-hml-postgres-plugins
    ports: !override []
    networks: !override
      - delpi-hml
    volumes: !override
      - delpi-hml-postgres-plugins:/var/lib/postgresql/data
      - ./docker/postgres/plugins-init.sql:/docker-entrypoint-initdb.d/plugins-init.sql:ro
    mem_limit: 1g
    cpus: 1.0
    labels:
      delpi.environment: homologation
      delpi.project: delpi-hml

  delpi-redis:
    extends:
      file: docker-compose.yml
      service: delpi-redis
    # Profile `redis`: up isolado (--no-deps). Sem porta no host.
    profiles: [redis, baseline, platform, production-control]
    image: redis:7-alpine
    container_name: delpi-hml-redis
    ports: !override []
    networks: !override
      - delpi-hml
    volumes: !override []
    mem_limit: 256m
    cpus: 0.5
    labels:
      delpi.environment: homologation
      delpi.project: delpi-hml

  keycloak:
    extends:
      file: docker-compose.yml
      service: keycloak
    # Profile `keycloak` sobe só esta instância (bancos já ativos via databases).
    profiles: [keycloak, baseline, platform, production-control]
    # Paridade com produção: mesma imagem efetiva por digest (tag 24.0).
    # Digest produtivo confirmado: sha256:f8ade94c1d0ad2f2fa7734a455fee5392764f402c43ca35e9af6bf63a2541dc9
    # Banco, secrets, realm e sessões são exclusivos de HML — nunca compartilhar.
    image: quay.io/keycloak/keycloak@sha256:f8ade94c1d0ad2f2fa7734a455fee5392764f402c43ca35e9af6bf63a2541dc9
    container_name: delpi-hml-keycloak
    ports: !override []
    depends_on: !override
      keycloak-db:
        condition: service_started
    networks: !override
      delpi-hml:
        aliases:
          - keycloak
    volumes: !override
      - ./keycloak/themes:/opt/keycloak/themes:ro
    environment:
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_PORT: ${KC_HOSTNAME_PORT:-18443}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT:-false}
      KC_HOSTNAME_STRICT_HTTPS: ${KC_HOSTNAME_STRICT_HTTPS:-true}
      KC_PROXY: ${KC_PROXY:-edge}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH:-/auth}
      KC_HTTP_ENABLED: ${KC_HTTP_ENABLED:-true}
      KC_FEATURES: ${KC_FEATURES:-token-exchange,admin-fine-grained-authz}
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    mem_limit: 1g
    cpus: 1.0
    labels:
      delpi.environment: homologation
      delpi.project: delpi-hml

  core-api:
    extends:
      file: docker-compose.yml
      service: core-api
    # Profile `core-api`: up isolado (DBs/KC já healthy; script usa --no-deps).
    profiles: [core-api, baseline, platform, production-control]
    image: delpi-hml/core-api:local
    container_name: delpi-hml-core-api
    ports: !override []
    depends_on: !override {}
    networks: !override
      - delpi-hml
    volumes: !override
      - ${DELPI_HML_DATA_HOST_DIR:-./hml-data}/core-user-avatars:/app/data/core-user-avatars
    environment:
      API_DELPI_ENV: homologation
      DELPI_API_URL: http://api-delpi:8000
      NOTIFICATIONS_DISPATCH_SCHEDULER_ENABLED: "false"
      CORE_NOTIFICATION_MAIL_ENABLED: "false"
      GRAPH_REPORTS_TENANT_ID: ""
      GRAPH_REPORTS_CLIENT_ID: ""
      GRAPH_REPORTS_CLIENT_SECRET: ""
      # Redis HML permanece desligado nesta etapa; stores em memória.
      USER_PRESENCE_STORE: memory
      APP_USAGE_STORE: memory
      WORKSPACE_CONTEXT_STORE: memory
      REDIS_URL: ""
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    mem_limit: 1g
    cpus: 1.0
    labels:
      delpi.environment: homologation
      delpi.project: delpi-hml

  api-delpi:
    extends:
      file: docker-compose.yml
      service: api-delpi
    # Profile `api-delpi`: up isolado após Redis + plugins DB healthy.
    profiles: [api-delpi, baseline, platform, production-control]
    image: delpi-hml/api-delpi:local
    container_name: delpi-hml-api-delpi
    ports: !override []
    env_file: !override
      - path: env.hml.example
        required: true
      - path: .env.hml
        required: false
    # Dependências checadas pelo hml-compose (script) + --no-deps.
    depends_on: !override {}
    networks: !override
      - delpi-hml
    volumes: !override
      - ${DELPI_HML_DATA_HOST_DIR:-./hml-data}/drawing-pdfs:/drawing-pdfs:ro
      - ${DELPI_HML_DATA_HOST_DIR:-./hml-data}/api-delpi-logs:/app/logs
    environment:
      # TOTVS permanece inalcançável até a cópia sanitizada autorizada.
      # Estes valores vencem env_file e o shell: não há caminho de escrita
      # para o SQL Server de produção a partir deste Compose.
      API_DELPI_ENV: homologation
      DB_HOST: totvs-disabled.hml.invalid
      DB_PORT: "1433"
      DB_USER: hml_disabled
      DB_PASSWORD: hml_disabled
      DB_DATABASE: DISABLED
      PORTAL_RH_API_URL: ""
      PORTAL_RH_API_SERVICE_TOKEN: ""
      PORTAL_RH_DB_HOST: ""
      PORTAL_RH_DB_PORT: ""
      PORTAL_RH_DB_NAME: ""
      PORTAL_RH_DB_USER: ""
      PORTAL_RH_DB_PASSWORD: ""
      PROTHEUS_SUPPLIER_CREATE_ENABLED: "false"
      PROTHEUS_SUPPLIER_UPDATE_ENABLED: "false"
      PROTHEUS_REST_EXPECTED_BASE_URL: ""
      OPENAPI_CONSUMER_NOTIFY_ON_STARTUP: "false"
      OPENAPI_CONSUMER_NOTIFY_ENABLED: "false"
      OPENAPI_CONSUMER_CHAT_SYNC_URL: ""
      OPENAPI_CONSUMER_TV_SYNC_URL: ""
      CONSOLE_ALERT_WEBHOOK_ENABLED: "false"
      CONSOLE_ALERT_WEBHOOK_URL: ""
      AUDIT_5S_NOTIFICATIONS_ENABLED: "false"
      INVOICE_ISSUANCE_NOTIFICATIONS_ENABLED: "false"
      SCHEDULING_NOTIFICATIONS_ENABLED: "false"
      GRAPH_TENANT_ID: ""
      GRAPH_CLIENT_ID: ""
      GRAPH_CLIENT_SECRET: ""
      GRAPH_REPORTS_TENANT_ID: ""
      GRAPH_REPORTS_CLIENT_ID: ""
      GRAPH_REPORTS_CLIENT_SECRET: ""
      MCP_RESOURCE_URL: ${PUBLIC_BASE_URL}/apps/api-delpi/mcp
      TRANSFORMOMETRO_API_BASE_URL: ""
      REDIS_URL: redis://:${DELPI_REDIS_PASSWORD}@delpi-redis:6379/0
      # Schema plugins HML: migrations canônicas no primeiro up do cenário.
      RUN_PLUGINS_MIGRATIONS_ON_STARTUP: "true"
    mem_limit: 1536m
    cpus: 1.0
    labels:
      delpi.environment: homologation
      delpi.project: delpi-hml

  portal:
    extends:
      file: docker-compose.yml
      service: portal
    # Profile `portal`: up isolado após Gate A (script exige core-api healthy).
    # Build args VITE_* vêm do --env-file .env.hml (bake-time; nunca imagem prod).
    profiles: [portal, baseline, platform, production-control]
    image: delpi-hml/portal:local
    container_name: delpi-hml-portal
    build:
      context: ..
      dockerfile: portal/Dockerfile.prod
      args:
        VITE_KC_URL: ${VITE_KC_URL}
        VITE_KC_REALM: ${VITE_KC_REALM}
        VITE_KC_CLIENT_ID: ${VITE_KC_CLIENT_ID}
        VITE_KC_REDIRECT_URI: ${VITE_KC_REDIRECT_URI}
        VITE_FRONT_CHANNEL_LOGOUT_URLS: ${VITE_FRONT_CHANNEL_LOGOUT_URLS:-__none__}
    ports: !override []
    depends_on: !override {}
    networks: !override
      - delpi-hml
    volumes: !override []
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null -T 3 http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m
    cpus: 0.5
    labels:
      delpi.environment: homologation
      delpi.project: delpi-hml

  plugin-ui:
    extends:
      file: docker-compose.yml
      service: plugin-ui
    profiles: [plugin-ui, baseline, platform, production-control]
    image: delpi-hml/plugin-ui:local
    container_name: delpi-hml-plugin-ui
    ports: !override []
    networks: !override
      - delpi-hml
    volumes: !override []
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null -T 3 http://127.0.0.1/assets/remoteEntry.js || wget -q -O /dev/null -T 3 http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m
    cpus: 0.5
    labels:
      delpi.environment: homologation
      delpi.project: delpi-hml

  production-control:
    extends:
      file: docker-compose.yml
      service: production-control
    # Profile dedicado `production-control-ui` (frontend). O profile
    # `production-control` continua agrupando API+UI no cenário amplo.
    profiles: [production-control-ui, baseline, production-control]
    image: delpi-hml/production-control:local
    container_name: delpi-hml-production-control
    ports: !override []
    depends_on: !override {}
    networks: !override
      - delpi-hml
    volumes: !override []
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null -T 3 http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m
    cpus: 0.5
    labels:
      delpi.environment: homologation
      delpi.project: delpi-hml

  # MFE LNF — default API_BASE = api-delpi; corte sobrescreve VITE_LNF_API_BASE no build.
  lancamento-notas-fiscais:
    extends:
      file: docker-compose.yml
      service: lancamento-notas-fiscais
    profiles: [lancamento-notas-fiscais, baseline, platform]
    image: delpi-hml/lancamento-notas-fiscais:local
    container_name: delpi-hml-lancamento-notas-fiscais
    build:
      context: ../plugins
      dockerfile: lancamento-notas-fiscais/Dockerfile
      args:
        VITE_LNF_API_BASE: ${VITE_LNF_API_BASE:-/apps/controllership-finance-api/lancamento-notas-fiscais}
        VITE_LNF_REALTIME_ENABLED: ${VITE_LNF_REALTIME_ENABLED:-false}
    ports: !override []
    depends_on: !override {}
    networks: !override
      - delpi-hml
    volumes: !override []
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null -T 3 http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 256m
    cpus: 0.5
    labels:
      delpi.environment: homologation
      delpi.project: delpi-hml

  production-control-api:
    extends:
      file: docker-compose.yml
      service: production-control-api
    profiles: [production-control-api, baseline, production-control]
    image: delpi-hml/production-control-api:local
    container_name: delpi-hml-production-control-api
    ports: !override []
    env_file: !override
      - path: env.hml.example
        required: true
      - path: .env.hml
        required: false
    depends_on: !override {}
    networks: !override
      - delpi-hml
    volumes: !override
      - ${DELPI_HML_DATA_HOST_DIR:-./hml-data}/product-3d-models:/app/data/product-3d-models
    environment:
      DELPI_API_URL: http://api-delpi:8000
      PRODUCTION_PULSE_API_URL: ""
      REQUESTS_API_URL: ""
      PORTAL_RH_API_URL: ""
      PORTAL_RH_API_SERVICE_TOKEN: ""
      PC_MES_CT_AUTONOMOUS_ENABLED: "false"
      PC_MES_CT_AUTONOMOUS_WORK_CENTERS: ""
      PC_MES_DOWNTIME_ALERTS_ENABLED: "false"
      CORE_API_BASE_URL: http://core-api:8000
      # Migrations canônicas no banco plugins HML (one-shot no cenário).
      PC_RUN_MIGRATIONS_ON_STARTUP: "true"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: 1g
    cpus: 1.0
    labels:
      delpi.environment: homologation
      delpi.project: delpi-hml

  requests-api:
    extends:
      file: docker-compose.yml
      service: requests-api
    profiles: [requests-api, baseline, platform]
    image: delpi-hml/requests-api:local
    container_name: delpi-hml-requests-api
    ports: !override []
    env_file: !override
      - path: env.hml.example
        required: true
      - path: .env.hml
        required: false
    depends_on: !override {}
    networks: !override
      - delpi-hml
    volumes: !override
      - ${DELPI_HML_DATA_HOST_DIR:-./hml-data}/my-requests-attachments:/app/data/my-requests-attachments
      - ${DELPI_HML_DATA_HOST_DIR:-./hml-data}/my-requests-artifacts:/app/data/my-requests-artifacts
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      DELPI_API_URL: http://api-delpi:8000
      CORE_API_URL: http://core-api:8000
      REQUESTS_RUN_MIGRATIONS_ON_STARTUP: "true"
      REQUESTS_OUTBOX_WORKER_ENABLED: "false"
      MY_REQUESTS_ATTACHMENT_UPLOAD_DIR: /app/data/my-requests-attachments
      MY_REQUESTS_ARTIFACT_UPLOAD_DIR: /app/data/my-requests-artifacts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: 768m
    cpus: 0.75
    labels:
      delpi.environment: homologation
      delpi.project: delpi-hml

  my-requests:
    extends:
      file: docker-compose.yml
      service: my-requests
    profiles: [my-requests, baseline, platform]
    image: delpi-hml/my-requests:local
    container_name: delpi-hml-my-requests
    ports: !override []
    depends_on: !override {}
    networks: !override
      - delpi-hml
    volumes: !override []
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null -T 3 http://127.0.0.1/assets/remoteEntry.js || wget -q -O /dev/null -T 3 http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m
    cpus: 0.5
    labels:
      delpi.environment: homologation
      delpi.project: delpi-hml

  engineering-api:
    extends:
      file: docker-compose.yml
      service: engineering-api
    profiles: [engineering-api, baseline, platform]
    image: delpi-hml/engineering-api:local
    container_name: delpi-hml-engineering-api
    ports: !override []
    env_file: !override
      - path: env.hml.example
        required: true
      - path: .env.hml
        required: false
    depends_on: !override {}
    networks: !override
      - delpi-hml
    volumes: !override
      - ${DELPI_HML_DATA_HOST_DIR:-./hml-data}/prc-attachments:/app/data/prc-attachments
      - ${DELPI_HML_DATA_HOST_DIR:-./hml-data}/ocr-models:/opt/ocr-models:ro
    environment:
      APP_ENV: homologation
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      DELPI_AUTH_CORE_API_URL: http://core-api:8000
      DELPI_API_URL: http://api-delpi:8000
      REQUESTS_API_URL: http://requests-api:8000
      MCP_RESOURCE_URL: ${PUBLIC_BASE_URL}/apps/engineering-api/mcp
      # S2S HML opcional — vazio = facts fail-closed (sem credencial prod).
      S2S_TOKEN_URL: ${ENG_S2S_TOKEN_URL:-${S2S_TOKEN_URL:-}}
      S2S_CLIENT_ID: ${ENG_S2S_CLIENT_ID:-engineering-api}
      S2S_CLIENT_SECRET: ${ENG_S2S_CLIENT_SECRET:-}
      S2S_SCOPE: ${ENG_S2S_SCOPE:-}
      # EVA/OCR/mutações — fail-closed em HML até autorização específica.
      ENG_EVA_ACT_ENABLED: ""
      ENG_EVA_ACT_DELETE_ENABLED: ""
      ENG_EVA_ACT_IMPORT_ENABLED: ""
      ENG_DRAWING_BENCHMARK_ENABLED: "false"
      ENG_DRAWING_OCR_BENCHMARK_ENABLED: ""
      ENG_DRAWING_OCR_MODEL_DIR: ""
      ENG_NC_REPOSITORY: ""
      ENG_NC_DB_HOST: ""
      ENG_NC_DB_USER: ""
      ENG_NC_DB_PASSWORD: ""
      ENG_NC_IMPORT_REPLACE_ENABLED: ""
      INSTALL_VISION_EXTRAS: "false"
      # Product Registration — schema engineering já migrado pelo api-delpi;
      # principal dedicado eng_prc (nunca PLUGINS_DB_USER).
      ENG_PRC_REPOSITORY: postgres
      ENG_PRC_DB_HOST: postgres-plugins
      ENG_PRC_DB_PORT: "5432"
      ENG_PRC_DB_NAME: ${PLUGINS_DB_NAME:-plugins_hub}
      ENG_PRC_DB_USER: eng_prc
      ENG_PRC_DB_PASSWORD: ${ENG_PRC_DB_PASSWORD}
      ENG_PRC_DB_SSLMODE: ${ENG_PRC_DB_SSLMODE:-prefer}
      ENG_PRC_ATTACHMENTS_STORAGE: disk
      ENG_PRC_ATTACHMENTS_DIR: /app/data/prc-attachments
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: 1g
    cpus: 1.0
    labels:
      delpi.environment: homologation
      delpi.project: delpi-hml

  engineering:
    extends:
      file: docker-compose.yml
      service: engineering
    profiles: [engineering, baseline, platform]
    image: delpi-hml/engineering:local
    container_name: delpi-hml-engineering
    ports: !override []
    depends_on: !override {}
    networks: !override
      - delpi-hml
    volumes: !override []
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null -T 3 http://127.0.0.1/assets/remoteEntry.js || wget -q -O /dev/null -T 3 http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m
    cpus: 0.5
    labels:
      delpi.environment: homologation
      delpi.project: delpi-hml

  # Portal Financeiro — fonte Questor da auditoria de entradas. Segredos só no .env.hml.
  financial-api:
    extends:
      file: docker-compose.yml
      service: financial-api
    profiles: [financial-api, baseline, platform]
    image: delpi-hml/financial-api:local
    container_name: delpi-hml-financial-api
    ports: !override []
    env_file: !override
      - path: env.hml.example
        required: true
      - path: .env.hml
        required: false
    depends_on: !override {}
    networks: !override
      - delpi-hml
    volumes: !override []
    environment:
      DELPI_API_URL: http://api-delpi:8000
      DELPI_AUTH_CORE_API_URL: http://core-api:8000

    cpus: 1.0
    labels:
      delpi.environment: homologation
      delpi.project: delpi-hml

  # BFF Controladoria & Finanças — ensaio F4b do corte LNF e auditoria de entradas.
  controllership-finance-api:
    extends:
      file: docker-compose.yml
      service: controllership-finance-api
    profiles: [controllership-finance-api, baseline, platform]
    image: delpi-hml/controllership-finance-api:local
    container_name: delpi-hml-controllership-finance-api
    ports: !override []
    env_file: !override
      - path: env.hml.example
        required: true
      - path: .env.hml
        required: false
    # Deps (postgres-plugins/core/keycloak) sobem por cenário; profile isolado
    # não inclui databases — mesmo padrão de engineering-api/requests-api.

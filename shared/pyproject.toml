[project]
name = "delpi-auth"
version = "0.1.0"
description = "DELPI Central shared security module"
requires-python = ">=3.10"
dependencies = [
    "python-jose",
    "requests",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["delpi_auth"]
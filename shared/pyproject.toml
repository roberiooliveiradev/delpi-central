[project]
name = "delpi-auth"
version = "0.1.0"
description = "DELPI Central shared authentication and authorization SDK"
readme = "README.md"
requires-python = ">=3.10"

authors = [
  { name = "DELPI Engenharia" }
]

dependencies = [
  "python-jose[cryptography]>=3.3.0",
  "requests>=2.31.0"
]

[project.optional-dependencies]

flask = [
  "flask>=2.3"
]

fastapi = [
  "fastapi>=0.110",
  "starlette>=0.36",
  "httpx>=0.27"
]

dev = [
  "pytest>=7",
  "ruff>=0.4",
  "mypy>=1.8"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["delpi_auth*"]

[tool.setuptools]
zip-safe = false
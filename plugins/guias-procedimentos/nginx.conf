server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  absolute_redirect off;

  location /health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Deep links internos (ex.: /guias/emissao-nota-fiscal) → index do MFE.
  # Assets versionados e remoteEntry ficam em /assets/* (Gateway faz o rewrite).
  location / {
    try_files $uri $uri/ /index.html;
  }
}

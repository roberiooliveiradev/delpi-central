server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  absolute_redirect off;

  location /health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Standalone / deep links internos → index do MFE.
  # Assets e remoteEntry ficam em /assets/* (Gateway faz o rewrite por id).
  location / {
    try_files $uri $uri/ /index.html;
  }
}

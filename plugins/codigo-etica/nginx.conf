server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  absolute_redirect off;

  # Vite emite o worker do PDF.js como .mjs. Sem MIME de JavaScript o browser
  # rejeita o module script (application/octet-stream).
  location ~* \.mjs$ {
    types {
      application/javascript mjs;
    }
    default_type application/javascript;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}

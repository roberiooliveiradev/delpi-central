<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#003866" />
    <link rel="icon" type="image/svg+xml" href="/p/logoMinhaDelpi.svg" />
    <title>Minha DELPI</title>
    <style>
      /* Critical path: glow + marca estática (sem raios JS até o remote ScreenLoading). */
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: #05070a;
      }
      .pub-splash--boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, sans-serif;
        background: #05070a;
        isolation: isolate;
      }
      .pub-splash--boot .pub-splash__glow {
        position: absolute;
        inset: 18% 22%;
        border-radius: 50%;
        background:
          radial-gradient(circle at 50% 45%, rgba(48, 184, 236, 0.22), transparent 62%),
          radial-gradient(circle at 50% 70%, rgba(8, 155, 219, 0.12), transparent 55%);
        filter: blur(28px);
        animation: pub-splash-breathe 3.2s ease-in-out infinite;
      }
      .pub-splash--boot .pub-splash__stage {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        text-align: center;
      }
      .pub-splash--boot .pub-splash__mark {
        width: min(168px, 52vw);
        animation: pub-splash-mark 2.6s ease-in-out infinite;
      }
      .pub-splash--boot .pub-splash__mark svg {
        width: 100%;
        height: auto;
        display: block;
        filter: drop-shadow(0 0 18px rgba(48, 184, 236, 0.35));
      }
      .pub-splash--boot .pub-splash__label {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: #9fb0c5;
      }
      .pub-splash--boot .pub-splash__bar {
        width: min(180px, 56vw);
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.08);
      }
      .pub-splash--boot .pub-splash__bar-fill {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #30b8ec, #089bdb, transparent);
        animation: pub-splash-bar 1.35s ease-in-out infinite;
      }
      @keyframes pub-splash-breathe {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.96);
        }
        50% {
          opacity: 1;
          transform: scale(1.04);
        }
      }
      @keyframes pub-splash-mark {
        0%,
        100% {
          transform: scale(0.98);
          opacity: 0.92;
        }
        50% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes pub-splash-bar {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(280%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pub-splash--boot .pub-splash__glow,
        .pub-splash--boot .pub-splash__mark,
        .pub-splash--boot .pub-splash__bar-fill {
          animation: none;
        }
        .pub-splash--boot .pub-splash__bar-fill {
          width: 70%;
          transform: none;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("pub-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div
        class="pub-splash pub-splash--boot"
        role="status"
        aria-live="polite"
        aria-busy="true"
        aria-label="Carregando"
      >
        <div class="pub-splash__glow" aria-hidden="true"></div>
        <div class="pub-splash__stage">
          <div class="pub-splash__mark" aria-hidden="true">
            <svg viewBox="0 0 320 200" focusable="false">
              <defs>
                <linearGradient id="pub-boot-swoosh" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#089bdb" />
                  <stop offset="45%" stop-color="#30b8ec" />
                  <stop offset="100%" stop-color="#089bdb" />
                </linearGradient>
              </defs>
              <path
                d="M248 168C330 98 255 -18 138 58C248 -38 372 96 248 168Z"
                fill="url(#pub-boot-swoosh)"
              />
              <text
                x="20"
                y="78"
                fill="#30b8ec"
                font-family="system-ui, -apple-system, sans-serif"
                font-size="28"
                font-weight="700"
              >
                minha
              </text>
              <text
                x="20"
                y="128"
                fill="#e8f4fb"
                font-family="system-ui, -apple-system, sans-serif"
                font-size="36"
                font-weight="800"
              >
                delpi
              </text>
            </svg>
          </div>
          <p class="pub-splash__label">Carregando</p>
          <div class="pub-splash__bar" aria-hidden="true">
            <span class="pub-splash__bar-fill"></span>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.addEventListener("error", function (event) {
        var root = document.getElementById("root");
        if (!root || root.dataset.mounted === "1") return;
        var message =
          (event && event.error && event.error.message) ||
          (event && event.message) ||
          "Erro ao carregar a página.";
        root.innerHTML =
          '<div class="pub-fallback pub-fallback--fatal"><h1>Não foi possível exibir esta página</h1><p>' +
          message +
          "</p></div>";
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

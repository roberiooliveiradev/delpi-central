<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#003866" />
    <link rel="icon" type="image/svg+xml" href="/p/logoMinhaDelpi.svg" />
    <title>Minha DELPI</title>
    <style>
      /* Critical path: badge + logo; claro por default, escuro via tema / SO. */
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: #f4f8fb;
      }
      .pub-splash--boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, sans-serif;
        background:
          radial-gradient(1100px 520px at 50% -8%, rgba(8, 155, 219, 0.12), transparent),
          radial-gradient(900px 500px at 90% 110%, rgba(12, 111, 176, 0.08), transparent),
          linear-gradient(160deg, #f4f8fb, #eaf2f8 55%, #f4f8fb);
        isolation: isolate;
      }
      .pub-splash--boot .pub-splash__glow {
        position: absolute;
        inset: 22% 26%;
        border-radius: 50%;
        background:
          radial-gradient(circle at 50% 45%, rgba(8, 155, 219, 0.18), transparent 62%),
          radial-gradient(circle at 50% 70%, rgba(12, 111, 176, 0.1), transparent 55%);
        filter: blur(28px);
        animation: pub-splash-breathe 3.2s ease-in-out infinite;
      }
      .pub-splash--boot .pub-splash__stage {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        text-align: center;
      }
      .pub-splash--boot .pub-splash__badge-wrap {
        position: relative;
        width: 128px;
        height: 128px;
        display: grid;
        place-items: center;
      }
      .pub-splash--boot .pub-splash__orbit-ring {
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 1.5px solid rgba(12, 111, 176, 0.32);
        pointer-events: none;
      }
      .pub-splash--boot .pub-splash__badge {
        position: relative;
        z-index: 1;
        width: 112px;
        height: 112px;
        border-radius: 50%;
        background: #fff;
        border: 1px solid rgba(228, 231, 236, 0.95);
        box-shadow: 0 16px 40px rgba(3, 40, 70, 0.12);
        display: grid;
        place-items: center;
        overflow: hidden;
        animation: pub-splash-badge 2.8s ease-in-out infinite;
      }
      .pub-splash--boot .pub-splash__badge img {
        width: 74%;
        height: auto;
        display: block;
      }
      .pub-splash--boot .pub-splash__label {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: #5a6b7d;
      }
      .pub-splash--boot .pub-splash__bar {
        width: min(180px, 56vw);
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(0, 56, 102, 0.1);
      }
      .pub-splash--boot .pub-splash__bar-fill {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #0c6fb0, #089bdb, transparent);
        animation: pub-splash-bar 1.35s ease-in-out infinite;
      }

      html[data-theme="dark"],
      html[data-theme="dark"] body,
      html[data-theme="dark"] #root {
        background: #05070a;
      }
      html[data-theme="dark"] .pub-splash--boot {
        background: #05070a;
      }
      html[data-theme="dark"] .pub-splash--boot .pub-splash__glow {
        background:
          radial-gradient(circle at 50% 45%, rgba(48, 184, 236, 0.16), transparent 62%),
          radial-gradient(circle at 50% 70%, rgba(8, 155, 219, 0.08), transparent 55%);
      }
      html[data-theme="dark"] .pub-splash--boot .pub-splash__orbit-ring {
        border-color: rgba(48, 184, 236, 0.4);
      }
      html[data-theme="dark"] .pub-splash--boot .pub-splash__badge {
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.28);
      }
      html[data-theme="dark"] .pub-splash--boot .pub-splash__label {
        color: #9fb0c5;
      }
      html[data-theme="dark"] .pub-splash--boot .pub-splash__bar {
        background: rgba(255, 255, 255, 0.08);
      }
      html[data-theme="dark"] .pub-splash--boot .pub-splash__bar-fill {
        background: linear-gradient(90deg, transparent, #30b8ec, #089bdb, transparent);
      }

      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]),
        html:not([data-theme="light"]) body,
        html:not([data-theme="light"]) #root {
          background: #05070a;
        }
        html:not([data-theme="light"]) .pub-splash--boot {
          background: #05070a;
        }
        html:not([data-theme="light"]) .pub-splash--boot .pub-splash__glow {
          background:
            radial-gradient(circle at 50% 45%, rgba(48, 184, 236, 0.16), transparent 62%),
            radial-gradient(circle at 50% 70%, rgba(8, 155, 219, 0.08), transparent 55%);
        }
        html:not([data-theme="light"]) .pub-splash--boot .pub-splash__orbit-ring {
          border-color: rgba(48, 184, 236, 0.4);
        }
        html:not([data-theme="light"]) .pub-splash--boot .pub-splash__badge {
          box-shadow: 0 12px 36px rgba(0, 0, 0, 0.28);
        }
        html:not([data-theme="light"]) .pub-splash--boot .pub-splash__label {
          color: #9fb0c5;
        }
        html:not([data-theme="light"]) .pub-splash--boot .pub-splash__bar {
          background: rgba(255, 255, 255, 0.08);
        }
        html:not([data-theme="light"]) .pub-splash--boot .pub-splash__bar-fill {
          background: linear-gradient(90deg, transparent, #30b8ec, #089bdb, transparent);
        }
      }

      @keyframes pub-splash-breathe {
        0%,
        100% {
          opacity: 0.5;
          transform: scale(0.96);
        }
        50% {
          opacity: 0.95;
          transform: scale(1.04);
        }
      }
      @keyframes pub-splash-badge {
        0%,
        100% {
          transform: scale(0.97);
          opacity: 0.94;
        }
        50% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes pub-splash-bar {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(280%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pub-splash--boot .pub-splash__glow,
        .pub-splash--boot .pub-splash__badge,
        .pub-splash--boot .pub-splash__bar-fill {
          animation: none;
        }
        .pub-splash--boot .pub-splash__bar-fill {
          width: 70%;
          transform: none;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("pub-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div
        class="pub-splash pub-splash--boot"
        role="status"
        aria-live="polite"
        aria-busy="true"
        aria-label="Carregando"
      >
        <div class="pub-splash__glow" aria-hidden="true"></div>
        <div class="pub-splash__stage">
          <div class="pub-splash__badge-wrap" aria-hidden="true">
            <span class="pub-splash__orbit-ring"></span>
            <div class="pub-splash__badge">
              <img src="/p/logoMinhaDelpi.svg" alt="" draggable="false" />
            </div>
          </div>
          <p class="pub-splash__label">Carregando</p>
          <div class="pub-splash__bar" aria-hidden="true">
            <span class="pub-splash__bar-fill"></span>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.addEventListener("error", function (event) {
        var root = document.getElementById("root");
        if (!root || root.dataset.mounted === "1") return;
        var message =
          (event && event.error && event.error.message) ||
          (event && event.message) ||
          "Erro ao carregar a página.";
        root.innerHTML =
          '<div class="pub-fallback pub-fallback--fatal"><h1>Não foi possível exibir esta página</h1><p>' +
          message +
          "</p></div>";
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

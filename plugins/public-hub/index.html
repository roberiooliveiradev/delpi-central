<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#003866" />
    <link rel="icon" type="image/svg+xml" href="/p/logoMinhaDelpi.svg" />
    <title>Minha DELPI</title>
    <script>
      // Aplica o tema salvo antes da renderização (evita flash). Sem escolha
      // fixada, o CSS segue a preferência do sistema operacional.
      (function () {
        try {
          var t = localStorage.getItem("pub-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <p class="pub-boot" aria-live="polite">Carregando…</p>
    </div>
    <script>
      window.addEventListener("error", function (event) {
        var root = document.getElementById("root");
        if (!root || root.dataset.mounted === "1") return;
        var message =
          (event && event.error && event.error.message) ||
          (event && event.message) ||
          "Erro ao carregar a página.";
        root.innerHTML =
          '<div class="pub-fallback pub-fallback--fatal"><h1>Não foi possível exibir esta página</h1><p>' +
          message +
          "</p></div>";
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  # Chunks Vite (/p/assets/*-HASH.js) — nunca SPA fallback (evita HTML cacheado como JS).
  location ^~ /p/assets/ {
    alias /usr/share/nginx/html/assets/;
    error_page 404 = @public_hub_asset_missing;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location @public_hub_asset_missing {
    default_type text/plain;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    return 404 "asset not found\n";
  }

  location = /p/index.html {
    alias /usr/share/nginx/html/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  # Rotas públicas canônicas: /p/{app}/{page}/{token}
  location ^~ /p/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /p/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  # Alias legado: /welcome/{token} → customer-experience / thanks
  location /welcome/ {
    alias /usr/share/nginx/html/;
    try_files $uri /welcome/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location = /healthz {
    default_type text/plain;
    return 200 "ok";
  }
}

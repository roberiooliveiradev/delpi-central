server {
  listen 80;

  root /usr/share/nginx/html;

  # Rotas públicas canônicas: /p/{app}/{page}/{token}
  # (build com base "/p/", então assets vivem em /p/assets/*)
  location /p/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /p/index.html;
  }

  # Alias legado: /welcome/{token} -> customer-experience / thanks
  # Mantém QR codes já impressos funcionando. Serve o mesmo index (assets em /p/).
  location /welcome/ {
    alias /usr/share/nginx/html/;
    try_files $uri /welcome/index.html;
  }

  location = /healthz {
    default_type text/plain;
    return 200 "ok";
  }
}

<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produtos Novos — Protótipo UX</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#183047;background:#edf2f6}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1240px;margin:20px auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 5px 25px #19334c15}.head{background:#122e47;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.head small{color:#bdd0df}.nav{display:flex;overflow:auto;gap:5px;padding:12px 18px;background:#f4f7fa;border-bottom:1px solid #dce4eb}.nav button{white-space:nowrap;border:0;background:transparent;padding:9px 13px;border-radius:7px;color:#36566d}.nav button.active{background:#1c638c;color:#fff}main{padding:22px;min-height:460px}h1{font-size:23px;margin:0}h2{font-size:18px;margin:0 0 12px}p{color:#607588}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tools>*{padding:10px;border:1px solid #d8e2eb;border-radius:8px;background:white;min-width:140px}.tools input{flex:1}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.card,.box{border:1px solid #dbe5ed;border-radius:10px;padding:16px}.card small{color:#6c8091}.card strong{display:block;font-size:28px;margin-top:7px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.button{border:0;border-radius:8px;padding:10px 14px;background:#1c638c;color:#fff}.muted{color:#698093;font-size:12px}.tag{background:#e7f0f6;padding:5px 9px;border-radius:15px;font-size:12px;display:inline-block}.tag.issue{background:#fff0d0;color:#805400}.tag.done{background:#ddefe2;color:#256038}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:600px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e7edf2}th{font-size:12px;color:#677c90;background:#f7f9fb}td button{background:none;border:0;color:#125d8c;text-decoration:underline}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.entry{padding:12px 0;border-bottom:1px solid #e7edf2}.entry:last-child{border:0}.entry label{display:block;margin-bottom:7px}.entry select{width:100%;padding:8px;border:1px solid #ccd9e4;border-radius:6px}textarea{width:100%;padding:10px;border:1px solid #ccd9e4;border-radius:8px}.notice{padding:12px;border:1px dashed #b9cbd8;background:#f8fafc;border-radius:8px;margin:13px 0;color:#4f677a}.footer{padding:15px 24px;background:#f4f7fa;color:#61778b;font-size:12px}.back{border:0;background:none;color:#16618c;padding:0;margin-bottom:15px}@media(max-width:720px){.shell{margin:0;border-radius:0}.cards,.split{grid-template-columns:repeat(2,1fr)}main{padding:14px}}@media(max-width:430px){.cards,.split{grid-template-columns:1fr}.head{padding:14px}} 
</style></head><body><div class="shell"><header class="head"><div><strong>▦ Portal Engenharia</strong><br><small>Ferramentas / Produtos Novos</small></div><span class="tag">DEMO · PROPOSED</span></header><nav class="nav" id="nav"></nav><main id="main"></main><footer class="footer">PROC-0073 · Dados fictícios · Sem integração ou alterações de produção</footer></div>
<script>
const names=[['visao','Visão geral'],['programacao','Programação'],['acompanhamentos','Acompanhamentos'],['pendencias','Pendências'],['historico','Histórico'],['detalhes','Detalhes da OP'],['checklist','Checklist'],['solicitar','Solicitar acompanhamento']];
const orders=[{id:'OP-1042',p:'Conjunto PN-201',u:'Matriz',d:'29/10/2026',status:'Prevista',k:'prev',pct:0},{id:'OP-1043',p:'Chicote PN-318',u:'Filial',d:'30/10/2026',status:'Solicitado',k:'sol',pct:0},{id:'OP-1044',p:'Terminal PN-072',u:'Matriz',d:'03/11/2026',status:'Em acompanhamento',k:'doing',pct:60},{id:'OP-1045',p:'Conector PN-110',u:'Filial',d:'05/11/2026',status:'Pendência técnica',k:'issue',pct:40},{id:'OP-1046',p:'Conjunto PN-209',u:'Matriz',d:'06/11/2026',status:'Concluído',k:'done',pct:100}];
let tab='visao',selected=orders[2],unit='Todas',period='Semana',query='',checks={Corte:'Conforme',Decapagem:'Não verificada',Crimpagem:'Não verificada',Montagem:'Não verificada'};
const main=document.getElementById('main'),nav=document.getElementById('nav');
const safe=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const status=o=>'<span class="tag '+(o.k==='issue'?'issue':o.k==='done'?'done':'')+'">'+safe(o.status)+'</span>';
function page(t){tab=t;render();}
function title(a,b){return '<div class="row"><div><h1>'+a+'</h1><p>'+b+'</p></div><span class="tag">SIMULAÇÃO</span></div>'}
function filt(){return '<div class="tools"><select id="period">'+['Semana','Mês','Personalizado'].map(x=>'<option '+(x===period?'selected':'')+'>'+x+'</option>').join('')+'</select><select id="unit">'+['Todas','Matriz','Filial'].map(x=>'<option '+(x===unit?'selected':'')+'>'+x+'</option>').join('')+'</select><input id="search" placeholder="Buscar produto ou OP" value="'+safe(query)+'"></div><div class="muted">Carga Máquina: conexão ainda não inventariada. Período demonstrativo.</div>'}
function filtered(){return orders.filter(o=>(unit==='Todas'||o.u===unit)&&(!query||(o.id+' '+o.p).toLowerCase().includes(query.toLowerCase())))}
function table(a){return '<div class="box table"><table><thead><tr><th>OP / Produto</th><th>Unidade</th><th>Data prevista</th><th>Situação</th><th></th></tr></thead><tbody>'+a.map(o=>'<tr><td><b>'+o.id+'</b><br><small>'+o.p+'</small></td><td>'+o.u+'</td><td>'+o.d+'</td><td>'+status(o)+'</td><td><button data-op="'+o.id+'">Abrir</button></td></tr>').join('')+'</tbody></table></div>'}
function render(){nav.innerHTML=names.map(([k,v])=>'<button data-page="'+k+'" class="'+(k===tab?'active':'')+'">'+v+'</button>').join('');let s='';
if(tab==='visao'){s=title('Produtos Novos','Planejamento e Acompanhamento da Produção')+filt()+'<div class="cards">'+[['05','OPs previstas'],['01','Solicitados'],['01','Em andamento'],['01','Pendências']].map(x=>'<div class="card"><small>'+x[1]+'</small><strong>'+x[0]+'</strong><span class="muted">Exemplo</span></div>').join('')+'</div><h2>Próximas OPs</h2>'+table(filtered())+'<div class="notice">Visão antecipada: programação não é início real de produção.</div>'}
if(tab==='programacao')s=title('Programação de OPs','Produtos novos por semana, mês e período selecionado')+filt()+'<div class="row"><h2>OPs previstas</h2><button class="button" data-page="solicitar">Solicitar acompanhamento</button></div>'+table(filtered());
if(tab==='acompanhamentos')s=title('Acompanhamentos','Fila por unidade, situação e responsável')+table(orders.filter(o=>['sol','doing','issue'].includes(o.k)))+'<div class="notice">Matriz: Engenharia. Filial: Qualidade. Regras de designação formal ainda pendentes.</div>';
if(tab==='pendencias')s=title('Pendências e divergências','Correções técnicas e verificações incompletas')+'<div class="box"><div class="entry row"><div><b>DIV-001 — Divergência técnica</b><p>OP-1045 · Qualidade filial → Engenharia matriz</p></div><span class="tag issue">Em correção</span></div><div class="entry row"><div><b>Checklist incompleto</b><p>OP-1044 · Operações não verificadas</p></div><button class="button" data-op="OP-1044">Abrir</button></div></div><div class="notice">Não existem bloqueios/liberações reais neste protótipo.</div>';
if(tab==='historico')s=title('Histórico','Eventos e indicadores auditáveis')+'<div class="box">'+[['28/10 08:45','Programação consultada','OP-1042'],['28/10 09:10','Solicitação demonstrativa','OP-1043'],['28/10 10:20','Verificação demonstrativa','OP-1044'],['28/10 11:15','Divergência demonstrativa','OP-1045']].map(x=>'<div class="entry row"><div><b>'+x[1]+'</b><p>'+x[2]+'</p></div><span class="muted">'+x[0]+'</span></div>').join('')+'</div><div class="notice">Indicadores reais ainda sem baseline medido.</div>';
if(tab==='detalhes')s='<button class="back" data-page="programacao">← Programação</button>'+title('Detalhes da '+selected.id,selected.p+' · '+selected.u)+'<div class="split"><div class="box"><h2>Produção</h2><p>Data prevista: '+selected.d+'</p><p>Situação: '+selected.status+'</p><p>Desenho e revisão: a consultar na fonte oficial</p></div><div class="box"><h2>Acompanhamento</h2><p>Progresso ilustrativo: '+selected.pct+'%</p><button class="button" data-page="checklist">Abrir checklist</button></div></div><div class="notice">A aprovação e alteração do desenho dependem da Engenharia autorizada e do sistema oficial.</div>';
if(tab==='checklist')s='<button class="back" data-page="detalhes">← Detalhes da OP</button>'+title('Checklist por operação',selected.id+' · '+selected.p)+'<div class="notice">Operações são exemplos, não representam roteiro ou especificação técnica oficial.</div><div class="box">'+Object.entries(checks).map(([k,v])=>'<div class="entry"><label><b>'+k+'</b> — critério técnico: fonte oficial</label><select data-check="'+k+'">'+['Não verificada','Conforme','Divergente'].map(x=>'<option '+(v===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div>').join('')+'</div><p>Observações</p><textarea rows="3" placeholder="Dados simulados; nada será salvo"></textarea><div style="margin-top:12px"><button class="button" data-demo="check">Simular registro</button></div>';
if(tab==='solicitar')s=title('Solicitar acompanhamento','Acionamento pelo líder — simulação')+'<div class="box"><div class="entry"><label>OP autorizada</label><select id="reqop">'+orders.map(o=>'<option value="'+o.id+'">'+o.id+' — '+o.p+'</option>').join('')+'</select></div><div class="entry"><label>Operação atual</label><select><option>Corte</option><option>Decapagem</option><option>Crimpagem</option><option>Montagem</option></select></div><div class="entry"><label>Tipo de solicitação</label><select><option>Início efetivo informado pelo líder</option><option>Solicitação antecipada</option></select></div><p>Observação</p><textarea rows="3"></textarea><div style="margin-top:12px"><button class="button" data-demo="request">Simular solicitação</button></div></div><div class="notice">Nenhuma solicitação real é criada. Futuro backend deve exigir RBAC, idempotência e vínculo canônico com a OP.</div>';
main.innerHTML=s;}
document.addEventListener('click',e=>{const t=e.target.closest('[data-page]');if(t){page(t.dataset.page);return;}const o=e.target.closest('[data-op]');if(o){selected=orders.find(x=>x.id===o.dataset.op);page('detalhes');return;}const d=e.target.closest('[data-demo]');if(d){alert('Ação simulada: nada foi persistido ou enviado.')}});
document.addEventListener('change',e=>{if(e.target.id==='period')period=e.target.value;if(e.target.id==='unit')unit=e.target.value;if(e.target.dataset.check)checks[e.target.dataset.check]=e.target.value;if(['period','unit'].includes(e.target.id))render();});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById('search');el.focus();el.setSelectionRange(pos,pos)}});
render();
</script></body></html>

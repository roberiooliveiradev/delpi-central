mechanism:
  problem: >
    presentation-class evidence_source anchors (display_format e vocabulário
    afim) só bypassavam o veto de eco owner sob delivery=aggregation. Sob
    record_detail / explanation / enumeration, a âncora nunca ecoada travava
    evidência empresarial real e congruente em UNSATISFIED/INCONCLUSIVE.
  fix: >
    classe de âncora de apresentação reconhecida sob QUALQUER delivery —
    bypass de eco exige business evidence + congruência de entidade
    (required_scope entity=/entity_kind= ∩ owner anchor tokens); todos os
    gates downstream (scope, operação, identidade, completude de coleção,
    métrica de agregação, pós-condição ACT) inalterados. Frozenset de
    apresentação estendido com display/display_format/format/layout/
    presentation.
  reuse_decision: EXTEND
  new_abstractions: none


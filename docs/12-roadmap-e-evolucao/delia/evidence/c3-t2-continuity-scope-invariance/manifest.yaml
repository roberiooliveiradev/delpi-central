mechanism:
  first_divergent_boundary: >
    _strip_window_args — a canonicalização de escopo removia seletores de
    janela comprovados (page/page_size/offset/limit/cursor…, depth < 2) mas
    deixava o container esvaziado para trás. `params:{page,page_size}`
    → `params:{}` produzia par `params=<opaque>` e digest divergentes de
    `params` ausente, quebrando a identidade de consulta em
    _invocation_scope e gerando marcador `__container__=params` espúrio
    em _required_scope_pairs.
  observed_live: >
    INT2_A/INT2_E (eval or-qwen14b-a7b1dfa635af): página 1 sem `params`,
    páginas 2/3 com `params` contendo SOMENTE seletores de janela →
    escopo idêntico materialmente, grupos divergentes → INCONCLUSIVE
    honesto com união real 40+40+29=109. INT2_E também declarou
    required_args `params:{page:2}` → `params=<opaque:44136fa355b3678a>`
    + `__container__=params` — escopo requerido indemonstrável.
  fix: >
    container não-vazio que esvazia EXCLUSIVAMENTE por remoção de
    seletores de janela é descartado da forma canônica — nenhum contrato
    de owner define escopo material para container que só carregava
    controles de janela. Container originalmente vazio preservado
    (equivalência vazio≡ausente não comprovada → fail-closed).
  fix_three_points: >
    (a) _strip_window_args: container esvaziado exclusivamente por
    strip de janela é descartado; (b) _required_scope_pairs: par
    opaco de container top-level removido (marcador __container__ é a
    restrição demonstrável); (c) _invocation_scope:
    _drop_empty_scope_containers — container com zero argumentos-folha
    é forma de envelope, não escopo (params:{} ≡ ausente; contrato
    TÉO provado live). Required-side preserva __container__ para
    declared-empty — 'params domain must be empty' continua
    contradizendo folhas materiais.
  same_diff_resolves: >
    INT2-REQUIRED-SCOPE-OPAQUE-PARAMS — digest byte-idêntico
    (44136fa355b3678a) comprova que o opaco era o container esvaziado;
    required_args só-janela canonicaliza para escopo vazio e
    declared-empty para marcador exact-domain.


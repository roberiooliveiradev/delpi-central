<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Documento</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 18px;
            color: #333;
            margin: 0;
        }
        .details {
            margin-bottom: 20px;
        }
        .details p {
            margin: 5px 0;
            font-size: 14px;
            color: #555;
        }
        .message {
            background: #f0f8ff;
            border-left: 4px solid #0078d7;
            padding: 10px;
            border-radius: 4px;
            color: #333;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Detalhes do Documento</h1>
        </div>
        <div class="details">
            <p><strong>Número do Documento:</strong>%numDoc%</p>
            <p><strong>Série:</strong>%serie%</p>
            <p><strong>Número do Fornecedor:</strong>%fornece%</p>
            <p><strong>Loja:</strong>%loja%</p>
        </div>
        <div class="message">
            %msgEnv%
        </div>
    </div>
</body>
</html>

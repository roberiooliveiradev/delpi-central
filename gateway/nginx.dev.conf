events {}

http {

  resolver 127.0.0.11 valid=30s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Porta pública do Host (ex.: localhost:9080 → 9080); sem porta → 80
  map $http_host $delpi_forwarded_port {
    default 80;
    "~:([0-9]+)$" $1;
  }

  # LGPD Art. 46 — rate limiting
  limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=api_zone:10m rate=50r/s;
  limit_req_zone $binary_remote_addr zone=tv_present_zone:10m rate=8r/s;
  limit_req_status 429;

  server {
    listen 80;

    client_max_body_size 20m;

    # F2c redirects (PVA → commercial): ativar só no flip do runbook —
    # include /etc/nginx/snippets/commercial-f2c-redirects.conf;
    # Prematuro: F5 em PVA manda para commercial e o portal cai na home.

    # =============================
    # CORE SOCKET (proxy_pass estático — variável quebra Engine.IO no dev)
    # =============================
    location ^~ /socket.io {
      proxy_pass http://core-api:8000;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_read_timeout 86400;
      proxy_buffering off;
    }

    # Respostas de API: no-store (evita browser cachear HTML do portal em path de API).
    # =============================
    # CORE API
    # =============================
    location ^~ /core-api/ {
      limit_req zone=api_zone burst=50 nodelay;
      set $upstream_core_api core-api:8000;
      rewrite ^/core-api/?(.*)$ /$1 break;
      proxy_pass http://$upstream_core_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # =============================
    # KEYCLOAK
    # =============================
    location /auth/ {
      #limit_req zone=auth_zone burst=20 nodelay;
      set $upstream_keycloak keycloak:8080;
      proxy_pass http://$upstream_keycloak;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $delpi_forwarded_port;
      proxy_redirect off;
      # Keycloak com Host=localhost + sslRequired=external emite Secure;
      # em HTTP local o browser descarta o cookie → OAuth 400.
      proxy_cookie_flags ~ nosecure samesite=lax;
    }

    # =============================
    # API DELPI SOCKET
    # proxy_pass estático — variável + path completo quebra Engine.IO (401/404 no FastAPI)
    # =============================
    location ^~ /apps/api-delpi/socket.io {
      proxy_pass http://api-delpi:8000/socket.io;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400;
      proxy_buffering off;
    }

    # =============================
    # MINHA DELPI AI API
    # =============================
    location ^~ /apps/minha-delpi-ai/api/ {
      set $upstream_minha_delpi_ai_api delpi-minha-delpi-ai-api:8000;
      rewrite ^/apps/minha-delpi-ai/api/?(.*)$ /$1 break;
      proxy_pass http://$upstream_minha_delpi_ai_api;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 86400;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # =============================
    # STRATEGIC INDICATORS API
    # =============================
    location ^~ /apps/strategic-indicators-api/ {
      set $upstream_si_api strategic-indicators-api:8000;
      rewrite ^/apps/strategic-indicators-api/?(.*)$ /$1 break;
      proxy_pass http://$upstream_si_api;

      proxy_http_version 1.1;
      proxy_set_header Host $host;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # =============================
    # TRANSFORMÔMETRO API
    # =============================
    location ^~ /apps/transformometro-api/ {
      set $upstream_tm_api transformometro-api:8000;
      rewrite ^/apps/transformometro-api/?(.*)$ /$1 break;
      proxy_pass http://$upstream_tm_api;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;

      proxy_read_timeout 86400;
      proxy_buffering off;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # =============================
    # MANUTENÇÃO API
    # =============================
    location ^~ /apps/maintenance-api/ {
      set $upstream_maint_api maintenance-api:8000;
      rewrite ^/apps/maintenance-api/?(.*)$ /$1 break;
      proxy_pass http://$upstream_maint_api;

      proxy_http_version 1.1;
      proxy_set_header Host $host;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }


    # =============================
    # COMMERCIAL API
    # =============================
    location ^~ /apps/commercial-api/ {
      set $upstream_commercial_api commercial-api:8000;
      rewrite ^/apps/commercial-api/?(.*)$ /$1 break;
      proxy_pass http://$upstream_commercial_api;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;

      proxy_read_timeout 86400;
      proxy_buffering off;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }


    # =============================
    # CIPA API
    # =============================
    location ^~ /apps/cipa-api/ {
      set $upstream_cipa_api cipa-api:8000;
      rewrite ^/apps/cipa-api/?(.*)$ /$1 break;
      proxy_pass http://$upstream_cipa_api;

      proxy_http_version 1.1;
      proxy_set_header Host $host;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # =============================
    # Comitê de Ética e Conduta API
    # =============================
    location ^~ /apps/comite-etica-conduta-api/ {
      set $upstream_cec_api comite-etica-conduta-api:8000;
      rewrite ^/apps/comite-etica-conduta-api/?(.*)$ /$1 break;
      proxy_pass http://$upstream_cec_api;

      proxy_http_version 1.1;
      proxy_set_header Host $host;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

# =============================
    # CUSTOMER EXPERIENCE API (FastAPI dedicado — admin JWT + público por token)
    # =============================
    location ^~ /apps/customer-experience-api/ {
      set $upstream_cx_api customer-experience-api:8000;
      rewrite ^/apps/customer-experience-api/?(.*)$ /$1 break;
      proxy_pass http://$upstream_cx_api;

      proxy_http_version 1.1;
      proxy_set_header Host $host;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    location ^~ /apps/production-control-api/ {
      set $upstream_pc_api production-control-api:8000;
      rewrite ^/apps/production-control-api/?(.*)$ /$1 break;
      proxy_pass http://$upstream_pc_api;

      proxy_http_version 1.1;
      # WebSocket do cockpit público do operador (/public/machine-load/{token}/ws)
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;

      proxy_read_timeout 86400;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    location ^~ /apps/tv-dashboard-api/public/present/ {
      limit_req zone=tv_present_zone burst=20 nodelay;

      set $upstream_tv_dashboard_api tv-dashboard-api:8000;
      rewrite ^/apps/tv-dashboard-api/?(.*)$ /$1 break;
      proxy_pass http://$upstream_tv_dashboard_api;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;

      proxy_read_timeout 86400;
      proxy_buffering off;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    location ^~ /apps/tv-dashboard-api/ {
      # Vídeo da biblioteca até 200 MB (+ margem multipart). Default global permanece 20m.
      client_max_body_size 220m;
      set $upstream_tv_dashboard_api tv-dashboard-api:8000;
      rewrite ^/apps/tv-dashboard-api/?(.*)$ /$1 break;
      proxy_pass http://$upstream_tv_dashboard_api;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;

      proxy_read_timeout 86400;
      proxy_buffering off;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # =============================
    # PÁGINAS PÚBLICAS (sem login, fora do portal) — public-hub
    # Canônico: /p/{app}/{page}/{token}  ·  Alias legado: /welcome/{token}
    # =============================
    location ^~ /p/ {
      set $upstream_public_hub delpi-public-hub;
      proxy_pass http://$upstream_public_hub;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location ^~ /welcome/ {
      set $upstream_public_hub delpi-public-hub;
      proxy_pass http://$upstream_public_hub;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # =============================
    # API DELPI
    # =============================
    location ^~ /apps/api-delpi/ {
      set $upstream_api_delpi api-delpi:8000;
      rewrite ^/apps/api-delpi/?(.*)$ /$1 break;
      proxy_pass http://$upstream_api_delpi;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # Alinhado ao TOTVS_QUERY_TIMEOUT (default 120s) e ao nginx.conf de prod.
      proxy_read_timeout 180s;
      proxy_connect_timeout 10s;
      proxy_send_timeout 180s;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # =============================
    # CÓDIGO DE ÉTICA — documentos estáticos (PDF em /documents/)
    # Não proxyar /apps/codigo-etica/ inteiro (navegação fica no Portal).
    # =============================
    location ^~ /apps/codigo-etica/documents/ {
      set $upstream_codigo_etica delpi-codigo-etica;
      rewrite ^/apps/codigo-etica/documents/(.*)$ /documents/$1 break;
      proxy_pass http://$upstream_codigo_etica;

      proxy_http_version 1.1;
      proxy_set_header Host $host;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # =============================
    # GUIAS E PROCEDIMENTOS (MFE federado)
    # Assets + remoteEntry: locations genéricas /apps/([^/]+)/assets/ → delpi-$1
    # (delpi-guias-procedimentos). Deep links de navegação ficam no Portal;
    # o container serve SPA (try_files) para health/smoke interno.
    # Contrato público (exemplos; assets usam location genérica /apps/([^/]+)/assets/):
    #   /apps/guias-procedimentos/assets/remoteEntry.js
    #   /apps/lancamento-notas-fiscais/assets/remoteEntry.js
    #   /apps/guias-procedimentos
    #   /apps/guias-procedimentos/guias/emissao-nota-fiscal
    # =============================

    # =============================
    # LEGADO — Cadastro de Kaizens → Kaizômetro
    # =============================
    location = /apps/cadastro-kaizen {
      return 301 /apps/kaizometro;
    }
    location ^~ /apps/cadastro-kaizen/ {
      rewrite ^/apps/cadastro-kaizen/(.*)$ /apps/kaizometro/$1 permanent;
    }

    # =============================
    # MICROFRONTENDS - REMOTE ENTRY
    # Sem cache forte para permitir atualização de plugin
    # =============================
    location ~ ^/apps/([^/]+)/assets/remoteEntry\.js$ {
      set $service delpi-$1;

      proxy_pass http://$service/assets/remoteEntry.js;

      proxy_http_version 1.1;
      proxy_set_header Host $host;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;

      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # =============================
    # MICROFRONTENDS - ESM (.mjs)
    # Browsers exigem MIME JavaScript para module scripts (ex.: worker PDF.js).
    # =============================
    location ~ ^/apps/([^/]+)/assets/(.*\.mjs)$ {
      set $service delpi-$1;
      set $asset_path $2;

      proxy_pass http://$service/assets/$asset_path;

      proxy_http_version 1.1;
      proxy_set_header Host $host;

      proxy_hide_header Content-Type;
      add_header Content-Type "application/javascript" always;
    }

    # =============================
    # MICROFRONTENDS - ASSETS ONLY
    # =============================
    location ~ ^/apps/([^/]+)/assets/(.*)$ {
      set $service delpi-$1;
      set $asset_path $2;

      proxy_pass http://$service/assets/$asset_path;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # =============================
    # PORTAL DEV (VITE)
    # =============================
    location / {
      set $upstream_portal portal:5173;
      proxy_pass http://$upstream_portal;

      proxy_http_version 1.1;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
    }
  }
}
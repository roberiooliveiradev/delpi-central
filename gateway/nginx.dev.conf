events {}

http {

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;

    client_max_body_size 20m;

    # SOCKET.IO
    location /socket.io/ {
        proxy_pass http://core-api:8000/socket.io/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
    }

    # CORE API
    location ^~ /core-api/ {
      proxy_pass http://core-api:8000/;
      proxy_set_header Host $host;
    }

    # KEYCLOAK
    location /auth/ {
      proxy_pass http://keycloak:8080;
      proxy_set_header Host $host;
    }

    # API DELPI
    location ^~ /apps/api-delpi/ {
      proxy_pass http://api-delpi:8000/;
    }

    # DASHBOARD
    location ^~ /apps/dashboard-delpi/ {
      proxy_pass http://dashboard-delpi/;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PORTAL (VITE DEV SERVER)
    location / {
      proxy_pass http://portal:5173;

      proxy_http_version 1.1;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
    }

  }
}
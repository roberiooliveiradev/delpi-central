events {}

http {

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;

    client_max_body_size 20m;

    # CORE SOCKET
    location /socket.io/ {
        proxy_pass http://core-api:8000/socket.io/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
    }

    # CORE API
    location ^~ /core-api/ {
      proxy_pass http://core-api:8000/;
      proxy_set_header Host $host;
    }

    # KEYCLOAK
    location /auth/ {
      proxy_pass http://keycloak:8080;
      proxy_set_header Host $host;
    }

    # HELPDESK / GLPI
    location /helpdesk/ {

      proxy_pass http://inventario-ti-glpi-1/;

      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;

      proxy_read_timeout 86400;
    }

    # API DELPI SOCKET
    location ^~ /apps/api-delpi/socket.io/ {
        proxy_pass http://api-delpi:8000/socket.io/;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
    }

    # API DELPI
    location ^~ /apps/api-delpi/ {
      proxy_pass http://api-delpi:8000/;
    }

    # MICROAPPS DINÂMICOS
    location ~ ^/apps/([^/]+)/ {

        set $service $1;

        proxy_pass http://$service;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
    }

    # PORTAL DEV
    location / {
      proxy_pass http://portal:5173;

      proxy_http_version 1.1;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
    }

  }
}
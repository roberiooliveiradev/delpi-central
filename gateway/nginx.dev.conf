events {}

http {

  resolver 127.0.0.11 valid=30s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;

    client_max_body_size 20m;

    # =============================
    # CORE SOCKET
    # =============================
    location /socket.io/ {
      proxy_pass http://core-api:8000/socket.io/;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
    }

    # =============================
    # CORE API
    # =============================
    location ^~ /core-api/ {
      proxy_pass http://core-api:8000/;
      proxy_set_header Host $host;
    }

    # =============================
    # KEYCLOAK
    # =============================
    location /auth/ {
      proxy_pass http://keycloak:8080;
      proxy_set_header Host $host;
    }

    # =============================
    # API DELPI SOCKET
    # =============================
    location ^~ /apps/api-delpi/socket.io/ {
      proxy_pass http://api-delpi:8000/socket.io/;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
    }

    # =============================
    # MINHA DELPI AI API
    # =============================
    location ^~ /apps/minha-delpi-ai/api/ {
      proxy_pass http://minha-delpi-ai-api:8000/;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # =============================
    # API DELPI
    # =============================
    location ^~ /apps/api-delpi/ {
      proxy_pass http://api-delpi:8000/;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # =============================
    # MICROFRONTENDS - REMOTE ENTRY
    # Sem cache forte para permitir atualização de plugin
    # =============================
    location ~ ^/apps/([^/]+)/assets/remoteEntry\.js$ {
      set $service $1;

      proxy_pass http://$service/assets/remoteEntry.js;

      proxy_http_version 1.1;
      proxy_set_header Host $host;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;

      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # =============================
    # MICROFRONTENDS - ASSETS ONLY
    # =============================
    location ~ ^/apps/([^/]+)/assets/(.*)$ {
      set $service $1;
      set $asset_path $2;

      proxy_pass http://$service/assets/$asset_path;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # =============================
    # PORTAL DEV (VITE)
    # =============================
    location / {
      proxy_pass http://portal:5173;

      proxy_http_version 1.1;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
    }
  }
}
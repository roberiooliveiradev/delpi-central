events {}

http {

  resolver 127.0.0.11 valid=30s ipv6=off;

  proxy_buffer_size 256k;
  proxy_buffers 8 512k;
  proxy_busy_buffers_size 512k;
  large_client_header_buffers 8 256k;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $http_x_forwarded_proto $delpi_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  server {
    listen 80;
    server_name centraldelpi.com.br www.centraldelpi.com.br;

    client_max_body_size 20m;

    location ~ /\.(env|git|htaccess|htpasswd|docker|npmrc) {
      deny all;
      return 404;
    }

    location /socket.io/ {
      proxy_pass http://core-api:8000/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
      proxy_read_timeout 86400;
    }

    location ^~ /core-api/ {
      proxy_pass http://core-api:8000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
    }

    location /auth/ {
      proxy_pass http://keycloak:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header Forwarded "for=$proxy_add_x_forwarded_for;proto=$delpi_proto;host=$host";
      proxy_redirect off;
    }

    location ^~ /apps/api-delpi/socket.io/ {
      set $api_delpi_socket http://api-delpi:8000;
      proxy_pass $api_delpi_socket/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
      proxy_read_timeout 86400;
    }

    location ^~ /apps/api-delpi/ {
      proxy_pass http://api-delpi:8000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
      proxy_read_timeout 86400;
    }

    # =====================================================
    # MICROFRONTEND ENTRY REAL: NÃO CACHEAR
    # URL pública usada pelo portal:
    # /apps/<plugin>/assets/remoteEntry.js
    # =====================================================
    location ~ ^/apps/([^/]+)/assets/remoteEntry\.js$ {
      set $service delpi-$1;

      proxy_pass http://$service/assets/remoteEntry.js;

      proxy_http_version 1.1;
      proxy_set_header Host $service;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;

      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # =====================================================
    # COMPATIBILIDADE OPCIONAL
    # Caso algum app ainda use /apps/<plugin>/remoteEntry.js
    # =====================================================
    # location ~ ^/apps/([^/]+)/remoteEntry\.js$ {
    #   set $service delpi-$1;

    #   proxy_pass http://$service/assets/remoteEntry.js;

    #   proxy_http_version 1.1;
    #   proxy_set_header Host $service;
    #   proxy_set_header X-Real-IP $remote_addr;
    #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #   proxy_set_header X-Forwarded-Proto $delpi_proto;

    #   add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    #   add_header Pragma "no-cache" always;
    #   add_header Expires "0" always;

    #   proxy_no_cache 1;
    #   proxy_cache_bypass 1;
    # }

    # =====================================================
    # ASSETS ESTÁTICOS DOS PLUGINS
    # cache longo para chunks/css/fontes/imagens
    # EXCETO remoteEntry.js, tratado acima
    # =====================================================
    location ~ ^/apps/([^/]+)/assets/(.*)$ {
      set $service delpi-$1;

      proxy_pass http://$service/assets/$2;

      proxy_http_version 1.1;
      proxy_set_header Host $service;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # =====================================================
    # MICROAPPS DINÂMICOS - DEMAIS ROTAS
    # sem cache agressivo para HTML/fallback
    # =====================================================
    location ~ ^/apps/([^/]+)/(.*)$ {
      set $service delpi-$1;

      rewrite ^/apps/[^/]+/(.*)$ /$1 break;
      proxy_pass http://$service;

      proxy_http_version 1.1;
      proxy_set_header Host $service;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;

      proxy_read_timeout 86400;
    }

    location / {
      proxy_pass http://portal:80;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
    }
  }

  server {
    listen 80;
    server_name helpdesk.centraldelpi.com.br;

    client_max_body_size 20m;

    location / {
      proxy_pass http://inventario-ti-glpi-1:80;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 86400;
    }
  }
}
events {}

http {

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    client_max_body_size 20m;

    location /socket.io/ {
      proxy_pass http://core-api:8000;
      proxy_http_version 1.1;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_read_timeout 86400;
    }

    # =========================
    # CORE API
    # =========================
    location ^~ /core-api/ {
      proxy_pass http://core-api:8000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # KEYCLOAK 
    # =========================
    location /auth/ {
      proxy_pass http://keycloak:8080/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Prefix /auth;
    }

    # =========================
    # API DELPI
    # =========================
    location ^~ /apps/api-delpi/ {
      proxy_pass http://api-delpi:8000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # Controle MP - Microfrontend Embedded
    # =========================
    # location ^~ /apps/controle-mp/ {
    #   proxy_pass http://controle-mp:5175/;
    #   proxy_http_version 1.1;

    #   proxy_set_header Upgrade $http_upgrade;
    #   proxy_set_header Connection $connection_upgrade;

    #   proxy_set_header Host $host;
    #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #   proxy_set_header X-Forwarded-Proto $scheme;

    #   proxy_read_timeout 86400;
    # }

    # =========================
    # test-microfrontend (Vite Dev) - Federate
    # =========================
    location = /apps/test-microfrontend/remoteEntry.js {
      proxy_pass http://test-microfrontend:5175/assets/remoteEntry.js;
    }

    location ^~ /apps/test-microfrontend/ {
      proxy_pass http://test-microfrontend:5175/;
    }


    # =========================
    # PORTAL (Vite Dev)
    # =========================
    location / {
      proxy_pass http://portal:5173;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
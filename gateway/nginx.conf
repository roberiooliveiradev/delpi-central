events {}

http {

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  map $http_x_forwarded_proto $delpi_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  # =====================================================
  # DELPI PLATFORM
  # =====================================================
  server {
    listen 80;
    server_name centraldelpi.com.br www.centraldelpi.com.br;

    client_max_body_size 20m;

    # =========================
    # CORE SOCKET.IO
    # =========================
    location /socket.io/ {
      proxy_pass http://core-api:8000/socket.io/;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      proxy_read_timeout 86400;
    }

    # =========================
    # CORE API
    # =========================
    location ^~ /core-api/ {
      proxy_pass http://core-api:8000/;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
    }

    # =========================
    # KEYCLOAK
    # =========================
    location /auth/ {
      proxy_pass http://keycloak:8080;

      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_set_header X-Forwarded-Proto $delpi_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;

      proxy_set_header Forwarded "for=$proxy_add_x_forwarded_for;proto=$delpi_proto;host=$host";

      proxy_redirect off;
      proxy_buffering off;
    }

    # =========================
    # API DELPI SOCKET
    # =========================
    location ^~ /apps/api-delpi/socket.io/ {
      proxy_pass http://api-delpi:8000/socket.io/;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      proxy_read_timeout 86400;
    }

    # =========================
    # API DELPI
    # =========================
    location ^~ /apps/api-delpi/ {
      proxy_pass http://api-delpi:8000/;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
    }

    # =========================
    # MICROAPPS DINÂMICOS
    # =========================
    location ~ ^/apps/([^/]+)/ {

      set $service $1;

      proxy_pass http://$service;

      proxy_http_version 1.1;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      proxy_read_timeout 86400;
    }

    # =========================
    # PORTAL
    # =========================
    location / {
      proxy_pass http://portal:80;

      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
    }
  }

  # =====================================================
  # HELPDESK (GLPI)
  # =====================================================
  server {
    listen 80;
    server_name helpdesk.centraldelpi.com.br;

    client_max_body_size 20m;

    location /oauth2/ {
      proxy_pass http://oauth2-proxy-helpdesk:4180;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
    }

    location = /oauth2/auth {
      proxy_pass http://oauth2-proxy-helpdesk:4180/oauth2/auth;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Uri $request_uri;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }

    location @oauth2_signin {
      return 302 /oauth2/start?rd=https://$host$request_uri;
    }
    location / {
      auth_request /oauth2/auth;
      error_page 401 = @oauth2_signin;

      auth_request_set $user  $upstream_http_x_auth_request_user;
      auth_request_set $email $upstream_http_x_auth_request_email;

      proxy_set_header REMOTE_USER      $user;
      proxy_set_header HTTP_REMOTE_USER $user;
      proxy_set_header X-Forwarded-User $user;
      proxy_set_header X-Forwarded-Email $email;

      proxy_pass http://inventario-ti-glpi-1:80;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      proxy_read_timeout 86400;
    }
  }

}
events {}

http {

  resolver 127.0.0.11 valid=30s ipv6=off;

  proxy_buffer_size 256k;
  proxy_buffers 8 512k;
  proxy_busy_buffers_size 512k;
  large_client_header_buffers 8 256k;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $http_x_forwarded_proto $delpi_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  # =====================================================
  # DELPI PLATFORM
  # =====================================================
  server {

    listen 80;
    server_name centraldelpi.com.br www.centraldelpi.com.br;

    client_max_body_size 20m;

    # =====================================================
    # BLOQUEIOS DE SEGURANÇA
    # =====================================================
    location ~ /\.(env|git|htaccess|htpasswd|docker|npmrc) {
      deny all;
      return 404;
    }

    # =====================================================
    # SOCKET.IO CORE
    # =====================================================
    location /socket.io/ {

      proxy_pass http://core-api:8000/socket.io/;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      proxy_read_timeout 86400;
    }

    # =====================================================
    # CORE API
    # =====================================================
    location ^~ /core-api/ {

      proxy_pass http://core-api:8000/;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
    }

    # =====================================================
    # KEYCLOAK
    # =====================================================
    location /auth/ {

      proxy_pass http://keycloak:8080;

      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_set_header X-Forwarded-Proto $delpi_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;

      proxy_set_header Forwarded "for=$proxy_add_x_forwarded_for;proto=$delpi_proto;host=$host";

      proxy_redirect off;
    }

    # =====================================================
    # API DELPI SOCKET
    # =====================================================
    location ^~ /apps/api-delpi/socket.io/ {

      proxy_pass http://api-delpi:8000/socket.io/;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      proxy_read_timeout 86400;
    }

    # =====================================================
    # API DELPI
    # =====================================================
    location ^~ /apps/api-delpi/ {

      proxy_pass http://api-delpi:8000/;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
    }

    # =====================================================
    # MICROAPPS DINÂMICOS
    # /apps/dashboard-delpi/assets/x.js
    # -> http://delpi-dashboard-delpi/assets/x.js
    # =====================================================
    location ~ ^/apps/([^/]+)/(.*)$ {

      set $service delpi-$1;

      rewrite ^/apps/[^/]+/(.*)$ /$1 break;

      proxy_pass http://$service;

      proxy_http_version 1.1;

      proxy_set_header Host $service;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_read_timeout 86400;
    }

    # =====================================================
    # PORTAL (SPA PRINCIPAL)
    # =====================================================
    location / {

      proxy_pass http://portal:80;

      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
    }
  }

  # =====================================================
  # HELPDESK (GLPI)
  # =====================================================
  server {

    listen 80;
    server_name helpdesk.centraldelpi.com.br;

    client_max_body_size 20m;

    location / {

      proxy_pass http://inventario-ti-glpi-1:80;

      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      proxy_read_timeout 86400;
    }
  }

}
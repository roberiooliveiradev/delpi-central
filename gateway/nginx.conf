events {}

http {

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  map $http_x_forwarded_proto $delpi_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  server {
    listen 80;
    server_name centraldelpi.com.br www.centraldelpi.com.br;

    client_max_body_size 20m;

    # =========================
    # CORE SOCKET.IO
    # =========================
    location /socket.io/ {
        proxy_pass http://core-api:8000/socket.io/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $delpi_proto;

        proxy_read_timeout 86400;
    }

    # =========================
    # CORE API
    # =========================
    location ^~ /core-api/ {
      proxy_pass http://core-api:8000/;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
    }

    # =========================
    # KEYCLOAK
    # =========================
    location /auth/ {
      proxy_pass http://keycloak:8080;

      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_set_header X-Forwarded-Proto $delpi_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;

      proxy_set_header Forwarded "for=$proxy_add_x_forwarded_for;proto=$delpi_proto;host=$host";

      proxy_redirect off;
      proxy_buffering off;
    }

    # =========================
    # API DELPI SOCKET
    # =========================
    location ^~ /apps/api-delpi/socket.io/ {
        proxy_pass http://api-delpi:8000/socket.io/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $delpi_proto;

        proxy_read_timeout 86400;
    }

    # =========================
    # API DELPI (EXPLÍCITA)
    # =========================
    location ^~ /apps/api-delpi/ {
      proxy_pass http://api-delpi:8000/;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
    }
    
    # =========================
    # HELP DESK (GLPI)
    # =========================
    location /helpdesk/ {

      proxy_pass http://inventario-ti-glpi-1/;

      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;

      proxy_read_timeout 86400;
    }

    # =========================
    # MICROAPPS DINÂMICOS
    # =========================
    location ~ ^/apps/([^/]+)/ {

        set $service $1;

        proxy_pass http://$service;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $delpi_proto;

        proxy_read_timeout 86400;
    }

    # =========================
    # GLPI ROOT ASSETS
    # =========================
    location ~ ^/(front|ajax|css|js|pics|vendor|plugins|files)/ {
        proxy_pass http://inventario-ti-glpi-1;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # PORTAL
    # =========================
    location / {
      proxy_pass http://portal:80;

      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
    }
  }
}
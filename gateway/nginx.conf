events {}

http {

  proxy_buffer_size 256k;
  proxy_buffers 8 512k;
  proxy_busy_buffers_size 512k;
  large_client_header_buffers 8 256k;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $http_x_forwarded_proto $delpi_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  # =====================================================
  # DELPI PLATFORM
  # =====================================================
  server {
    listen 80;
    server_name centraldelpi.com.br www.centraldelpi.com.br;

    client_max_body_size 20m;

    # SOCKET.IO
    location /socket.io/ {
      proxy_pass http://core-api:8000/socket.io/;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      proxy_read_timeout 86400;
    }

    # CORE API
    location ^~ /core-api/ {
      proxy_pass http://core-api:8000/;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
    }

    # KEYCLOAK
    location /auth/ {
      proxy_pass http://keycloak:8080;

      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_set_header X-Forwarded-Proto $delpi_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;

      proxy_set_header Forwarded "for=$proxy_add_x_forwarded_for;proto=$delpi_proto;host=$host";

      proxy_redirect off;
    }

    # API DELPI SOCKET
    location ^~ /apps/api-delpi/socket.io/ {
      proxy_pass http://api-delpi:8000/socket.io/;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      proxy_read_timeout 86400;
    }

    # API DELPI
    location ^~ /apps/api-delpi/ {
      proxy_pass http://api-delpi:8000/;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
    }

    # MICROAPPS DINÂMICOS
    location ~ ^/apps/([^/]+)/ {

      set $service $1;

      proxy_pass http://$service;

      proxy_http_version 1.1;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      proxy_read_timeout 86400;
    }

    # PORTAL
    location / {
      proxy_pass http://portal:80;

      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
    }
  }

  # =====================================================
  # HELPDESK (GLPI)
  # =====================================================
  server {
    listen 80;
    server_name helpdesk.centraldelpi.com.br;

    client_max_body_size 20m;

    # oauth2-proxy endpoints
    location /oauth2/ {
      proxy_pass http://oauth2-proxy-helpdesk:4180;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_set_header X-Forwarded-Proto https;
    }

    # auth verification
    location = /oauth2/auth {
      proxy_pass http://oauth2-proxy-helpdesk:4180/oauth2/auth;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Uri $request_uri;
      proxy_set_header X-Forwarded-Proto https;

      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }

    # redirect to login
    location @oauth2_signin {
      return 302 https://helpdesk.centraldelpi.com.br/oauth2/start?rd=https://helpdesk.centraldelpi.com.br$request_uri;
    }

    location / {

      auth_request /oauth2/auth;
      error_page 401 = @oauth2_signin;

      auth_request_set $user $upstream_http_x_auth_request_user;
      auth_request_set $email $upstream_http_x_auth_request_email;

      proxy_set_header REMOTE_USER $user;
      proxy_set_header HTTP_REMOTE_USER $user;
      proxy_set_header X-Forwarded-User $user;
      proxy_set_header X-Forwarded-Email $email;

      proxy_pass http://inventario-ti-glpi-1:80;

      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      proxy_read_timeout 86400;
    }
  }

}
events {}

http {

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    client_max_body_size 20m;

    # =========================
    # SOCKET.IO
    # =========================
    location /socket.io/ {
        proxy_pass http://core-api:8000/socket.io/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
    }

    # =========================
    # CORE API
    # =========================
    location ^~ /core-api/ {
      proxy_pass http://core-api:8000/;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # KEYCLOAK
    # =========================
    location /auth/ {
      proxy_pass http://keycloak:8080;   # <- NÃO coloque "/" no final

      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # o que o Keycloak mais respeita:
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header X-Forwarded-Port  $server_port;

      # recomendo adicionar também o padrão RFC:
      proxy_set_header Forwarded "for=$proxy_add_x_forwarded_for;proto=$scheme;host=$host";

      # ⚠️ importante: com KC_HTTP_RELATIVE_PATH=/auth,
      # eu recomendo REMOVER o X-Forwarded-Prefix
      # proxy_set_header X-Forwarded-Prefix /auth;

      proxy_redirect off;
      proxy_buffering off;
    }

    # =========================
    # API DELPI
    # =========================
    location ^~ /apps/api-delpi/ {
      proxy_pass http://api-delpi:8000/;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # DASHBOARD DELPI
    # =========================
    location ^~ /apps/dashboard-delpi/ {
      proxy_pass http://dashboard-delpi:80/;

      proxy_http_version 1.1;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_read_timeout 86400;
    }

    # =========================
    # PORTAL
    # =========================
    location / {
      proxy_pass http://portal:80;

      proxy_http_version 1.1;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
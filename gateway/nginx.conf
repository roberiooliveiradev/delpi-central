events {}

http {

  resolver 127.0.0.11 valid=30s ipv6=off;

  proxy_buffer_size 256k;
  proxy_buffers 8 512k;
  proxy_busy_buffers_size 512k;
  large_client_header_buffers 8 256k;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $http_x_forwarded_proto $delpi_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  # LGPD Art. 46 — rate limiting para proteção contra força bruta
  limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=search_zone:10m rate=5r/s;
  # TV pública: payload + heartbeat + media — teto dedicado (anti-abuso; margem para kiosk)
  limit_req_zone $binary_remote_addr zone=tv_present_zone:10m rate=8r/s;
  # Transformômetro: página de revisão dispara vários GETs em paralelo (cadastro + diagramas)
  limit_req_zone $binary_remote_addr zone=tm_api_zone:10m rate=60r/s;
  limit_req_status 429;

  server {
    listen 80;
    server_name minhadelpi.com.br www.minhadelpi.com.br;

    client_max_body_size 20m;

    # 429 do limit_req: JSON (MFEs não devem receber HTML padrão do Nginx)
    error_page 429 = @api_rate_limited;

    location @api_rate_limited {
      default_type application/json;
      add_header Content-Type "application/json; charset=utf-8" always;
      return 429 '{"success":false,"message":"Muitas requisições em pouco tempo. Aguarde alguns segundos e tente novamente."}';
    }

    location ~ /\.(env|git|htaccess|htpasswd|docker|npmrc) {
      deny all;
      return 404;
    }

    # =============================
    # CORE SOCKET
    # =============================
    location /socket.io/ {
      proxy_pass http://core-api:8000/socket.io/;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      proxy_read_timeout 86400;
    }

    # Respostas de API: no-store (evita browser/CDN cachear HTML do portal em path de API).
    # =============================
    # CORE API
    # =============================
    location ^~ /core-api/ {
      limit_req zone=api_zone burst=50 nodelay;

      proxy_pass http://core-api:8000/;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # =============================
    # KEYCLOAK
    # =============================
    location /auth/ {
      proxy_pass http://keycloak:8080;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header Forwarded "for=$proxy_add_x_forwarded_for;proto=$delpi_proto;host=$host";

      proxy_redirect off;
    }

    # =============================
    # API DELPI SOCKET
    # proxy_pass estático — variável ($upstream_*) quebra upgrade WebSocket / Engine.IO
    # (mesmo padrão de nginx.dev.conf e Core /socket.io/)
    # Após recreate do container api-delpi: docker restart delpi-gateway
    # =============================
    location ^~ /apps/api-delpi/socket.io {
      proxy_pass http://api-delpi:8000/socket.io;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      proxy_read_timeout 86400;
      proxy_buffering off;
    }

    # =============================
    # MINHA DELPI AI API
    # =============================
    location ^~ /apps/minha-delpi-ai/api/ {
      limit_req zone=api_zone burst=30 nodelay;

      set $upstream_minha_delpi_ai_api delpi-minha-delpi-ai-api:8000;
      rewrite ^/apps/minha-delpi-ai/api/?(.*)$ /$1 break;
      proxy_pass http://$upstream_minha_delpi_ai_api;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 86400;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # =============================
    # STRATEGIC INDICATORS API (FastAPI dedicado)
    # =============================
    location ^~ /apps/strategic-indicators-api/ {
      limit_req zone=api_zone burst=50 nodelay;

      set $upstream_si_api strategic-indicators-api:8000;
      rewrite ^/apps/strategic-indicators-api/?(.*)$ /$1 break;
      proxy_pass http://$upstream_si_api;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      proxy_read_timeout 86400;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # =============================
    # TRANSFORMÔMETRO API
    # =============================
    location ^~ /apps/transformometro-api/ {
      limit_req zone=tm_api_zone burst=100 nodelay;

      set $upstream_tm_api transformometro-api:8000;
      rewrite ^/apps/transformometro-api/?(.*)$ /$1 break;
      proxy_pass http://$upstream_tm_api;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      proxy_read_timeout 86400;
      proxy_buffering off;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # =============================
    # MANUTENÇÃO API
    # =============================
    location ^~ /apps/maintenance-api/ {
      limit_req zone=api_zone burst=50 nodelay;

      set $upstream_maint_api maintenance-api:8000;
      rewrite ^/apps/maintenance-api/?(.*)$ /$1 break;
      proxy_pass http://$upstream_maint_api;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      proxy_read_timeout 86400;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    
    # =============================
    # CIPA API (FastAPI dedicado — atas e assinaturas)
    # =============================
    location ^~ /apps/cipa-api/ {
      limit_req zone=api_zone burst=50 nodelay;

      set $upstream_cipa_api cipa-api:8000;
      rewrite ^/apps/cipa-api/?(.*)$ /$1 break;
      proxy_pass http://$upstream_cipa_api;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      proxy_read_timeout 86400;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

# =============================
    # CUSTOMER EXPERIENCE API (FastAPI dedicado — admin JWT + público por token)
    # =============================
    location ^~ /apps/customer-experience-api/ {
      limit_req zone=api_zone burst=50 nodelay;

      set $upstream_cx_api customer-experience-api:8000;
      rewrite ^/apps/customer-experience-api/?(.*)$ /$1 break;
      proxy_pass http://$upstream_cx_api;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      proxy_read_timeout 86400;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # =============================
    # TV DASHBOARD API (FastAPI dedicado — admin JWT + público por token)
    # =============================
    location ^~ /apps/tv-dashboard-api/public/present/ {
      limit_req zone=tv_present_zone burst=20 nodelay;

      rewrite ^/apps/tv-dashboard-api/?(.*)$ /$1 break;
      proxy_pass http://tv-dashboard-api:8000;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      proxy_read_timeout 86400;
      proxy_buffering off;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    location ^~ /apps/tv-dashboard-api/ {
      limit_req zone=api_zone burst=50 nodelay;

      rewrite ^/apps/tv-dashboard-api/?(.*)$ /$1 break;
      proxy_pass http://tv-dashboard-api:8000;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      proxy_read_timeout 86400;
      proxy_buffering off;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # =============================
    # PÁGINAS PÚBLICAS (sem login, fora do portal) — public-hub
    # Canônico: /p/{app}/{page}/{token}  ·  Alias legado: /welcome/{token}
    # =============================
    location ^~ /p/ {
      limit_req zone=api_zone burst=30 nodelay;

      set $upstream_public_hub delpi-public-hub;
      proxy_pass http://$upstream_public_hub;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
    }

    location ^~ /welcome/ {
      limit_req zone=api_zone burst=30 nodelay;

      set $upstream_public_hub delpi-public-hub;
      proxy_pass http://$upstream_public_hub;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
    }

    # =============================
    # API DELPI
    # =============================
    location ^~ /apps/api-delpi/ {
      limit_req zone=api_zone burst=50 nodelay;

      set $upstream_api_delpi api-delpi:8000;
      rewrite ^/apps/api-delpi/?(.*)$ /$1 break;
      proxy_pass http://$upstream_api_delpi;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      proxy_read_timeout 86400;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # =============================
    # CÓDIGO DE ÉTICA — documentos estáticos (PDF em /documents/)
    # Não proxyar /apps/codigo-etica/ inteiro (navegação fica no Portal).
    # =============================
    location ^~ /apps/codigo-etica/documents/ {
      limit_req zone=api_zone burst=30 nodelay;

      set $upstream_codigo_etica delpi-codigo-etica;
      rewrite ^/apps/codigo-etica/documents/(.*)$ /documents/$1 break;
      proxy_pass http://$upstream_codigo_etica;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # =============================
    # GUIAS E PROCEDIMENTOS (MFE federado)
    # Assets + remoteEntry: locations genéricas /apps/([^/]+)/assets/ → delpi-$1
    # (delpi-guias-procedimentos). Deep links de navegação ficam no Portal;
    # o container serve SPA (try_files) para health/smoke interno.
    # Contrato público:
    #   /apps/guias-procedimentos/assets/remoteEntry.js
    #   /apps/guias-procedimentos
    #   /apps/guias-procedimentos/guias/emissao-nota-fiscal
    # =============================

    # =============================
    # MICROFRONTENDS - REMOTE ENTRY
    # Sem cache forte para permitir atualização de plugin
    # =============================
    location ~ ^/apps/([^/]+)/assets/remoteEntry\.js$ {
      set $service delpi-$1;

      proxy_pass http://$service/assets/remoteEntry.js;

      proxy_http_version 1.1;
      proxy_set_header Host $service;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;

      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # =============================
    # MICROFRONTENDS - RUNTIME CRÍTICO (React MF)
    # Patches pós-build (renderChunk) não alteram o hash no filename — no-store evita
    # browser/CDN servir fn_import/App/index stale após deploy (mesmo URL).
    # =============================
    location ~ ^/apps/([^/]+)/assets/(__federation_fn_import-[^/]+\.js|index-[^/]+\.js|App-[^/]+\.js)$ {
      set $service delpi-$1;

      proxy_pass http://$service/assets/$2;

      proxy_http_version 1.1;
      proxy_set_header Host $service;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header CDN-Cache-Control "no-store" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # =============================
    # MICROFRONTENDS - ESM (.mjs)
    # Browsers exigem MIME JavaScript para module scripts (ex.: worker PDF.js).
    # =============================
    location ~ ^/apps/([^/]+)/assets/(.*\.mjs)$ {
      set $service delpi-$1;

      proxy_pass http://$service/assets/$2;

      proxy_http_version 1.1;
      proxy_set_header Host $service;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      proxy_hide_header Content-Type;
      add_header Content-Type "application/javascript" always;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # =============================
    # MICROFRONTENDS - ASSETS
    # Demais assets do plugin com cache longo
    # =============================
    location ~ ^/apps/([^/]+)/assets/(.*)$ {
      set $service delpi-$1;

      proxy_pass http://$service/assets/$2;

      proxy_http_version 1.1;
      proxy_set_header Host $service;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # =============================
    # PORTAL SHELL — assets Vite (/assets/*)
    # =============================
    location ^~ /assets/ {
      proxy_pass http://portal:80;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      # Preserva Cache-Control do portal (immutable em 200, no-store em 404).
      proxy_pass_header Cache-Control;
      proxy_pass_header CDN-Cache-Control;
    }

    # =============================
    # PORTAL SHELL
    # Todas as rotas de navegação ficam com o Portal
    # =============================
    location / {
      proxy_pass http://portal:80;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;

      add_header CDN-Cache-Control "no-store" always;
    }
  }

  server {
    listen 80;
    server_name helpdesk.centraldelpi.com.br;

    client_max_body_size 20m;

    location / {
      set $upstream_glpi inventario-ti-glpi-1:80;
      proxy_pass http://$upstream_glpi;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      proxy_read_timeout 86400;
    }
  }
}
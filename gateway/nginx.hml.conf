events {}

http {
  # DNS Docker — resolução sob demanda (variáveis em proxy_pass).
  # Evita falha de start quando portal/core-api/api-delpi ainda não existem.
  resolver 127.0.0.11 valid=30s ipv6=off;

  proxy_buffer_size 256k;
  proxy_buffers 8 512k;
  proxy_busy_buffers_size 512k;
  large_client_header_buffers 8 256k;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $http_x_forwarded_proto $delpi_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=api_zone:10m rate=50r/s;
  limit_req_zone $binary_remote_addr zone=core_session_zone:10m rate=40r/s;
  limit_req_status 429;

  # Entrada HTTP legado (:18080 no host → 80 no container).
  # Mantida para health/rollback operacional. Login PKCE no browser exige HTTPS.
  # EXISTING_EQUIVALENT: gateway/nginx.conf (prod) + proxy dinâmico HML.
  # REUSE_DECISION: EXTEND — dual listen 80/443 ssl; sem vhost produtivo.
  server {
    listen 80 default_server;
    server_name _;
    set $hml_forwarded_port 18080;
    include /etc/nginx/snippets/hml-proxy-locations.conf;
  }

  # HTTPS interno de homologação (:18443 no host → 443 no container).
  # Certs montados em runtime (volume); chaves fora do Git e da imagem.
  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/hml-certs/hml-gateway.crt;
    ssl_certificate_key /etc/nginx/hml-certs/hml-gateway.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Sem HSTS irreversível em homologação por IP.
    set $hml_forwarded_port 18443;
    include /etc/nginx/snippets/hml-proxy-locations.conf;
  }
}

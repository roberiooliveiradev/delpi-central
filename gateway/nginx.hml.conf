events {}

http {
  # DNS Docker — resolução sob demanda (variáveis em proxy_pass).
  # Evita falha de start quando portal/core-api/api-delpi ainda não existem.
  resolver 127.0.0.11 valid=30s ipv6=off;

  proxy_buffer_size 256k;
  proxy_buffers 8 512k;
  proxy_busy_buffers_size 512k;
  large_client_header_buffers 8 256k;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $http_x_forwarded_proto $delpi_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=api_zone:10m rate=50r/s;
  limit_req_zone $binary_remote_addr zone=core_session_zone:10m rate=40r/s;
  limit_req_status 429;

  # Entrada HTTP de homologação (fase LAN). O container escuta 80; a porta
  # publicada no host é 18080 (DELPI_HML_PUBLIC_PORT). Não usar o domínio
  # de produção. HTTPS/intranet fica para etapa futura — este arquivo não
  # altera o Nginx do host nem o gateway produtivo.
  #
  # EXISTING_EQUIVALENT: gateway/nginx.conf (prod) + proxy_pass dinâmico
  # já usado em /apps/production-control-api/ neste arquivo.
  # REUSE_DECISION: EXTEND — variáveis $upstream_* + error_page 502/504
  # controlado; sem fallback para delpi-* produtivo.
  server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20m;

    error_page 429 = @api_rate_limited;
    error_page 502 503 504 = @hml_upstream_unavailable;

    location @api_rate_limited {
      default_type application/json;
      add_header Content-Type "application/json; charset=utf-8" always;
      return 429 '{"success":false,"message":"Muitas requisições em pouco tempo. Aguarde alguns segundos e tente novamente."}';
    }

    location @hml_upstream_unavailable {
      default_type application/json;
      add_header Content-Type "application/json; charset=utf-8" always;
      add_header Cache-Control "no-store" always;
      return 503 '{"success":false,"message":"Serviço de homologação indisponível nesta etapa. Keycloak: /auth/. Demais apps ainda não foram ativados."}';
    }

    location ~ /\.(env|git|htaccess|htpasswd|docker|npmrc) {
      deny all;
      return 404;
    }

    location /socket.io/ {
      set $upstream_core_api core-api:8000;
      proxy_pass http://$upstream_core_api/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
      proxy_read_timeout 86400;
    }

    location = /core-api/me {
      limit_req zone=core_session_zone burst=80 nodelay;
      set $upstream_core_api core-api:8000;
      proxy_pass http://$upstream_core_api/me;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
      add_header Cache-Control "no-store" always;
    }

    location ^~ /core-api/me/ {
      limit_req zone=core_session_zone burst=80 nodelay;
      set $upstream_core_api core-api:8000;
      rewrite ^/core-api/me/(.*)$ /me/$1 break;
      proxy_pass http://$upstream_core_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
      add_header Cache-Control "no-store" always;
    }

    location ^~ /core-api/ {
      limit_req zone=api_zone burst=50 nodelay;
      set $upstream_core_api core-api:8000;
      rewrite ^/core-api/?(.*)$ /$1 break;
      proxy_pass http://$upstream_core_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
      add_header Cache-Control "no-store" always;
    }

    location /auth/ {
      limit_req zone=auth_zone burst=20 nodelay;
      set $upstream_keycloak keycloak:8080;
      # Sem URI no proxy_pass: preserva /auth/... (KC_HTTP_RELATIVE_PATH=/auth).
      proxy_pass http://$upstream_keycloak;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 18080;
      proxy_redirect off;
      proxy_buffering off;
      proxy_read_timeout 60s;
    }

    location ^~ /apps/api-delpi/socket.io {
      set $upstream_api_delpi api-delpi:8000;
      proxy_pass http://$upstream_api_delpi/socket.io;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
      proxy_read_timeout 86400;
    }

    location ^~ /apps/api-delpi/ {
      limit_req zone=api_zone burst=50 nodelay;
      set $upstream_api_delpi api-delpi:8000;
      rewrite ^/apps/api-delpi/?(.*)$ /$1 break;
      proxy_pass http://$upstream_api_delpi;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
      proxy_read_timeout 86400;
      add_header Cache-Control "no-store" always;
    }

    location ^~ /apps/production-control-api/ {
      limit_req zone=api_zone burst=50 nodelay;
      set $upstream_pc_api production-control-api:8000;
      rewrite ^/apps/production-control-api/?(.*)$ /$1 break;
      proxy_pass http://$upstream_pc_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
      proxy_read_timeout 86400;
      add_header Cache-Control "no-store" always;
    }

    # MFE: DNS = serviço Compose HML (plugin-ui, production-control).
    # Nunca prefixar delpi- (apontaria para produção se redes se cruzassem).
    location ~ ^/apps/([^/]+)/assets/remoteEntry\.js$ {
      set $service $1;
      proxy_pass http://$service/assets/remoteEntry.js;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
      add_header Cache-Control "no-store" always;
    }

    location ~ ^/apps/([^/]+)/assets/(.*)$ {
      set $service $1;
      proxy_pass http://$service/assets/$2;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
    }

    location ^~ /assets/ {
      set $upstream_portal portal:80;
      proxy_pass http://$upstream_portal;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
    }

    location / {
      set $upstream_portal portal:80;
      proxy_pass http://$upstream_portal;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $delpi_proto;
      add_header Cache-Control "no-store" always;
    }
  }
}

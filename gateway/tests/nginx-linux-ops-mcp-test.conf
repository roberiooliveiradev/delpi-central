# CI-only Nginx syntax harness for the shared MCP locations.
# Production gateway config and upstreams are not modified by these tests.
events {}
http {
  resolver 127.0.0.11 valid=30s ipv6=off;
  limit_req_zone $binary_remote_addr zone=api_zone:10m rate=50r/s;
  log_format tv_access_sanitized '$remote_addr - $request_method $uri $status';
  map $http_x_forwarded_proto $delpi_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }
  server {
    listen 8080;
    server_name localhost;
    include /etc/nginx/snippets/linux-ops-mcp-locations.conf;
  }
}

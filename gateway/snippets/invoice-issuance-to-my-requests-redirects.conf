# Soft cutover E12 — bookmarks invoice-issuance → my-requests
# Ver docs/12-roadmap-e-evolucao/my-requests/PARITY-P0.md (Gate soft cutover)
# e PLAYBOOK § E12.
# Assets /apps/invoice-issuance/assets/* NÃO redirecionam (MFE no Compose até E13).

location = /apps/invoice-issuance {
  return 302 /apps/my-requests;
}

location = /apps/invoice-issuance/ {
  return 302 /apps/my-requests;
}

location = /apps/invoice-issuance/filial-01 {
  return 302 /apps/my-requests/new?type=invoice-issuance;
}

location = /apps/invoice-issuance/filial-02 {
  return 302 /apps/my-requests/new?type=invoice-issuance;
}

# Demais deep links de navegação (exclui assets/ para remoteEntry)
location ~ ^/apps/invoice-issuance/(?!assets/) {
  return 302 /apps/my-requests;
}

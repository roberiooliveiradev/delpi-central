# MFE: DNS = serviço Compose HML (plugin-ui, production-control, my-requests, engineering).
# Nunca prefixar delpi- (apontaria para produção se redes se cruzassem).
location ~ ^/apps/([^/]+)/assets/remoteEntry\.js$ {
  set $service $1;
  proxy_pass http://$service/assets/remoteEntry.js;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $delpi_proto;
  add_header Cache-Control "no-store" always;
}

location ~ ^/apps/([^/]+)/assets/(.*)$ {
  set $service $1;
  proxy_pass http://$service/assets/$2;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $delpi_proto;
}

location ^~ /assets/ {

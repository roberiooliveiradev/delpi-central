# Locations compartilhadas HTTP/HTTPS do gateway HML.
# Requer no server: $hml_forwarded_port e map $delpi_proto.

client_max_body_size 20m;

error_page 429 = @api_rate_limited;
error_page 502 503 504 = @hml_upstream_unavailable;

location @api_rate_limited {
  default_type application/json;
  add_header Content-Type "application/json; charset=utf-8" always;
  return 429 '{"success":false,"message":"Muitas requisições em pouco tempo. Aguarde alguns segundos e tente novamente."}';
}

location @hml_upstream_unavailable {
  default_type application/json;
  add_header Content-Type "application/json; charset=utf-8" always;
  add_header Cache-Control "no-store" always;
  return 503 '{"success":false,"message":"Serviço de homologação indisponível nesta etapa. Keycloak: /auth/. Demais apps ainda não foram ativados."}';
}

location ~ /\.(env|git|htaccess|htpasswd|docker|npmrc) {
  deny all;
  return 404;
}

# Engine.IO/Socket.IO: NÃO usar proxy_pass com variável + URI path
# (`http://$upstream/.../`) — o nginx descarta a query string (EIO=4) e o
# core-api responde 400 "unsupported version". Padrão canônico: variável
# só no host + $request_uri (ver nginx.conf / nginx.dev.conf).
location /socket.io/ {
  set $upstream_core_api core-api:8000;
  proxy_pass http://$upstream_core_api$request_uri;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $delpi_proto;
  proxy_read_timeout 86400;
  access_log /var/log/nginx/access.log tv_access_sanitized;
}

location = /core-api/me {
  limit_req zone=core_session_zone burst=80 nodelay;
  set $upstream_core_api core-api:8000;
  proxy_pass http://$upstream_core_api/me;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $delpi_proto;
  add_header Cache-Control "no-store" always;
}

location ^~ /core-api/me/ {
  limit_req zone=core_session_zone burst=80 nodelay;
  set $upstream_core_api core-api:8000;
  rewrite ^/core-api/me/(.*)$ /me/$1 break;
  proxy_pass http://$upstream_core_api;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $delpi_proto;
  add_header Cache-Control "no-store" always;
}

location ^~ /core-api/ {
  limit_req zone=api_zone burst=50 nodelay;
  set $upstream_core_api core-api:8000;
  rewrite ^/core-api/?(.*)$ /$1 break;
  proxy_pass http://$upstream_core_api;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $delpi_proto;
  add_header Cache-Control "no-store" always;
}

# Keycloak HML — proxy comum (KC_HTTP_RELATIVE_PATH=/auth).
# Causa Admin Console: limit_req em TODO /auth/ + error_page 429→JSON
# quebrava import dinâmico de módulos JS (MIME application/json).
# Produção não aplica auth_zone em /auth/; HML limita só endpoints sensíveis.

# Assets estáticos do tema/console — sem rate limit (fan-out paralelo de JS/CSS).
location ^~ /auth/resources/ {
  set $upstream_keycloak keycloak:8080;
  proxy_pass http://$upstream_keycloak;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $delpi_proto;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $hml_forwarded_port;
  proxy_redirect off;
  proxy_buffering off;
  proxy_read_timeout 60s;
}

# Admin Console UI + Admin REST — sem auth_zone.
# Autorização continua no Keycloak (sessão admin / RBAC); não é bypass.
location ^~ /auth/admin/ {
  set $upstream_keycloak keycloak:8080;
  proxy_pass http://$upstream_keycloak;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $delpi_proto;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $hml_forwarded_port;
  proxy_redirect off;
  proxy_buffering off;
  proxy_read_timeout 60s;
}

# Emissão de token, authorize e logout — rate limit anti-abuso.
location ~ ^/auth/realms/[^/]+/protocol/openid-connect/(token|auth|logout)$ {
  limit_req zone=auth_zone burst=20 nodelay;
  set $upstream_keycloak keycloak:8080;
  proxy_pass http://$upstream_keycloak;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $delpi_proto;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $hml_forwarded_port;
  proxy_redirect off;
  proxy_buffering off;
  proxy_read_timeout 60s;
}

# Login actions / recuperação de credenciais — rate limit.
location ~ ^/auth/realms/[^/]+/login-actions/ {
  limit_req zone=auth_zone burst=20 nodelay;
  set $upstream_keycloak keycloak:8080;
  proxy_pass http://$upstream_keycloak;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $delpi_proto;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $hml_forwarded_port;
  proxy_redirect off;
  proxy_buffering off;
  proxy_read_timeout 60s;
}

# Demais /auth/ (discovery, JWKS, páginas de login, account) — sem auth_zone.
location /auth/ {
  set $upstream_keycloak keycloak:8080;
  proxy_pass http://$upstream_keycloak;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $delpi_proto;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $hml_forwarded_port;
  proxy_redirect off;
  proxy_buffering off;
  proxy_read_timeout 60s;
}

location ^~ /apps/api-delpi/socket.io {
  set $upstream_api_delpi api-delpi:8000;
  # Mesmo gotcha: variável + URI path perde query; rewrite + host-only proxy_pass.
  rewrite ^/apps/api-delpi/socket\.io(.*)$ /socket.io$1 break;
  proxy_pass http://$upstream_api_delpi;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $delpi_proto;
  proxy_read_timeout 86400;
  access_log /var/log/nginx/access.log tv_access_sanitized;
}


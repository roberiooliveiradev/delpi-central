# F2c — redirects Portal do Vendedor → Portal Comercial
# NÃO ativar no nginx até homologação § 2.1.1 (paridade UX já no commercial).
# Ver docs/12-roadmap-e-evolucao/commercial/F2C-CUTOVER-RUNBOOK.md
#
# Conteúdo a copiar para nginx.conf / nginx.dev.conf no flip.

location = /apps/pedidos-venda-abertos {
  return 302 /apps/commercial/open-orders;
}

location = /apps/pedidos-venda-abertos/ {
  return 302 /apps/commercial/open-orders;
}

location = /apps/pedidos-venda-abertos/clientes {
  return 302 /apps/commercial/customers;
}

location = /apps/pedidos-venda-abertos/configuracao {
  return 302 /apps/commercial/seller-portfolios;
}

# Deep link cliente: /clientes/{codigo}/{loja} → /customers/{codigo}/{loja}
location ~ ^/apps/pedidos-venda-abertos/clientes/([^/]+)/([^/]+)/?$ {
  return 302 /apps/commercial/customers/$1/$2;
}

# F2c — redirects MFEs legados → Portal Comercial
# Ver docs/12-roadmap-e-evolucao/commercial/F2C-CUTOVER-RUNBOOK.md
# Incluído pelos nginx.conf canônicos de produção e desenvolvimento.
#
# Mantém deep links de PVA (clientes / configuração) e redireciona assets
# dos containers removidos para as rotas nativas do Portal Comercial.

# --- Pedidos de venda em aberto (Portal do Vendedor) ---
location = /apps/pedidos-venda-abertos {
  return 302 /apps/commercial/open-orders;
}

location = /apps/pedidos-venda-abertos/ {
  return 302 /apps/commercial/open-orders;
}

location = /apps/pedidos-venda-abertos/clientes {
  return 302 /apps/commercial/customers;
}

location = /apps/pedidos-venda-abertos/configuracao {
  return 302 /apps/commercial/seller-portfolios;
}

# Deep link cliente: /clientes/{codigo}/{loja} → /customers/{codigo}/{loja}
location ~ ^/apps/pedidos-venda-abertos/clientes/([^/]+)/([^/]+)/?$ {
  return 302 /apps/commercial/customers/$1/$2;
}

# Assets do container removido (senão nginx tenta proxy para delpi-pedidos-venda-abertos)
location ^~ /apps/pedidos-venda-abertos/assets/ {
  return 302 /apps/commercial/open-orders;
}

# --- Propostas comerciais (documento ADY) ---
location = /apps/propostas-comerciais {
  return 302 /apps/commercial/proposals;
}

location = /apps/propostas-comerciais/ {
  return 302 /apps/commercial/proposals;
}

location ~ ^/apps/propostas-comerciais/([^/]+)/pdf/?$ {
  return 302 /apps/commercial/proposals/$1;
}

location ~ ^/apps/propostas-comerciais/([^/]+)/?$ {
  return 302 /apps/commercial/proposals/$1;
}

location ^~ /apps/propostas-comerciais/assets/ {
  return 302 /apps/commercial/proposals;
}

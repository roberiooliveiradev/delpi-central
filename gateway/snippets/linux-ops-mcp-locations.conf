# Linux Operations MCP: publish ONLY Streamable HTTP and OAuth discovery.
# No healthz, SSH, Docker socket, host terminal, /docs or arbitrary API routes.
# Dynamic Docker DNS allows a profile-off MCP without breaking gateway startup.
# Explicit resource audience: https://minhadelpi.com.br/apps/linux-ops-mcp/mcp.

location ~ ^/apps/linux-ops-mcp/mcp/?$ {
  limit_req zone=api_zone burst=20 nodelay;
  client_max_body_size 128k;

  set $upstream_linux_ops_mcp linux-ops-mcp:8000;
  rewrite ^/apps/linux-ops-mcp/(.*)$ /$1 break;
  proxy_pass http://$upstream_linux_ops_mcp;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $delpi_proto;
  proxy_set_header Connection "";
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  proxy_buffering off;
  proxy_request_buffering off;

  add_header Cache-Control "no-store" always;
  access_log /var/log/nginx/access.log tv_access_sanitized;
}

location = /apps/linux-ops-mcp/.well-known/oauth-protected-resource {
  limit_req zone=api_zone burst=20 nodelay;

  set $upstream_linux_ops_mcp linux-ops-mcp:8000;
  rewrite ^/apps/linux-ops-mcp/(.*)$ /$1 break;
  proxy_pass http://$upstream_linux_ops_mcp;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $delpi_proto;
  proxy_read_timeout 10s;
  proxy_buffering off;

  add_header Cache-Control "no-store" always;
  access_log /var/log/nginx/access.log tv_access_sanitized;
}

# Prevent the generic portal fallback from exposing any other MCP app path.
location /apps/linux-ops-mcp/ {
  return 404;
}
